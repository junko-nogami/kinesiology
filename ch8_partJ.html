.cover .en{font-size:13px;color:var(--sub);letter-spacing:.08em;margin-bottom:26px;}

.tools button:hover{background:var(--main);color:#fff;}

<script>
const SLIDES = [

{type:"cover", title:"胸椎と胸郭の運動", en:"Movement of the Thoracic Spine and Thorax",
 sub:"第8章 四肢と体幹の運動 J",
 index:["<b>1.</b> 骨格（胸郭・胸椎・肋骨・胸骨）","<b>2.</b> 関節（肋椎関節・胸肋結合）","<b>3.</b> 胸郭の運動","<b>4.</b> 胸郭の筋（呼吸筋）"]},

/* ---------- 1 骨格 ---------- */
{type:"p", eyebrow:"1 骨格", title:"胸郭（図8-102、8-122）",
 items:[
  "胸郭は[[12]]個の[[胸椎]]、[[12]]対の[[肋骨]]および[[1]]個の[[胸骨]]からなる",
  "[[胸腔]]は[[心臓]]、[[肺臓]]などの重要臓器をおさめる[[保護容器]]となっている",
  "胸郭は1つの[[単位構造]]としておもに[[呼吸運動]]に関与する",
  "<b>胸郭上口</b>：[[第1胸椎]]、[[第1肋骨]]および[[胸骨柄上縁]]よりなる",
  "<b>胸郭下口</b>：[[第12胸椎]]、[[第12肋骨]]、[[第7]]・[[第8]]・[[第9肋軟骨]]のつくる[[肋骨弓]]および[[胸骨剣状突起下端]]よりなる",
  "左右の肋骨弓のなす角度を[[胸郭下角]]といい、成人では約[[70°]]である",
  "胸郭は[[乳幼児]]までは[[前後径]]と[[左右径]]がほぼ等しい[[樽型]]で、[[成人]]になると[[左右径]]が拡大して[[楕円形]]となる"
 ],
 note:"<b>形が変わるのは「立つ」から：</b>乳幼児は肋骨がほぼ水平に並ぶため断面が丸く（樽型）、立位・歩行で重力がかかると肋骨が下向きに傾き、左右に広い楕円になります。胸郭の形は<b>運動発達の結果</b>でもあります。"},

{type:"p", eyebrow:"1 骨格", title:"胸椎と肋骨",
 lead:"<b>2）胸椎</b>",
 items:[
  "胸椎の形態は[[椎骨の一般的な形状]]にほぼ一致している",
  "椎体は[[上位]]および[[下位胸椎]]では[[左右径]]が大きく、[[中位胸椎]]では[[前後径]]が大きい[[楕円形]]となる",
  "<b>3）肋骨</b>：後方で[[胸椎]]と、前方で[[胸骨]]と連結し、胸郭の[[側壁]]をつくる[[扁平骨]]である",
  "[[軟骨]]が骨化したものであるが、前方には一部[[肋軟骨]]が残っている",
  "[[上位7対]]は[[肋軟骨]]を介して[[胸骨]]に[[直接]]連結する（[[真肋]]）",
  "[[下位5対]]は直接胸骨に連結せず、すぐ[[上の肋骨]]に連結する（[[仮肋]]）",
  "そのうち[[第11]]、[[第12肋骨]]は末端が[[遊離]]した状態にある（[[浮遊肋]]）"
 ],
 note:"<b>7・5・2で覚える：</b><b>真肋7対</b>＋<b>仮肋5対</b>＝12対。仮肋のうち下の<b>2対（第11・12）が浮遊肋</b>。前方の支えがない浮遊肋は可動性が大きく、腎臓の位置関係でも重要になります。"},

{type:"p", eyebrow:"1 骨格", title:"胸骨",
 items:[
  "胸骨は胸郭[[前面]]にある[[扁平骨]]で、[[鎖骨]]および[[肋骨]]と関節を形成する",
  "上端は[[第3胸椎]]、下端は[[第9胸椎]]の高さに位置する",
  "胸骨は上から[[胸骨柄]]、[[胸骨体]]および[[剣状突起]]の[[3]]部分の[[軟骨結合]]からなる",
  "成人ではその大部分が[[骨化]]して[[単一骨]]となる"
 ],
 note:"<b>胸骨角（胸骨結合）は触診の基準点：</b>胸骨柄と胸骨体の境で、ここに<b>第2肋骨</b>が付きます。肋骨を数えるときはここから下に数えるのが定石です。"},

/* ---------- 2 関節 ---------- */
{type:"p", eyebrow:"2 関節", title:"肋椎関節（図8-123）",
 lead:"肋椎関節は[[胸椎]]と[[肋骨]]のあいだの関節で、[[肋骨頭関節]]と[[肋横突関節]]からなります。",
 items:[
  "<b>肋骨頭関節</b>：[[第1]]、[[第11]]、[[第12肋骨頭]]は同番号の胸椎椎体の[[単一の肋骨窩]]と[[1対1]]で連結する",
  "[[第2〜第10肋骨頭]]は[[第1〜第10胸椎]]の[[上]]および[[下肋骨窩]]とのあいだにできる[[半関節]]で連結する",
  "肋骨頭関節は[[放線状肋骨頭靱帯]]がこれを補強する",
  "<b>肋横突関節</b>：[[肋骨結節]]と[[同番号]]の[[胸椎横突起]]のあいだの関節である",
  "肋横突関節は[[外側]]および[[上肋横突靱帯]]が補強する"
 ],
 note:"<b>肋骨は2か所で椎骨に留まる：</b>椎体側の<b>肋骨頭関節</b>と横突起側の<b>肋横突関節</b>。この2点を結んだ線が肋骨の<b>運動軸</b>になり、軸の向きが上位肋骨と下位肋骨で違うことが、次の「胸郭の拡大方向」の話につながります。"},

{type:"p", eyebrow:"2 関節", title:"胸肋結合（図8-122）",
 lead:"胸肋領域には[[3]]種類の関節と結合があります。",
 items:[
  "<b>胸肋関節</b>：[[第2〜第7肋軟骨]]と[[胸骨]]の間の[[半関節]]である<ul><li>[[第1肋軟骨]]と胸骨は関節ではなく、[[軟骨結合]]をする</li></ul>",
  "<b>肋軟骨間関節</b>：[[第5〜第10肋軟骨]]が相互に接する部分にある[[半関節]]である",
  "<b>胸骨軟骨結合</b>：[[胸骨柄]]と[[胸骨体]]、[[胸骨体]]と[[剣状突起]]の結合で[[線維軟骨]]よりなる"
 ],
 note:"<b>「半関節」が多いのがポイント：</b>胸郭の前方は動きすぎても動かなすぎてもいけないため、わずかな滑りだけを許す<b>半関節（軟骨性のゆるい関節）</b>で構成されています。第1肋軟骨だけは関節ではなく固く結合しており、胸郭上部の安定に働きます。"},

/* ---------- 3 胸郭の運動 ---------- */
{type:"p", eyebrow:"3 胸郭の運動", title:"胸椎の運動（図8-124）",
 items:[
  "胸椎の[[椎間関節]]は[[前頭面]]と約[[20°]]の角度をなし、[[前後屈運動]]よりも[[回旋運動]]に有効な構造になっている",
  "胸椎の[[回旋運動]]は[[椎体]]を運動軸として、[[椎間関節]]の[[すべり運動]]と[[椎間円板]]の[[ねじれ運動]]で生ずる",
  "<b>前屈運動の制限因子</b>：[[棘間靱帯]]の緊張、[[関節包]]および[[関節靱帯]]の緊張、[[後縦靱帯]]の緊張",
  "<b>後屈運動の制限因子</b>：[[椎間関節]]の可動域、[[上下棘突起]]のぶつかり、[[前縦靱帯]]の緊張"
 ],
 note:"<b>「胸椎は回旋担当」：</b>椎間関節面が前頭面に近い向きをとるため、屈伸よりも回旋が得意です（第8章Hの表8-18でも、回旋は上位胸椎で大きく腰椎でほぼ消えました）。<b>腰をひねらず胸椎で回す</b>という指導の根拠がここにあります。"},

{type:"p", eyebrow:"3 胸郭の運動", title:"胸郭の拡大（左右・前後・上下）",
 items:[
  "<b>2）左右方向の拡大</b>：おもに[[下位肋骨]]の運動による",
  "下位肋骨は[[肋骨頭関節]]と[[肋横突関節]]を結んだ[[運動軸]]が[[矢状面]]に近いため、下位肋骨の[[挙上]]で胸郭の[[横径]]が増大する<ul><li>胸郭下部の拡張は[[横隔膜]]を[[伸張]]し、その[[収縮力]]を増大させる</li></ul>",
  "<b>3）前後方向の拡大</b>：主として[[上位肋骨]]の運動による",
  "上位肋骨では運動軸が[[前頭面]]に近いため、その[[挙上]]は胸郭の[[縦径]]を増大する。同時に[[胸骨]]を[[前上方]]に押し上げる",
  "<b>4）上下方向の拡大</b>：[[第1]]、[[第2肋骨]]の[[挙上]]と、[[横隔膜]]の[[収縮]]（[[下方移動]]）での胸郭拡大による",
  "胸郭の左右・前後、上下方向の拡大は[[呼吸運動]]の[[吸気]]における[[胸腔の拡大]]のために起こる"
 ],
 note:"<b>運動軸の向きで担当が決まる：</b>軸が<b>前頭面に近い上位肋骨＝前後（ポンプの柄）</b>、軸が<b>矢状面に近い下位肋骨＝左右（バケツの取っ手）</b>。同じ「挙上」でも、軸の向きが違うだけで広がる方向が変わります。"},

{type:"two", eyebrow:"3 胸郭の運動", title:"呼吸運動の形式（脚注）",
 left:{h:"腹式呼吸", items:[
   "[[横隔膜呼吸]]ともいう",
   "[[横隔膜]]の活動が[[大きく]]、[[腹部]]の動きが[[著明]]である",
   "[[男性]]の呼吸型とされる",
   "ただし[[女性]]でも横隔膜がまったく動かないわけではない"]},
 right:{h:"胸式呼吸", items:[
   "[[肋骨呼吸]]ともいう",
   "[[肋間筋]]による[[胸郭]]の動きがめだつ呼吸である",
   "一般に[[女性]]に胸式呼吸の傾向が強い",
   "[[妊娠時]]や[[衣服]]による[[腹部の締めつけ]]で著明となる"]},
 note:"<b>どちらか一方ではない：</b>腹式・胸式は「どちらが優位か」の違いであり、実際はつねに併用されています。妊娠や腹部の圧迫で横隔膜が下がりにくくなると、代償的に胸式の割合が増える——という<b>条件による変化</b>として理解しましょう。"},

/* ---------- 4 胸郭の筋 ---------- */
{type:"two", eyebrow:"4 胸郭の筋", title:"胸部の筋の分類",
 lead:"ここでは[[呼吸筋]]を中心に扱い、胸椎固有の運動に関する筋は[[頸椎]]および[[腰椎]]の項でふれます。胸部の筋は[[浅胸筋群]]、[[深胸筋群]]および[[横隔膜]]の[[3]]つに区分されます。",
 left:{h:"浅胸筋", items:[
   "[[大胸筋]]",
   "[[小胸筋]]",
   "[[鎖骨下筋]]",
   "[[前鋸筋]]",
   "（すべて[[胸郭]]から起こって、[[上肢帯]]または[[上腕骨]]に停止する）"]},
 right:{h:"深胸筋・横隔膜", items:[
   "<b>深胸筋</b>：[[肋骨挙筋]]、[[外肋間筋]]、[[内肋間筋]]、[[肋下筋]]、[[最内肋間筋]]、[[胸横筋]]",
   "<b>横隔膜</b>：[[腰部]]、[[肋骨部]]、[[胸骨部]]"]},
 note:"<b>分け方の基準：</b><b>浅胸筋は「胸郭→上肢」</b>に走るので上肢の筋としても働き、<b>深胸筋は「胸郭のなかで完結」</b>するので純粋な呼吸筋です。横隔膜だけは胸腔と腹腔の境をつくる膜状の筋として独立させます。"},

{type:"tbl", eyebrow:"4 表8-21", title:"胸郭の筋 ①肋間筋",
 head:["筋名","起始","停止","神経","作用"],
 rows:[
  ["<b>外肋間筋</b><br><span style='font-size:12px'>external intercostal ms.</span>","後端は[[肋骨結節]]、前端は[[肋軟骨初部]]にいたる","走行：後部では[[内上方→外下方]]、中部では[[後上方→前下方]]、前部では[[外上方→内下方]]","[[肋間神経]]<br>[[T1〜T11]]","外肋間筋は[[肋骨の挙上]]"],
  ["<b>内肋間筋</b><br><span style='font-size:12px'>internal intercostal ms.</span>","[[外肋間筋]]内側で、後端は[[肋骨角]]付近、前端は[[胸骨縁]]","走行：前部では[[下外方→上内方]]、中部では[[後外方→前内方]]、後部では[[下内方→上外方]]","[[肋間神経]]<br>[[T1〜T11]]","内肋間筋は[[肋骨の引き下げ]]（ただし[[前部]]は[[挙上]]）作用をする"]],
 note:"<b>走行が「たすきがけ」：</b>外肋間筋と内肋間筋は線維の向きがほぼ直交します。<b>外＝挙上（吸気）</b>、<b>内＝引き下げ（呼気）</b>が原則ですが、<b>内肋間筋の前部だけは挙上＝吸気に働く</b>という例外が試験で問われます。"},

{type:"tbl", eyebrow:"4 表8-21", title:"胸郭の筋 ②その他の深胸筋・横隔膜",
 head:["筋名","起始","停止","神経","作用"],

  "<b>1）外肋間筋</b>：後端は[[肋骨結節]]付近から、前端は[[前鋸筋]]、[[外腹斜筋]]の起始付近まで存在する",
  "それより前部は[[外肋間膜]]となって[[胸骨]]に達する",

  "<b>2）内肋間筋</b>：外肋間筋の[[内側]]にあり、前端は[[胸骨縁]]から、後端は[[肋骨角]]付近に終わる",

<script>
const slideEl=document.getElementById('slide');
const dotsEl=document.getElementById('dots');
let idx=0;
function blanks(t){return String(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<span class="blank" tabindex="0" role="button" aria-label="空欄">${a}</span>`);}
const li=arr=>arr.map(t=>`<li>${blanks(t)}</li>`).join('');
function render(){
  const s=SLIDES[idx];let h='';
  if(s.type==='cover'){
    h=`<div class="cover"><div class="sub">${s.sub}</div><h1>${s.title}</h1><div class="en">${s.en}</div><div class="idx">${s.index.join('<br>')}</div></div>`;
  }else{
    h+=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>`;
    if(s.lead) h+=`<p style="margin-bottom:14px;line-height:1.85;font-size:15.5px;">${blanks(s.lead)}</p>`;
    if(s.type==='p'){h+=`<ul>${li(s.items)}</ul>`;}
    else if(s.type==='tbl'){h+=`<div class="tblwrap"><table><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${blanks(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='mtx'){
      let th1='';
      if(s.groups){th1='<tr><th rowspan="2">筋</th>'+s.groups.map(g=>`<th class="grp" colspan="${g[1]}">${g[0]}</th>`).join('')+'</tr>';}
      h+=`<div class="tblwrap"><table class="matrix"><thead>${th1}<tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?c:(c?blanks('[['+c+']]'):'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='two'){
      h+=`<div class="two"><div class="col"><h4>${s.left.h}</h4><div class="body"><ul>${li(s.left.items)}</ul></div></div><div class="col alt"><h4>${s.right.h}</h4><div class="body"><ul>${li(s.right.items)}</ul></div></div></div>`;}
    if(s.note) h+=`<div class="note">${blanks(s.note)}</div>`;
  }
  slideEl.innerHTML=h;
  document.getElementById('cur').textContent=idx+1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  document.getElementById('prev').disabled=(idx===0);
  document.getElementById('next').disabled=(idx===SLIDES.length-1);
  slideEl.querySelectorAll('.blank').forEach(b=>{
    b.addEventListener('click',()=>b.classList.add('open'));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.classList.add('open');}});
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('tot').textContent=SLIDES.length;
SLIDES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`スライド${i+1}`);b.onclick=()=>{idx=i;render();};dotsEl.appendChild(b);});
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById('next').onclick=()=>{if(idx<SLIDES.length-1){idx++;render();}};
document.getElementById('btnNext').onclick=()=>{const b=slideEl.querySelector('.blank:not(.open)');if(b){b.classList.add('open','hint');setTimeout(()=>b.classList.remove('hint'),900);b.scrollIntoView({block:'center',behavior:'smooth'});}};
document.getElementById('btnAll').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.add('open'));
document.getElementById('btnReset').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.target.classList.contains('blank'))return;if(e.key==='ArrowRight'&&idx<SLIDES.length-1){idx++;render();}if(e.key==='ArrowLeft'&&idx>0){idx--;render();}});
render();
</script>
