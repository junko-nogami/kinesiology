<style>

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

tbody tr:nth-child(even){background:#faf7f7;}

.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}

.tools button:hover{background:var(--main);color:#fff;}

.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:520px;}

.dot.active{background:var(--main);transform:scale(1.35);}
.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

<script>
const SLIDES = [

{type:"cover", title:"足関節と足部の運動", en:"Movement of the Ankle Joint and Foot",
 sub:"第8章 四肢と体幹の運動 G",
 index:["<b>1.</b> 骨格（下腿骨・足根骨・中足骨・趾骨）","<b>2.</b> 関節（距腿関節・距骨下関節ほか）","<b>3.</b> 足関節・足部の運動","<b>4.</b> 足の筋","<b>5.</b> 足のアーチ","<b>6.</b> 足部の変形"]},

/* ---------- 1 骨格 ---------- */
{type:"p", eyebrow:"1 骨格", title:"足をつくる骨（図8-85）",
 items:[
  "<b>下腿骨</b>：[[脛骨]]、[[腓骨]]",
  "<b>足根骨</b>：[[距骨]]、[[踵骨]]、[[舟状骨]]、[[立方骨]]、[[内側楔状骨]]、[[中間楔状骨]]、[[外側楔状骨]]",
  "<b>中足骨</b>：[[母指側]]から[[第1]]〜[[第5]]中足骨",
  "<b>趾（指）骨</b>：母趾（指）は[[基節骨]]と[[末節骨]]、他の4趾（指）は[[基節骨]]・[[中節骨]]・[[末節骨]]",
  "足は[[7]]つの足根骨、[[5]]つの中足骨、[[14]]の趾（指）骨の合計[[26]]個の骨からなり、[[全体重]]を支持する[[単位合成体]]である"
 ],
 note:"<b>手と比べる：</b>手の手根骨は8個、足の足根骨は7個。母趾（指）だけ節が2つなのは母指と同じです。<b>7＋5＋14＝26</b>という足し算で覚えると確実に出ます。"},

/* ---------- 2 関節 ---------- */
{type:"p", eyebrow:"2 関節", title:"足部の関節一覧",
 lead:"足部の関節は大きく[[7]]つのグループに分けられます。",
 items:[
  "[[距腿関節]]",
  "[[足根間関節]]<ul><li>[[距骨下関節]]、[[踵立方関節]]、[[楔立方関節]]、[[距踵舟関節]]、[[楔舟関節]]</li></ul>",
  "[[足根中足関節]]",
  "[[中足間関節]]",
  "[[中足趾（指）節関節]]",
  "[[趾（指）節間関節]]"
 ],
 note:"<b>外科的切断部位の2つ：</b>横足根関節＝<b>ショパール関節</b>、足根中足関節＝<b>リスフラン関節</b>。この2つは名前つきで問われやすい要注意ポイントです。"},

{type:"p", eyebrow:"2 関節", title:"1) 距腿関節（図8-86）",
 items:[
  "[[脛骨の下関節面]]と[[内果]]、および[[腓骨の外果]]が[[関節窩]]、[[距骨上面の滑車]]を[[関節頭]]とする[[らせん関節]]（[[蝶番関節]]）である",
  "<b>内側</b>の靱帯：[[内側（三角）靱帯]]<ul><li>[[前脛距部]]、[[脛舟部]]、[[脛踵部]]、[[後脛距部]]の[[4]]部からなる</li></ul>",
  "<b>外側</b>の靱帯：[[前距腓靱帯]]、[[後距腓靱帯]]、[[踵腓靱帯]]",
  "距腿関節は[[背屈]]、[[底屈]]が可能である",
  "距骨滑車の幅は[[前方]]が[[後方]]より約[[5mm]]ひろい"
 ],
 note:"<b>内側は1本・外側は3本：</b>内側は三角靱帯という強力な1枚（4部）、外側は細い3本。<b>外側のほうが弱い</b>ので、足関節捻挫は内がえし（前距腓靱帯損傷）が圧倒的に多くなります。"},

{type:"p", eyebrow:"2 関節", title:"距骨滑車の形と運動軸",
 items:[
  "[[底屈位]]では[[関節の遊び]]が生じてわずかに[[内・外転運動]]が可能となる",
  "[[背屈位]]では[[関節窩]]が[[関節頭]]を固く狭み込むために内・外転運動は[[不可能]]となる",
  "足では[[踵]]から[[第2指]]を通る線を形態上の[[基準線]]とする",
  "基準線に対して距骨の長軸は[[前内側]]、距骨滑車の運動軸と直交する長軸は[[前外側]]に向いている",
  "[[外果]]は[[内果]]よりも少し[[後方]]にあり、底・背屈の運動軸は完全な[[水平-前頭軸]]とはならない",
  "そのため[[背屈]]時には足底はやや[[外側]]（[[外がえし]]）に向き、[[底屈]]時には[[内側]]（[[内がえし]]）を向く"
 ],
 note:"<b>捻挫の理屈：</b>底屈位＝滑車の細い後方が関節窩に入り、遊びができて内・外転が起こる。だから<b>底屈＋内がえし</b>（階段を踏み外す姿勢）で外側靱帯が切れるのです。"},

{type:"p", eyebrow:"2 関節", title:"2) 距骨下関節",
 items:[
  "[[距骨下面]]と[[踵骨上前面]]のあいだの関節で、両骨の[[前]]・[[中]]・[[後]]関節面の[[3]]つの部分で接合する[[顆状関節]]である",
  "付属する靱帯は[[足根洞]]内部にある[[骨間距踵靱帯]]、[[内側距踵靱帯]]、[[外側距踵靱帯]]である",
  "距骨下関節では[[内・外転運動]]と[[回内・回外運動]]の複合した運動が起こる",
  "この複合運動は[[船]]の動きである[[横揺れ]]（[[rolling]]）、[[方向変換]]（[[turning]]）、[[縦揺れ]]（[[pitching]]）に類似している"
 ],
 note:"<b>イメージで覚える：</b>距骨下関節は「足が地面の凹凸に合わせて<b>船のように揺れる</b>」関節。不整地を歩けるのはこの関節のおかげです。"},

{type:"p", eyebrow:"2 関節", title:"3) 横足根関節（ショパール関節）",
 items:[
  "外側の[[踵立方関節]]、内側の[[距舟関節]]の[[2]]つからなる",
  "外科的切断部位として[[ショパール関節]]ともいう",
  "<b>背側</b>の靱帯：[[距舟靱帯]]、[[二分靱帯]]（総称して[[背側足根靱帯]]）",
  "<b>底側</b>の靱帯：[[長足底靱帯]]、[[踵立方靱帯]]、[[踵舟靱帯]]（総称して[[底側足根靱帯]]）",
  "[[長足底靱帯]]は足底の[[最表層]]にあって、[[踵骨隆起下面]]から前方にひろがり、[[立方骨]]および[[第2〜第5中足骨底]]に至る強力な靱帯である<ul><li>踵骨隆起から中節骨に至る厚い腱性の[[足底腱膜]]とともに足の[[縦アーチ]]を形成する</li></ul>",
  "[[距舟関節]]は前方に[[凸]]、[[踵立方関節]]は前方に[[凹]]となり、全体で[[S字状]]となる",
  "運動は[[距舟関節]]が主となり、[[底・背屈]]、[[内・外転]]、[[内・外がえし]]が可能であるが、いずれも可動範囲は[[小さい]]"
 ],
 note:"<b>足底腱膜のつながり：</b>長足底靱帯と足底腱膜が縦アーチの「弓の弦」。走りすぎでここが傷むのが<b>足底腱膜炎</b>です。"},

{type:"p", eyebrow:"2 関節", title:"4)〜7) 足根中足関節から趾節間関節まで",
 items:[
  "<b>4) 足根中足関節</b>：[[内側楔状骨]]と[[第1中足骨]]、[[中間楔状骨]]と[[第2中足骨]]、[[外側楔状骨]]と[[第3中足骨]]、[[立方骨]]と[[第4・第5中足骨]]のあいだの関節の総称<ul><li>外科的切断部位として[[リスフラン関節]]ともいう</li><li>靱帯は[[背側]]・[[底側]]および[[骨間足根中足靱帯]]</li><li>[[すべり運動]]が主で、わずかに[[底・背屈]]、[[内・外転]]が可能</li></ul>",
  "<b>5) 中足間関節</b>：中足骨相互の[[半関節]]で[[底側]]・[[背側]]および[[骨間中足靱帯]]がある<ul><li>足の[[横アーチ]]が形成される部位である</li></ul>",
  "<b>6) 中足趾（指）節関節</b>：中足骨と足趾（指）[[基節骨]]のあいだの[[球関節]]<ul><li>[[内・外側側副靱帯]]、[[底側側副靱帯]]、[[深横中足靱帯]]が補強する</li></ul>",
  "<b>7) 足の趾（指）節間関節</b>：手と同様に[[PIP関節]]、[[DIP関節]]がある<ul><li>[[内・外側側副靱帯]]で補強される[[蝶番関節]]で、[[屈曲]]と[[伸展]]が可能</li></ul>"
 ],
 note:"<b>手との対応：</b>MP・PIP・DIPという区分は手とまったく同じ。ただし足のMTP関節は球関節でも実際には<b>屈伸が中心</b>で、手のような細かい動きはしません。"},

/* ---------- 3 運動 ---------- */
{type:"tbl", eyebrow:"3 足関節・足部の運動", title:"1) 外がえし・内がえし、回外・回内",
 lead:"改訂された[[関節可動域表示ならびに測定法]]による定義です。",
 head:["用語","定義"],
 rows:[
  ["[[外がえし]]","足関節・足部に関する[[前額面]]の運動で、足底が[[外方]]を向く運動"],
  ["[[内がえし]]","足底が[[内側]]を向く動き"],
  ["[[回外]]","[[底屈]]・[[内転]]・[[内がえし]]からなる[[複合運動]]"],
  ["[[回内]]","[[背屈]]・[[外転]]・[[外がえし]]からなる[[複合運動]]"],
  ["母趾・趾の[[回外]]","[[前額面]]の運動で、趾の軸を中心にして[[趾腹]]が[[内方]]を向く動き"],
  ["母趾・趾の[[回内]]","[[趾腹]]が[[外方]]を向く動き"]],
 note:"<b>3要素の組み合わせ：</b>回外・回内は単独の運動ではなく<b>3つの運動の複合</b>。「内がえし」は前額面だけの1要素、「回外」はそれを含む3要素——ここを混同しないことが最大のポイントです。<br><b>※</b>内がえし・外がえしのほかに[[内反]]・[[外反]]の用語があるが、内反・外反は足部の[[変形]]を意味するので正常関節運動の名称としては[[使用しない]]。"},

{type:"p", eyebrow:"3 足関節・足部の運動", title:"2) 背屈・底屈／3) 内転・外転",
 items:[
  "<b>背屈・底屈</b>：[[矢状面]]の動きで、[[足背]]への動きを[[背屈]]、[[足底]]への動きを[[底屈]]とした",
  "足関節・足部の動きに関して[[屈曲]]と[[伸展]]の用語は[[使用しない]]こととした",
  "ただし母趾・趾に関しては[[足底]]への動きが[[屈曲]]、[[足背]]への動きは[[伸展]]とした",
  "<b>内転・外転</b>：足関節・足部の内転・外転運動の基本軸は[[第2中足骨長軸]]とする"
 ],
 note:"<b>用語の整理：</b>足関節＝背屈／底屈、足の趾＝伸展／屈曲。ただし<b>解剖学や関節可動域表示では屈曲＝底屈、伸展＝背屈</b>と定義されており（表8-15脚注）、教科書もこの定義で記載されています。"},

/* ---------- 4 筋 ---------- */
{type:"two", eyebrow:"4 足の筋", title:"足の筋の分類",
 lead:"[[下腿]]に起始があるものを[[下腿筋]]、[[足部]]に起始・停止があるものを[[足筋]]（[[足の内在筋]]）といいます。",
 left:{h:"下腿筋（3群）", items:[
   "<b>前面</b>：[[前脛骨筋]]、[[長母趾（指）伸筋]]、[[長趾（指）伸筋]]、[[第3腓骨筋]]",
   "<b>側面</b>：[[長腓骨筋]]、[[短腓骨筋]]",
   "<b>後面・浅層</b>：[[腓腹筋]]、[[ヒラメ筋]]、[[足底筋]]",
   "<b>後面・深層</b>：[[後脛骨筋]]、[[長趾（指）屈筋]]、[[長母趾（指）屈筋]]"]},
 right:{h:"足筋（足背・足底）", items:[
   "<b>足背</b>：[[短母趾（指）伸筋]]、[[短趾（指）伸筋]]",
   "<b>母趾（指）球筋</b>：[[母趾（指）外転筋]]、[[短母趾（指）屈筋]]、[[母趾（指）内転筋]]",
   "<b>小趾（指）球筋</b>：[[小趾（指）外転筋]]、[[短小趾（指）屈筋]]、[[小趾（指）対立筋]]",
   "<b>中足筋</b>：[[短趾（指）屈筋]]、[[足底方形筋]]、[[虫様筋]]、[[底側骨間筋]]、[[背側骨間筋]]"]},
 note:"<b>神経で二分：</b>前面と側面（腓骨筋群）は<b>腓骨神経</b>、後面は<b>脛骨神経</b>。腓骨神経麻痺で背屈ができなくなる（下垂足）のはこの区分が理由です。"},

/* ---------- 筋の各論 ---------- */
{type:"p", eyebrow:"筋の各論 ①", title:"前面の筋と伸筋支帯（図8-88〜8-91）",
 items:[
  "<b>前脛骨筋</b>：[[内果]]をはさんで[[前側]]を前脛骨筋、[[後側]]を[[後脛骨筋]]の腱が走行する<ul><li>ともに[[内がえし]]運動では[[共同筋]]として作用するが、[[後脛骨筋]]のほうが[[強力]]である</li><li>背屈・底屈運動では前者は[[背屈]]、後者は[[底屈]]に働き、相互に[[拮抗筋]]となる</li><li>足の[[内縁]]を引き上げることから、足の[[外縁]]での歩行や[[アイススケート]]走行時に働く</li></ul>",
  "<b>長母趾（指）伸筋</b>：母趾（指）の[[伸展]]と同時に足関節の[[背屈]]作用も行う。足を固定すれば[[下腿]]を[[前方]]に傾ける",
  "<b>長趾（指）伸筋</b>：[[短趾（指）伸筋]]とともに[[第2〜第5趾（指）]]の伸展を行う",
  "<b>第3腓骨筋</b>：長趾（指）伸筋の[[外側]]にある小筋で[[人間特有]]の筋。長趾（指）伸筋の[[第5腱]]として扱われることもある"
 ],
 note:"<b>伸筋支帯の役割：</b><b>上伸筋支帯</b>は内側から前脛骨筋・長母趾伸筋・長趾伸筋・第3腓骨筋の順に並ぶ4腱を輪状にとりまく。<b>下伸筋支帯</b>はX（Y）字状に踵立方関節の上にあり、筋収縮時の<b>腱の浮き上がりを押さえます</b>。"},

{type:"p", eyebrow:"筋の各論 ②", title:"長・短腓骨筋と下腿三頭筋（図8-90、8-92、8-93）",
 items:[
  "<b>長・短腓骨筋</b>：両筋ともに[[外果後部]]を通るとき、[[上腓骨筋支帯]]と[[下腓骨筋支帯]]の下を通過する<ul><li>両筋とも[[足底]]に回り込み、[[底屈]]と[[外がえし]]に作用する</li><li>[[外側縦アーチ]]の形成に重要な働きをする</li></ul>",
  "<b>下腿三頭筋</b>：[[腓腹筋内・外側頭]]と[[ヒラメ筋]]をまとめていう<ul><li>腱は合一して[[踵骨腱]]（[[アキレス腱]]）となり、[[踵骨隆起]]に付着する</li><li>[[大殿筋]]、[[大腿四頭筋]]についで[[強力]]な筋である</li></ul>",
  "腓腹筋は最大収縮で約[[4cm]]、ヒラメ筋は[[4.5cm]]短縮する",
  "腓腹筋は[[2関節筋]]で[[距腿関節底屈]]作用と[[膝関節屈曲]]作用がある",
  "[[膝関節完全伸展位]]では腓腹筋は[[受動的に伸張]]され、足の底屈力は最も[[強力]]に発揮される",
  "[[膝関節屈曲位]]では腓腹筋は[[弛緩]]して足の底屈力は[[弱い]]"
 ],
 note:"<b>臨床とつなげる：</b>アキレス腱断裂は「<b>下腿三頭筋が最大収縮して足が底屈しているときに、外力として大きな背屈力がかかって起こる</b>」——踏み切り動作でよく起こる理由がこれです。膝伸展位でつま先立ちが最も強いのも2関節筋の性質から説明できます。"},

{type:"p", eyebrow:"筋の各論 ③", title:"後面深層の筋と拮抗共同関係（図8-94〜8-96）",
 items:[
  "<b>足底筋</b>：筋腹は[[膝関節後部]]にある小筋で、細い[[ひも状]]の腱となって[[踵骨隆起]]につく。作用は[[下腿三頭筋]]と同様である",
  "<b>後脛骨筋</b>：足の[[内がえし]]と[[底屈]]に作用する<ul><li>[[内側縦アーチ]]の形成に重要な働きをして、後脛骨筋[[麻痺]]では内側縦アーチが落ち込んで[[扁平足]]となる</li></ul>",
  "<b>長趾（指）屈筋</b>：[[4腱]]に分かれて第2〜第5趾（指）につく。付着部で[[短趾（指）屈筋]]の2つに分かれた腱のあいだを通過し、それぞれの腱から[[4]]つの[[虫様筋]]が起こっている",
  "<b>長母趾（指）屈筋</b>：母趾（指）の屈曲、足部の底屈と内がえしに作用し、[[歩行]]・[[走行]]・[[跳躍]]動作時につま先が床を蹴るときに[[強力]]に働く",
  "[[距骨上面]]の高さで足関節を横断すると下腿筋腱の位置関係がわかる（図8-96）<ul><li>[[前脛骨筋]]・[[長母趾（指）伸筋]]＝[[背屈]]・[[内がえし]]</li><li>[[長腓骨筋]]・[[短腓骨筋]]＝[[底屈]]・[[外がえし]]</li><li>[[長趾（指）伸筋]]・[[第3腓骨筋]]＝[[背屈]]・[[外がえし]]</li><li>[[後脛骨筋]]・[[長趾（指）屈筋]]・[[長母趾（指）屈筋]]＝[[底屈]]・[[内がえし]]</li></ul>"
 ],
 note:"<b>4象限で覚える：</b>運動軸で足関節を十文字に切ると、筋腱がきれいに<b>4つのグループ</b>に分かれます。「どの象限を通るか」がそのままその筋の作用。丸暗記ではなく位置関係で説明できるようになります。"},

{type:"p", eyebrow:"筋の各論 ④", title:"足の内在筋（図8-97〜8-99）",
 items:[
  "<b>短母趾（指）伸筋・短趾（指）伸筋</b>：足筋のうちの[[足背筋]]で、それぞれ[[長母趾（指）伸筋]]・[[長趾（指）伸筋]]の働きを助けて趾（指）の[[伸展]]作用を行う",
  "<b>母趾（指）球筋</b>：母趾（指）基節骨には[[短母趾（指）屈筋]]、[[母趾（指）外転筋]]、[[母趾（指）内転筋]]が付着する<ul><li>前2者は足の[[内側縦アーチ]]の形成を助ける</li><li>母趾（指）の屈曲には[[3]]筋が[[共同筋]]として働く</li></ul>",

<script>
const slideEl=document.getElementById('slide');
const dotsEl=document.getElementById('dots');
let idx=0;
function blanks(t){return String(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<span class="blank" tabindex="0" role="button" aria-label="空欄">${a}</span>`);}
const li=arr=>arr.map(t=>`<li>${blanks(t)}</li>`).join('');
function render(){
  const s=SLIDES[idx];let h='';
  if(s.type==='cover'){
    h=`<div class="cover"><div class="sub">${s.sub}</div><h1>${s.title}</h1><div class="en">${s.en}</div><div class="idx">${s.index.join('<br>')}</div></div>`;
  }else{
    h+=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>`;
    if(s.lead) h+=`<p style="margin-bottom:14px;line-height:1.85;font-size:15.5px;">${blanks(s.lead)}</p>`;
    if(s.type==='p'){h+=`<ul>${li(s.items)}</ul>`;}
    else if(s.type==='tbl'){h+=`<div class="tblwrap"><table><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${blanks(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='mtx'){
      let th1='';
      if(s.groups){th1='<tr><th rowspan="2">筋</th>'+s.groups.map(g=>`<th class="grp" colspan="${g[1]}">${g[0]}</th>`).join('')+'</tr>';}
      h+=`<div class="tblwrap"><table class="matrix"><thead>${th1}<tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?c:(c?blanks('[['+c+']]'):'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='two'){
      h+=`<div class="two"><div class="col"><h4>${s.left.h}</h4><div class="body"><ul>${li(s.left.items)}</ul></div></div><div class="col alt"><h4>${s.right.h}</h4><div class="body"><ul>${li(s.right.items)}</ul></div></div></div>`;}
    if(s.note) h+=`<div class="note">${blanks(s.note)}</div>`;
  }
  slideEl.innerHTML=h;
  document.getElementById('cur').textContent=idx+1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  document.getElementById('prev').disabled=(idx===0);
  document.getElementById('next').disabled=(idx===SLIDES.length-1);
  slideEl.querySelectorAll('.blank').forEach(b=>{
    b.addEventListener('click',()=>b.classList.add('open'));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.classList.add('open');}});
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('tot').textContent=SLIDES.length;
SLIDES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`スライド${i+1}`);b.onclick=()=>{idx=i;render();};dotsEl.appendChild(b);});
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById('next').onclick=()=>{if(idx<SLIDES.length-1){idx++;render();}};
document.getElementById('btnNext').onclick=()=>{const b=slideEl.querySelector('.blank:not(.open)');if(b){b.classList.add('open','hint');setTimeout(()=>b.classList.remove('hint'),900);b.scrollIntoView({block:'center',behavior:'smooth'});}};
document.getElementById('btnAll').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.add('open'));
document.getElementById('btnReset').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.target.classList.contains('blank'))return;if(e.key==='ArrowRight'&&idx<SLIDES.length-1){idx++;render();}if(e.key==='ArrowLeft'&&idx>0){idx--;render();}});
render();
</script>
