<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運動学 模試対策問題</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 10px 40px;color:#1a1a1a}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#3a6b2a;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd .ch{font-size:11px;color:#c8e0bd;letter-spacing:.06em;margin-bottom:2px}
.hd .tt{font-size:18px;font-weight:600;color:#fff}
.hd .pg{font-size:12px;color:#c8e0bd;white-space:nowrap}
.hd .home{background:none;border:1px solid #8fb57f;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.bar{height:5px;background:#e5e7eb}.bar>i{display:block;height:100%;background:#3a6b2a;transition:width .3s;width:0}
.bd{padding:18px 20px 16px;min-height:300px}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 20px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:8px;border:1px solid #3a6b2a;background:#3a6b2a;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;margin-left:auto}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:#fff;color:#3a6b2a;border-color:#cfd6cb;margin-left:0}
.qnum{font-size:12px;font-weight:700;color:#3a6b2a;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mark{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(58,107,42,.1);color:#3a6b2a}
.mark.ng{background:rgba(109,63,158,.12);color:#6d3f9e}
.mark.two{background:rgba(194,65,12,.13);color:#c2410c}
.q{font-size:16px;line-height:1.8;font-weight:600;margin-bottom:14px}
.q .em{color:#6d3f9e}.q .em2{color:#c2410c}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:15px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;gap:10px;align-items:flex-start;width:100%}
.opt .mk{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid #c3c8d0;color:#666;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:#3a6b2a;background:#eef5ea}.opt.sel .mk{background:#3a6b2a;border-color:#3a6b2a;color:#fff}
.opt.dis{cursor:default}
.opt.correct{border-color:#1f9d6b;background:#e9f8f1}.opt.correct .mk{border-color:#1f9d6b;background:#1f9d6b;color:#fff}
.opt.wrong{border-color:#d0483f;background:#fdeceb}.opt.wrong .mk{border-color:#d0483f;background:#d0483f;color:#fff}
.opt .ex{display:block;font-size:13.5px;color:#444;margin-top:6px;line-height:1.75;font-weight:400}
.opt .ok-t{color:#1f9d6b;font-weight:700}.opt .ng-t{color:#d0483f;font-weight:700}
.vd{margin:14px 0 4px;font-weight:700;font-size:16px}.vd.ok{color:#1f9d6b}.vd.ng{color:#d0483f}
.z{margin-top:12px;border-left:4px solid #9cbf8c;background:#f4f8f1;padding:10px 12px;font-size:14px;line-height:1.85;border-radius:0 8px 8px 0}
.z b{color:#3a6b2a}
.meta{font-size:12px;color:#777;margin-top:8px}
.center{text-align:center}
.lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:14px}
.sec{font-size:13px;font-weight:700;color:#3a6b2a;margin:18px 0 8px;letter-spacing:.05em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:13px 14px;cursor:pointer;background:#fff;font-family:inherit}
.mode:active{background:#f1f7ee}
.mode .nm{font-size:15px;font-weight:700;color:#3a6b2a;margin-bottom:3px}
.mode .ds{font-size:12px;color:#666;line-height:1.6}
.mode.wide{grid-column:1/-1}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{border:1.5px solid #cfd6cb;background:#f4f8f1;border-radius:9px;padding:11px 0;font-size:16px;font-weight:700;color:#3a6b2a;font-family:inherit;cursor:pointer}
.sbtn:active{background:#3a6b2a;color:#fff}
.mode.or .nm{color:#c2410c}
.big{font-size:40px;font-weight:700;color:#3a6b2a;margin:4px 0}
.frow{display:grid;grid-template-columns:64px 1fr 58px;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer}
.frow .nm{font-weight:700}
.frow .tr{height:12px;background:#eceef1;border-radius:6px;overflow:hidden}
.frow .tr i{display:block;height:100%;border-radius:6px}
.frow .v{text-align:right;color:#555;font-variant-numeric:tabular-nums}
.frow.none{color:#aaa;cursor:default}
.note{font-size:12px;color:#888;line-height:1.7;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #cfd6cb;background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;color:#333}
.chip.on{background:#3a6b2a;color:#fff;border-color:#3a6b2a}
.card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:14px}
.card .q{font-size:15px;margin-bottom:10px}
.ro{padding:9px 10px;border-radius:8px;background:#f8f9fb;margin-bottom:6px;font-size:14px;line-height:1.7}
.ro.c{background:#e9f8f1;border:1px solid #b6e6d1}
.ro .h{font-weight:700}.ro .e{display:block;color:#444;font-size:13.5px;margin-top:3px}
.hide .ro.c{background:#f8f9fb;border-color:transparent}.hide .ro .e,.hide .z,.hide .ansl{display:none}
.reveal{display:none;margin-top:6px}.hide .reveal{display:inline-block}
.ansl{font-size:13px;font-weight:700;color:#1f9d6b;margin-bottom:6px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 12px;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px}
.rsel{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
@media (max-width:420px){.menu{grid-template-columns:1fr}.frow{grid-template-columns:56px 1fr 52px}}
</style>
</head>
<body>
<div class="slide">
  <div class="hd"><div><div class="ch" id="hch">柔道整復師国家試験対策｜運動学</div><div class="tt" id="htt">模試対策問題</div></div><div style="display:flex;gap:8px;align-items:center"><span class="pg" id="pg"></span><button class="home" id="hbtn" onclick="home()" style="display:none">メニュー</button></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題データ =====
   id は「s(セット)-(問番号)」で固定。成績の記録はこの id に結びつくので、問題を追加しても既存の id は変えないこと。
   o: [選択肢, その肢の解説, 正答なら1] ／ c: 分野 ／ z: 整理 */
const DATA=[{"id": "s1-1", "set": 1, "n": 1, "c": "総論", "t": "運動学総論・運動面と運動軸", "p": "p.8〜9", "r": "", "s": "関節運動と運動面・運動軸の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["肩関節屈曲 ──── 前額面 ──── 矢状軸", "誤り。肩関節の屈曲・伸展は矢状面・前額軸の運動である。前額面・矢状軸で行われるのは外転・内転。", 0], ["頸部回旋 ──── 矢状面 ──── 前額軸", "誤り。頸部回旋は水平面・垂直軸の運動である。矢状面・前額軸で行われるのは屈曲・伸展。", 0], ["股関節外転 ──── 前額面 ──── 矢状軸", "正しい。外転・内転は身体を前後に分ける前額面上で、前後方向に走る矢状軸を中心に行われる。", 1], ["前腕回内 ──── 前額面 ──── 垂直軸", "誤り。前腕の回内・回外も回旋運動であり、水平面・垂直軸の運動である。", 0]], "z": "屈曲伸展＝矢状面・前額軸、外転内転＝前額面・矢状軸、回旋＝水平面・垂直軸。運動面と、その面に垂直な軸が必ず対になる。"}, {"id": "s1-2", "set": 1, "n": 2, "c": "総論", "t": "運動学総論・てこ", "p": "p.13〜15", "r": "", "s": "人体のてこについて正しいのはどれか。", "neg": false, "two": false, "o": [["第3のてこは力において不利だが速度と可動域に優れる", "正しい。第3のてこはモーメントアームが短いため大きな筋力を要するが、作用点の移動距離と速度を大きくできる。", 1], ["第2のてこの例に足関節背屈時の前脛骨筋の作用がある", "誤り。前脛骨筋による足関節背屈は、支点（足関節）・力点（前脛骨筋停止部）・作用点（足部）の順で力点が中間にあり、第3のてこである。第2のてこの例は踵挙上（つま先立ち）。", 0], ["第1のてこは力点が支点と作用点の間にある", "誤り。第1のてこは支点が力点と作用点の間にある。力点が中間にあるのは第3のてこ。", 0], ["人体で最も多いのは第2のてこである", "誤り。人体で最も多いのは第3のてこである。第2のてこは踵挙上などわずかしかない。", 0]], "z": "支点が中間＝第1、作用点が中間＝第2、力点が中間＝第3。「支・作・力」の順に1・2・3と覚える。"}, {"id": "s1-3", "set": 1, "n": 3, "c": "総論", "t": "運動学総論・力と単位", "p": "p.18〜20", "r": "", "s": "物理量と単位の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["力 ──── ジュール", "誤り。力の単位はニュートン（N）である。ジュール（J）は仕事・エネルギーの単位。", 0], ["仕事 ──── ワット", "誤り。仕事の単位はジュール（J）である。ワット（W）は仕事率の単位。", 0], ["仕事率 ──── ニュートン", "誤り。仕事率の単位はワット（W＝J/秒）である。ニュートンは力の単位。", 0], ["力のモーメント ──── ニュートンメートル", "正しい。力のモーメントは「力×モーメントアーム」なので、単位はニュートンメートル（N・m）となる。", 1]], "z": "仕事と力のモーメントはどちらも「力×距離」の次元をもつが、仕事はジュール、モーメントはニュートンメートルと書き分ける。"}, {"id": "s1-4", "set": 1, "n": 4, "c": "運動器", "t": "運動器の構造と機能・関節の分類", "p": "p.31", "r": "", "s": "関節と形状の組合せで誤っているのはどれか。", "neg": true, "two": false, "o": [["肩関節 ──── 球関節", "正しい組合せ。肩関節（肩甲上腕関節）は多軸性の球関節である。", 0], ["橈骨手根関節 ──── 車軸関節", "誤った組合せ。橈骨手根関節は二軸性の楕円関節で、掌屈・背屈と橈屈・尺屈を行う。車軸関節にあたるのは正中環軸関節や上橈尺関節。", 1], ["腕尺関節 ──── 蝶番関節", "正しい組合せ。腕尺関節は一軸性の蝶番関節で、屈曲・伸展のみを行う。", 0], ["母指の手根中手関節 ──── 鞍関節", "正しい組合せ。母指の手根中手関節は二軸性の鞍関節で、この形状が対立運動を可能にしている。", 0]], "z": "一軸性＝蝶番関節・車軸関節、二軸性＝楕円関節・鞍関節、多軸性＝球関節・平面関節。軸の数と形状が対応する。"}, {"id": "s1-5", "set": 1, "n": 5, "c": "運動器", "t": "運動器の構造と機能・運動単位", "p": "p.34〜37", "r": "", "s": "運動単位と筋線維について正しいのはどれか。", "neg": false, "two": false, "o": [["SO線維（Ⅰ型）はFG線維（ⅡB型）より疲労しにくい", "正しい。SO線維は酸化系の代謝に依存し、ミオグロビンと毛細血管に富むため持久力に優れる。", 1], ["神経支配比が大きい筋ほど微細な運動に適する", "誤り。神経支配比が小さいほど細かい調節ができる。外眼筋や手内在筋は支配比が小さい代表例。", 0], ["1個の筋線維とそれを支配する複数の運動ニューロンをいう", "誤り。運動単位は1個の運動ニューロンと、それが支配する複数の筋線維をいう。関係が逆である。", 0], ["筋力を増すときは大きな運動単位から順に動員される", "誤り。閾値の低い小さな運動単位から順に動員される（サイズの原理）。", 0]], "z": "Ⅰ型（SO）＝収縮が遅い・疲れにくい・赤い、ⅡB型（FG）＝収縮が速い・疲れやすい・白い。代謝系（酸化系か解糖系か）がこの違いを決めている。"}, {"id": "s1-6", "set": 1, "n": 6, "c": "感覚", "t": "運動感覚・筋紡錘と腱器官", "p": "p.53〜55", "r": "", "s": "筋紡錘と腱器官について正しいのはどれか。", "neg": false, "two": false, "o": [["筋紡錘は錘外筋線維と直列に配列する", "誤り。筋紡錘は錘外筋線維と並列に配列する。直列に配列するのは腱器官である。", 0], ["腱器官は筋の長さの変化を感知する", "誤り。腱器官が感知するのは筋の張力である。長さと伸張速度を感知するのは筋紡錘。", 0], ["筋紡錘の一次終末はⅠa群求心性線維を出す", "正しい。一次終末（らせん終末）はⅠa群線維を出し、単シナプス性の伸張反射の求心路となる。二次終末はⅡ群線維を出す。", 1], ["腱器官が興奮すると同名筋が収縮する", "誤り。腱器官はⅠb群線維を介して抑制性介在ニューロンを興奮させ、同名筋を弛緩させる（Ⅰb抑制・自原抑制）。", 0]], "z": "筋紡錘＝並列・長さ・Ⅰa群・促通（伸張反射）、腱器官＝直列・張力・Ⅰb群・抑制（逆伸張反射）。配列・感知するもの・線維・作用の4項目すべてが対になっている。"}, {"id": "s1-7", "set": 1, "n": 7, "c": "感覚", "t": "運動感覚・深部感覚", "p": "p.56〜58", "r": "", "s": "深部感覚について正しいのはどれか。", "neg": false, "two": false, "o": [["伝導路は外側脊髄視床路である", "誤り。深部感覚の伝導路は後索‑内側毛帯路である。外側脊髄視床路が伝えるのは痛覚・温度覚。", 0], ["関節包や靱帯の受容器は関節の位置覚に関与する", "正しい。関節包や靱帯にあるルフィニ終末などが関節角度の変化を感知し、位置覚・運動覚に関与する。", 1], ["パチニ小体は持続的な圧迫の感知に適する", "誤り。パチニ小体は順応が速く、振動や急激な圧の変化の感知に適する。持続的な圧迫を感知するのはメルケル盤やルフィニ終末。", 0], ["脊髄内を上行する間に交叉する", "誤り。深部感覚は同側の後索を上行し、延髄の後索核でニューロンを変えてから交叉する。脊髄内では交叉しない。", 0]], "z": "後索‑内側毛帯路（深部感覚・識別性触覚）は延髄で交叉、脊髄視床路（痛覚・温度覚）は脊髄に入った高さで交叉する。交叉する場所が違うため、脊髄半側切断では障害される側が感覚の種類によって分かれる。"}, {"id": "s1-8", "set": 1, "n": 8, "c": "反射", "t": "反射と随意運動・反射の中枢", "p": "p.59〜63", "r": "", "s": "反射と中枢の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["屈筋逃避反射 ──── 中脳", "誤った組合せ。屈筋逃避反射の中枢は脊髄にある。", 0], ["緊張性迷路反射 ──── 脊髄", "誤った組合せ。緊張性迷路反射の中枢は脳幹（延髄）にある。", 0], ["交差性伸展反射 ──── 延髄", "誤った組合せ。交差性伸展反射の中枢は脊髄にある。屈筋逃避反射と対をなし、対側下肢を伸展させて体重を支える。", 0], ["立ち直り反射 ──── 中脳", "正しい組合せ。迷路から起こり頭部に作用する立ち直り反射や、体表からの刺激で起こる立ち直り反射の中枢は中脳にある。ただし頸部から起こり体幹に作用する立ち直り反射は延髄上部〜橋、眼から起こる立ち直り反射は大脳皮質が中枢である。", 1]], "z": "脊髄＝伸張反射・屈筋逃避反射・交差性伸展反射、延髄・橋＝緊張性頸反射・緊張性迷路反射・頸部から体幹に作用する立ち直り反射、中脳＝迷路から頭部に作用する立ち直り反射・体表からの立ち直り反射、大脳皮質＝眼から起こる立ち直り反射・平衡反応。中枢が高位になるほど出現が遅い。"}, {"id": "s1-9", "set": 1, "n": 9, "c": "反射", "t": "反射と随意運動・小脳", "p": "p.67〜68", "r": "", "s": "小脳の機能でないのはどれか。", "neg": true, "two": false, "o": [["随意運動の発現命令の発信", "小脳の機能ではない。随意運動の発現命令は大脳皮質運動野から錐体路を介して発せられる。小脳はその命令を調節する。", 1], ["筋トーヌスの調節", "小脳の機能である。小脳が障害されると筋トーヌスが低下する。", 0], ["平衡の保持", "小脳の機能である。前庭小脳（原小脳）が平衡の保持に関与し、障害されると体幹失調が生じる。", 0], ["運動の協調", "小脳の機能である。新小脳は運動の企画と協調に関与し、障害されると測定異常や企図振戦が生じる。", 0]], "z": "小脳は運動を「起こす」器官ではなく「整える」器官である。大脳基底核も同じ調節系で、どちらも筋へ直接命令を送らない点が共通する。"}, {"id": "s1-10", "set": 1, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・肩甲帯", "p": "p.73〜80", "r": "", "s": "肩甲帯の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["肩甲骨下角は第3胸椎棘突起の高さにある", "誤り。肩甲骨下角は第7〜8胸椎棘突起の高さにある。上角が第2胸椎棘突起の高さ。", 0], ["肩甲上腕リズムは上腕骨1に対し肩甲骨2の割合である", "誤り。肩甲上腕リズムは上腕骨2に対し肩甲骨1の割合である。", 0], ["肩関節外転180度のうち約60度は肩甲骨の上方回旋による", "正しい。180度の挙上のうち、肩甲上腕関節が約120度、肩甲骨の上方回旋が約60度を担う。", 1], ["肩甲骨の上方回旋は胸鎖関節の運動を伴わない", "誤り。肩甲骨の上方回旋には胸鎖関節と肩鎖関節の運動が必ず伴う。肩甲骨は鎖骨を介して体幹と連結しているためである。", 0]], "z": "挙上180度＝肩甲上腕関節120度＋肩甲骨上方回旋60度。この比が2：1の肩甲上腕リズムにあたる。"}, {"id": "s1-11", "set": 1, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・肩関節の筋", "p": "p.78〜82", "r": "", "s": "筋と肩関節に対する作用の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["烏口腕筋 ──── 水平伸展", "誤った組合せ。烏口腕筋は上腕を前内方へ引くため、屈曲および水平屈曲に働く。", 0], ["広背筋 ──── 屈曲", "誤った組合せ。広背筋は伸展・内転・内旋に働く。", 0], ["小円筋 ──── 外転", "誤った組合せ。小円筋は外旋および水平伸展に働く。外転に働くのは棘上筋と三角筋中部線維。", 0], ["肩甲下筋 ──── 内旋", "正しい組合せ。肩甲下筋は回旋筋腱板のうち唯一前面にあり、小結節に停止して内旋に働く。", 1]], "z": "水平屈曲＝大胸筋・三角筋前部線維・烏口腕筋・肩甲下筋、水平伸展＝三角筋後部線維・棘下筋・小円筋・広背筋・大円筋。回旋筋腱板4筋のうち前面の肩甲下筋だけが内旋に働き、残り3筋は大結節に停止する。"}, {"id": "s1-12", "set": 1, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・肘関節と前腕", "p": "p.87〜92", "r": "", "s": "肘関節と前腕の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["腕橈関節は蝶番関節である", "誤り。腕橈関節は球関節である。蝶番関節にあたるのは腕尺関節。", 0], ["前腕の回内・回外は近位橈尺関節と遠位橈尺関節で行われる", "正しい。回内・回外は近位・遠位の両橈尺関節が連動して行う車軸関節の運動で、尺骨に対して橈骨が回旋する。", 1], ["上腕二頭筋は前腕回内位で最も強い屈曲力を発揮する", "誤り。上腕二頭筋は橈骨粗面に停止するため、前腕回外位で屈曲力が最大となる。回内位では腕橈骨筋の寄与が大きくなる。", 0], ["回外筋は肘関節屈曲位で最も強く働く", "誤り。回外筋は肘の肢位にかかわらず働く。肘屈曲位で回外力が最大となるのは上腕二頭筋である。", 0]], "z": "回外には上腕二頭筋（肘屈曲位で強い）と回外筋（肢位を選ばない）の2つが働き、回内には円回内筋と方形回内筋が働く。筋力は回外のほうが強い。"}, {"id": "s1-13", "set": 1, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・手の筋", "p": "p.108〜113", "r": "", "s": "MP関節屈曲・IP関節伸展の作用をもたないのはどれか。", "neg": true, "two": false, "o": [["虫様筋", "この作用をもつ。虫様筋は深指屈筋腱から起こり指背腱膜に停止するため、MP関節屈曲・IP関節伸展に働く。", 0], ["背側骨間筋", "この作用をもつ。背側骨間筋も指背腱膜に停止し、同じ作用に加えて手指の外転に働く。", 0], ["浅指屈筋", "この作用をもたない。浅指屈筋は中節骨底に停止し、PIP関節の屈曲に働く。", 1], ["掌側骨間筋", "この作用をもつ。掌側骨間筋も同じ作用をもち、加えて手指の内転に働く。", 0]], "z": "背側骨間筋＝外転（DAB）、掌側骨間筋＝内転（PAD）。どちらも指背腱膜に停止するため、虫様筋と共通のMP屈曲・IP伸展作用をもつ。"}, {"id": "s1-14", "set": 1, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の筋", "p": "p.120〜125", "r": "", "s": "股関節の運動と筋について正しいのはどれか。", "neg": false, "two": false, "o": [["中殿筋前部線維は股関節の内旋に働く", "正しい。中殿筋・小殿筋の前部線維は、外転とともに内旋にも働く。", 1], ["梨状筋は股関節の内旋に働く", "誤り。梨状筋は深層外旋六筋の一つで、外旋に働く。", 0], ["大内転筋は股関節の外旋に働く", "誤り。大内転筋は股関節の内転の主動作筋で、屈曲を補助する（教科書の表8-11）。外旋の作用はない。", 0], ["大腿直筋は股関節の伸展に働く", "誤り。大腿直筋は二関節筋で、股関節では屈曲、膝関節では伸展に働く。", 0]], "z": "教科書の表8-11では、内旋の主動作筋は小殿筋で、中殿筋・半腱様筋・半膜様筋が補助する。外旋は大殿筋と深層外旋6筋（梨状筋・内閉鎖筋・外閉鎖筋・上双子筋・下双子筋・大腿方形筋）が主で、腸腰筋・縫工筋・恥骨筋・長内転筋・短内転筋・大腿二頭筋・中殿筋・小殿筋が補助する。屈曲には内転筋群（薄筋・長内転筋・短内転筋・大内転筋）も補助としてはたらく。"}, {"id": "s1-15", "set": 1, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・膝関節", "p": "p.126〜128", "r": "", "s": "膝関節について正しいのはどれか。", "neg": false, "two": false, "o": [["屈曲時に脛骨は大腿骨に対して外旋する", "誤り。屈曲時には脛骨が内旋する。外旋するのは伸展時である。", 0], ["伸展終末で脛骨は大腿骨に対して約10度外旋する", "正しい。内側大腿骨顆の関節面が長いため、伸展終末で脛骨が約10度外旋して関節がロックされる（終末強制回旋運動／スクリューホーム運動）。", 1], ["半月板は屈曲時に前方へ移動する", "誤り。半月板は屈曲時に後方へ移動し、伸展時に前方へ戻る。", 0], ["前十字靱帯は屈曲位で最も緊張する", "誤り。前十字靱帯は伸展位で最も緊張する。", 0]], "z": "伸展＝脛骨外旋・ロック・靱帯緊張、屈曲＝脛骨内旋・ロック解除・靱帯弛緩。膝は伸展位が最も安定した肢位になる。"}, {"id": "s1-16", "set": 1, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・呼吸筋", "p": "p.164〜168", "r": "", "s": "安静呼気に関与しないのはどれか。", "neg": true, "two": false, "o": [["肺の弾性収縮力", "関与する。安静呼気は主として肺の弾性収縮力による受動的な運動である。", 0], ["胸郭の弾性", "関与する。吸気で拡張した胸郭が元に戻る弾性も、安静呼気に寄与する。", 0], ["横隔膜の弛緩", "関与する。横隔膜が弛緩して腱中心が上昇することで胸腔が狭まる。", 0], ["内肋間筋の収縮", "関与しない。内肋間筋は努力呼気（強制呼気）に働く呼気筋で、安静呼気では活動しない。", 1]], "z": "安静吸気は横隔膜（換気の約3/4）と外肋間筋による能動的運動、安静呼気は弾性による受動的運動である。筋が働くのは吸気側だけ、という非対称が安静呼吸の特徴。"}, {"id": "s1-17", "set": 1, "n": 17, "c": "姿勢", "t": "姿勢・身体重心", "p": "p.179〜180", "r": "", "s": "身体重心について正しいのはどれか。", "neg": false, "two": false, "o": [["骨盤内の仙骨のやや前方に位置する", "正しい。人体の重心は骨盤内の仙骨のやや前方にある。", 1], ["女性は男性よりやや高い位置にある", "誤り。女性は骨盤が大きく下肢が相対的に短いため、重心は男性よりやや低い位置にある。", 0], ["成人男性では足底から身長の約70％の高さにある", "誤り。足底から計測すると、成人男子で身長の約56％、女子で約55％の高さにある。", 0], ["重心の位置が高いほど安定性は増す", "誤り。重心の位置が低いほど安定性は高くなる。", 0]], "z": "安定性は、重心が低い・支持基底が広い・重心線が支持基底の中心に近いほど高い。質量や摩擦が大きいほど安定するのは、運動時と重力以外の外力が加わるときに限られる。"}, {"id": "s1-18", "set": 1, "n": 18, "c": "姿勢", "t": "姿勢・重心線", "p": "p.181〜182", "r": "", "s": "理想的な立位姿勢において、側方からみた重心線が通過する部位はどれか。", "neg": false, "two": false, "o": [["肩峰の後方", "誤り。重心線は肩峰のやや前方を通る。", 0], ["股関節中心の前方", "誤り。重心線は股関節中心のやや後方を通る。重心線が通る指標のうち、後方を通るのは股関節だけである。", 0], ["膝関節軸のやや前方", "正しい。膝関節軸のやや前方を通るため、立位では膝が伸展方向に保たれ、筋力をほとんど使わずに立位を保持できる。", 1], ["外果の後方", "誤り。重心線は外果の前方5〜6cmを通る。", 0]], "z": "乳様突起 → 肩峰 → 股関節中心（大転子）のやや後方 → 膝関節中央のやや前方 → 外果の前方5〜6cm。股関節だけが「後方」である点が狙われやすい。"}, {"id": "s1-19", "set": 1, "n": 19, "c": "歩行", "t": "歩行・歩行周期", "p": "p.190〜192", "r": "", "s": "正常歩行の歩行周期について正しいのはどれか。", "neg": false, "two": false, "o": [["立脚相は歩行周期の約40％を占める", "誤り。立脚相は約60％、遊脚相が約40％である。", 0], ["両脚支持期は1歩行周期に2回あり合計で約20％を占める", "正しい。両脚支持期は荷重応答期と立脚終期の2回あり、各約10％、合計で約20％を占める。", 1], ["1歩行周期は一側の踵接地から対側の踵接地までをいう", "誤り。1歩行周期は一側の踵接地から同側の踵接地までをいう。一側から対側までは1歩（ステップ）。", 0], ["重複歩距離は歩幅と同義である", "誤り。重複歩距離（ストライド）は同側の踵接地から次の同側の踵接地までの距離で、歩幅（ステップ長）の2倍にあたる。", 0]], "z": "歩行速度が上がると両脚支持期の割合は減り、走行では消失して滞空期に置き換わる。両脚支持期の有無が歩行と走行を分ける。"}, {"id": "s1-20", "set": 1, "n": 20, "c": "歩行", "t": "歩行・重心移動", "p": "p.193〜195", "r": "", "s": "正常歩行における重心の移動について正しいのはどれか。", "neg": false, "two": false, "o": [["重心の上下動は約10cmである", "誤り。重心の上下動は約4〜5cmである。", 0], ["重心が最も低くなるのは立脚中期である", "誤り。重心が最も低くなるのは両脚支持期で、最も高くなるのが立脚中期である。", 0], ["重心は1歩行周期に1回上下する", "誤り。重心は1歩行周期に2回上下する。左右それぞれの立脚中期で頂点を迎えるためである。", 0], ["重心は立脚側へ移動し、立脚中期に側方移動が最大となる", "正しい。重心は体重を支える立脚側へ移動し、立脚中期に側方移動が最大となる。左右方向の振幅は約3cmである。", 1]], "z": "重心は上下・左右ともに正弦曲線を描く。上下の振幅は約4.5cmで1歩行周期に2回、左右の振幅は約3cmで1回。上下は立脚中期で最高、踵接地期（同時定着時期）で最低になる。"}, {"id": "s1-21", "set": 1, "n": 21, "c": "歩行", "t": "歩行・床反力", "p": "p.197〜199", "r": "", "s": "正常歩行時の床反力について正しいのはどれか。", "neg": false, "two": false, "o": [["垂直分力は立脚中期に最大となる", "誤り。垂直分力は二峰性を示し、立脚中期はむしろ谷になる。頂点は荷重応答期と立脚終期にある。", 0], ["前後分力は立脚期を通じて前方（駆動）方向に働く", "誤り。前後分力は立脚前半が後方（制動）、後半が前方（駆動）方向に働く。", 0], ["垂直分力の最大値は体重の110〜120％に達する", "正しい。踵接地後の荷重応答期と、踏み切りの立脚終期に体重の110〜120％に達する。", 1], ["床反力とは身体が床に加える力をいう", "誤り。床反力は床が身体に加える力である。身体が床に加える力に対する反作用にあたる。", 0]], "z": "歩行の垂直分力は二峰性（M字型）で谷が体重を下回るのに対し、走行では一峰性となり体重の2〜3倍に達する。"}, {"id": "s1-22", "set": 1, "n": 22, "c": "歩行", "t": "歩行・筋活動", "p": "p.200〜201", "r": "", "s": "正常歩行における筋活動について正しいのはどれか。", "neg": false, "two": false, "o": [["下腿三頭筋は遊脚中期に活動が最大となる", "誤り。下腿三頭筋は立脚終期の踏み切りで求心性に活動し最大となる。遊脚期はほとんど活動しない。", 0], ["前脛骨筋は踵接地直後に遠心性に活動する", "正しい。踵接地から足底接地までの間、前脛骨筋が遠心性に収縮して足部の落下を制動する。麻痺すると足底が床を打つ（フットスラップ）。", 1], ["大腿四頭筋は立脚終期に活動が最大となる", "誤り。大腿四頭筋は踵接地から荷重応答期にかけて最大となり、膝の崩れを防ぐ。", 0], ["大殿筋は遊脚中期に活動が最大となる", "誤り。大殿筋は遊脚終期から立脚初期にかけて活動し、体幹が前方へ屈曲するのを防ぐ。", 0]], "z": "歩行中の筋活動は立脚相の前半（踵接地〜荷重応答期）に集中する。前脛骨筋・大腿四頭筋・大殿筋がこの時期に働き、下腿三頭筋だけが立脚後半に働く。"}, {"id": "s1-23", "set": 1, "n": 23, "c": "歩行", "t": "歩行・異常歩行", "p": "p.207〜211", "r": "", "s": "異常歩行と原因の組合せで誤っているのはどれか。", "neg": true, "two": false, "o": [["鶏歩 ──── 腓骨神経麻痺", "正しい組合せ。腓骨神経麻痺による下垂足のため、足尖が床に引っかからないよう股関節と膝を高く挙上して歩く。", 0], ["トレンデレンブルグ歩行 ──── 中殿筋麻痺", "正しい組合せ。立脚側の中殿筋が働かず、遊脚側の骨盤が下がる。", 0], ["失調性歩行 ──── 小脳障害", "正しい組合せ。小脳障害では平衡が保てず、歩隔を広げて不規則に歩く（酩酊歩行）。", 0], ["分回し歩行 ──── 大腿四頭筋麻痺", "誤った組合せ。分回し歩行は痙性片麻痺でみられ、屈曲しない下肢を外側へ円を描くように振り出す。大腿四頭筋麻痺で生じるのは膝折れ歩行である。", 1]], "z": "トレンデレンブルグ歩行は骨盤が「下がる」、デュシェンヌ歩行は体幹が立脚側へ「傾く」。どちらも中殿筋の障害で生じるが、代償の仕方で呼び分ける。"}, {"id": "s1-24", "set": 1, "n": 24, "c": "発達学習", "t": "運動発達・原始反射", "p": "p.216〜218", "r": "", "s": "原始反射について正しいのはどれか。", "neg": false, "two": false, "o": [["ガラント反射は脊柱の側方を刺激すると刺激側へ体幹が側屈する反射である", "正しい。腹臥位などで脊柱の側方を擦ると、刺激した側へ体幹が側屈する。生後2か月頃までに消失する。", 1], ["非対称性緊張性頸反射では顔を向けた側の上下肢が屈曲する", "誤り。顔を向けた側の上下肢が伸展し、後頭側の上下肢が屈曲する。", 0], ["モロー反射は生後10か月頃まで残存する", "誤り。モロー反射は生後4〜6か月頃までに消失する。", 0], ["パラシュート反応は原始反射の一つである", "誤り。パラシュート反応は生後6か月ころに出現して生涯残る反応であり、原始反射ではない。", 0]], "z": "原始反射は出生時からみられ発達とともに消失する。立ち直り反応・平衡反応・保護伸展反応（パラシュート反応）は、原始反射が消えるのと入れ替わりに出現して残存する。"}, {"id": "s1-25", "set": 1, "n": 25, "c": "発達学習", "t": "運動学習・練習法とフィードバック", "p": "p.226〜228", "r": "", "s": "運動学習について正しいのはどれか。", "neg": false, "two": false, "o": [["運動技能の習得では正確性より速度を先に獲得する", "誤り。まず正確性を獲得し、その後に速度・持続性へと発展する。", 0], ["結果の知識（KR）は毎回与えるほど保持がよい", "誤り。毎回与えるとフィードバックへの依存が生じ、与えられない条件での保持が低下する。頻度を減らすほうが長期的な保持はよい。", 0], ["分習法は動作が複雑で長い場合に適する", "正しい。複雑で長い動作は要素に分けて練習する分習法が適する。単純で短い動作には全習法が適する。", 1], ["プラトーは技能が永久に向上しなくなった状態をいう", "誤り。プラトーは学習過程でみられる一時的な停滞で、その後に再び向上する。", 0]], "z": "運動学習の3相＝初期相（言語・運動段階：課題を言葉で理解する）→中間相（運動段階：KRを参考に誤りを修正する）→最終相（自動化）。運動技能はフォーム→正確性→速度・適応性の順に獲得する。結果の知識（KR）＝動作の結果についての情報、パフォーマンスの知識（KP）＝動作のフォームや質についての情報。"}, {"id": "s2-1", "set": 2, "n": 1, "c": "総論", "t": "運動学総論・運動の種類", "p": "p.8〜10", "r": "", "s": "運動の種類について正しいのはどれか。", "neg": false, "two": false, "o": [["並進運動では身体各部がそれぞれ異なる距離を移動する", "誤り。並進運動では身体の各点が同じ方向へ同じ距離だけ移動する。", 0], ["角運動では回転軸から遠い点ほど移動距離が大きい", "正しい。角運動では各点が同じ角度だけ回転するため、回転軸から遠いほど移動距離（弧の長さ）が大きくなる。", 1], ["関節面の滑り運動は角運動に分類される", "誤り。関節面の滑りは並進運動（副運動）に分類される。", 0], ["人体の関節運動の大部分は並進運動である", "誤り。関節は一定の運動軸をもつため、関節運動の大部分は角運動である。", 0]], "z": "関節運動は角運動（転がり）と並進運動（滑り）の組合せで成り立つ。外から見える関節角度の変化が角運動、関節面どうしのずれが並進運動にあたる。"}, {"id": "s2-2", "set": 2, "n": 2, "c": "総論", "t": "運動学総論・力のモーメント", "p": "p.11〜15", "r": "", "s": "力のモーメントについて正しいのはどれか。", "neg": false, "two": false, "o": [["力の作用線が回転軸を通るとき最大となる", "誤り。作用線が回転軸を通るときモーメントアームはゼロとなり、モーメントもゼロになる。", 0], ["モーメントアームが長いほど小さくなる", "誤り。モーメントは「力×モーメントアーム」なので、アームが長いほど大きくなる。", 0], ["単位はジュールである", "誤り。力のモーメントの単位はニュートンメートル（N・m）である。ジュールは仕事の単位。", 0], ["拮抗する2つの力のモーメントが等しいとき関節は動かない", "正しい。屈曲方向と伸展方向のモーメントが釣り合うと関節は静止する。等尺性収縮で肢位を保持している状態がこれにあたる。", 1]], "z": "筋の停止部が関節のすぐ近くにある人体では、モーメントアームが短いぶん大きな筋力が必要になる。これが第3のてこが「力において不利」とされる理由である。"}, {"id": "s2-3", "set": 2, "n": 3, "c": "総論", "t": "運動学総論・スカラー量とベクトル量", "p": "p.10・18", "r": "", "s": "ベクトル量はどれか。", "neg": false, "two": false, "o": [["加速度", "正しい。加速度は大きさと向きをあわせもつベクトル量である。", 1], ["時間", "誤り。時間は大きさのみをもつスカラー量である。", 0], ["質量", "誤り。質量は大きさのみをもつスカラー量である。", 0], ["仕事", "誤り。仕事は力と変位の積であるが、向きをもたないスカラー量である。", 0]], "z": "ベクトル量＝速度・加速度・力・運動量・力のモーメント。スカラー量＝質量・時間・長さ・温度・仕事・エネルギー。「向きを問えるかどうか」で見分ける。"}, {"id": "s2-4", "set": 2, "n": 4, "c": "運動器", "t": "運動器の構造と機能・筋収縮の機序", "p": "p.32", "r": "", "s": "骨格筋の収縮機序について正しいのはどれか。", "neg": false, "two": false, "o": [["収縮時にアクチンフィラメント自体が短縮する", "誤り。フィラメント自体は短縮せず、互いに滑り込むことで筋が短縮する（滑走説）。", 0], ["収縮時にA帯が短縮する", "誤り。A帯（ミオシンフィラメントの長さ）は不変で、短縮するのはI帯とH帯である。", 0], ["カルシウムイオンがトロポニンに結合すると収縮が可能となる", "正しい。筋小胞体から放出されたカルシウムイオンがトロポニンに結合すると、トロポミオシンが移動してアクチンの結合部位が露出する。", 1], ["ミオシン頭部の首振り運動にATPは不要である", "誤り。ミオシン頭部の首振りと、アクチンからの解離にはATPが必要である。", 0]], "z": "収縮時に短縮するのはI帯とH帯、変わらないのがA帯。死後硬直はATPが枯渇してミオシンがアクチンから離れられなくなるために起こる。"}, {"id": "s2-5", "set": 2, "n": 5, "c": "運動器", "t": "運動器の構造と機能・筋収縮の様態", "p": "p.37〜39", "r": "", "s": "筋収縮の様態について誤っているのはどれか。", "neg": true, "two": false, "o": [["等尺性収縮では関節運動を伴わない", "正しい。筋長が変わらず関節運動を伴わない収縮で、壁を押す動作などがこれにあたる。", 0], ["等張性収縮では筋の長さが変化する", "正しい。一定の張力のまま筋長が変化する収縮で、短縮すれば求心性、伸長すれば遠心性となる。", 0], ["遠心性収縮では筋が張力を発揮しながら伸長する", "正しい。荷物をゆっくり下ろす動作が典型で、外力に負けながら張力を発揮する。", 0], ["同一の筋では求心性収縮のほうが遠心性収縮より大きな張力を発揮できる", "誤り。発揮できる張力は 遠心性＞等尺性＞求心性 の順で、遠心性収縮が最大となる。", 1]], "z": "遠心性収縮は最も大きな張力を発揮できる一方、筋線維の微細な損傷を起こしやすく、遅発性筋痛の主な原因となる。"}, {"id": "s2-6", "set": 2, "n": 6, "c": "感覚", "t": "運動感覚・筋紡錘", "p": "p.53〜54", "r": "", "s": "筋紡錘について正しいのはどれか。", "neg": false, "two": false, "o": [["錘内筋線維はα運動ニューロンに支配される", "誤り。錘内筋線維を支配するのはγ運動ニューロンである。α運動ニューロンが支配するのは錘外筋線維。", 0], ["長さは2〜4mmである", "正しい。筋紡錘は長さ2〜4mm、太さ0.1〜0.2mm程度の紡錘形の受容器である。", 1], ["二次終末はⅠa群求心性線維を出す", "誤り。二次終末が出すのはⅡ群線維である。Ⅰa群線維を出すのは一次終末（らせん終末）。", 0], ["筋が短縮すると発射頻度が増加する", "誤り。筋が伸張されたときに発射頻度が増加する。短縮すると弛んで発射が止まるため、γ運動ニューロンが錘内筋線維を収縮させて感度を保つ。", 0]], "z": "α運動ニューロン＝錘外筋線維（力を出す）、γ運動ニューロン＝錘内筋線維（感度を保つ）。随意運動では両者が同時に働く（α‑γ連関）。"}, {"id": "s2-7", "set": 2, "n": 7, "c": "感覚", "t": "運動感覚・腱器官", "p": "p.55〜56", "r": "", "s": "腱器官（ゴルジ腱器官）について正しいのはどれか。", "neg": false, "two": false, "o": [["筋腹の中央部に存在する", "誤り。腱器官は筋腱移行部に存在する。", 0], ["錘外筋線維と並列に配列する", "誤り。腱器官は錘外筋線維と直列に配列する。並列に配列するのは筋紡錘。", 0], ["求心性線維はⅠb群である", "正しい。Ⅰb群線維を介して抑制性介在ニューロンを興奮させ、同名筋を弛緩させる。", 1], ["筋が伸張されたときのみ興奮する", "誤り。腱器官は張力を感知するため、筋が収縮したときにも興奮する。むしろ収縮時のほうが感度が高い。", 0]], "z": "腱器官は過大な張力から筋・腱の断裂を防ぐ安全装置として働く。筋紡錘が伸張に対して収縮を促すのに対し、腱器官は張力に対して弛緩を促す。"}, {"id": "s2-8", "set": 2, "n": 8, "c": "反射", "t": "反射と随意運動・反射の中枢", "p": "p.60〜64", "r": "", "s": "反射と中枢の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["緊張性迷路反射 ──── 脳幹", "正しい組合せ。緊張性迷路反射は内耳の前庭器からの入力による反射で、中枢は脳幹にある。", 1], ["伸張反射 ──── 延髄", "誤った組合せ。伸張反射は単シナプス反射で、中枢は脊髄にある。", 0], ["非対称性緊張性頸反射 ──── 脊髄", "誤った組合せ。非対称性緊張性頸反射の中枢は脳幹（延髄）にある。", 0], ["平衡反応 ──── 中脳", "誤った組合せ。平衡反応の中枢は大脳皮質にある。中脳が中枢となるのは立ち直り反射。", 0]], "z": "中枢の高さは 脊髄 → 脳幹 → 中脳 → 大脳皮質 の順に上がり、出現もこの順に遅くなる。原始反射（脊髄・脳幹）が消えてから、立ち直り反応（中脳）・平衡反応（大脳皮質）が現れる。"}, {"id": "s2-9", "set": 2, "n": 9, "c": "反射", "t": "反射と随意運動・錐体路", "p": "p.66〜67", "r": "", "s": "随意運動の伝導路について正しいのはどれか。", "neg": false, "two": false, "o": [["補足運動野は運動の実行のみに関与する", "誤り。補足運動野は運動の準備とプログラムの形成に関与する。実行の指令を出すのは一次運動野。", 0], ["錐体路は脊髄前索のみを下行する", "誤り。交叉した線維は側索（外側皮質脊髄路）を、交叉しない線維は前索（前皮質脊髄路）を下行する。", 0], ["大脳基底核は錐体路の一部である", "誤り。大脳基底核は錐体外路系に属し、運動の調節に関与する。", 0], ["錐体路は延髄下端で大部分が交叉する", "正しい。皮質脊髄路の約80〜90％が延髄下端の錐体交叉で対側へ渡り、外側皮質脊髄路となる。", 1]], "z": "錐体路＝随意運動の指令を直接伝える経路、錐体外路＝筋トーヌスや不随意的な調節を担う経路。小脳と大脳基底核はどちらも調節系で、筋へ直接命令を送らない点が共通する。"}, {"id": "s2-10", "set": 2, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・胸鎖関節と肩鎖関節", "p": "p.69〜73", "r": "", "s": "胸鎖関節と肩鎖関節について正しいのはどれか。", "neg": false, "two": false, "o": [["胸鎖関節は球関節である", "誤り。胸鎖関節は鞍関節である。関節円板を介するため、機能的には3軸性の運動を行う。", 0], ["胸鎖関節には関節円板がある", "正しい。関節面の適合が悪いため関節円板が介在し、これにより広い可動性が得られる。", 1], ["鎖骨の肩峰端は下方へ約10cm動く", "誤り。鎖骨の肩峰端は上方へ約10cm、下方へ約3cm動く。上方への可動域のほうが大きい。", 0], ["肩鎖関節は上肢帯と体幹を連結する唯一の関節である", "誤り。上肢帯と体幹を連結する唯一の関節は胸鎖関節である。肩鎖関節は鎖骨と肩甲骨を結ぶ。", 0]], "z": "上肢と体幹をつなぐ骨性の連結は胸鎖関節だけで、肩甲骨は筋によって胸郭上に保持されている。このため上肢帯は可動性に富む反面、安定性に乏しい。"}, {"id": "s2-11", "set": 2, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・回旋筋腱板", "p": "p.78〜82", "r": "", "s": "回旋筋腱板を構成しないのはどれか。", "neg": true, "two": false, "o": [["大円筋", "構成しない。大円筋は小結節稜に停止し、伸展・内転・内旋に働く。", 1], ["棘下筋", "構成する。大結節に停止し、肩関節の外旋に働く。", 0], ["小円筋", "構成する。大結節に停止し、外旋および水平伸展に働く。", 0], ["棘上筋", "構成する。棘上窩から起こり上腕骨大結節に停止し、外転の初期に働く。", 0]], "z": "回旋筋腱板は棘上筋・棘下筋・小円筋・肩甲下筋の4筋。前面の肩甲下筋だけが小結節に停止して内旋に働き、残り3筋は大結節に停止する。"}, {"id": "s2-12", "set": 2, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・前腕の筋と神経", "p": "p.90〜95", "r": "", "s": "筋と支配神経の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["円回内筋 ──── 橈骨神経", "誤った組合せ。円回内筋は正中神経の支配を受ける。", 0], ["回外筋 ──── 正中神経", "誤った組合せ。回外筋は橈骨神経（後骨間神経）の支配を受ける。", 0], ["方形回内筋 ──── 正中神経", "正しい組合せ。方形回内筋は正中神経（前骨間神経）の支配を受ける。", 1], ["腕橈骨筋 ──── 尺骨神経", "誤った組合せ。腕橈骨筋は橈骨神経の支配を受ける。前腕屈側に見えて橈骨神経支配である点が問われやすい。", 0]], "z": "回内筋（円回内筋・方形回内筋）は正中神経、回外筋は橈骨神経。回外にはこれに加えて上腕二頭筋（筋皮神経）が働くため、回外の筋力は回内より強い。"}, {"id": "s2-13", "set": 2, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・母指の運動", "p": "p.113〜118", "r": "", "s": "母指の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["対立運動の主動作筋は母指内転筋である", "誤り。対立運動の主動作筋は母指対立筋である。母指内転筋は内転に働く。", 0], ["掌側外転は母指を手掌面から垂直に離す運動である", "正しい。掌側外転は母指を手掌面から垂直に離す運動、橈側外転は手掌面に沿って橈側へ開く運動をいう。", 1], ["母指の手根中手関節は蝶番関節である", "誤り。母指の手根中手関節は鞍関節である。この形状が対立運動を可能にしている。", 0], ["母指対立筋は橈骨神経支配である", "誤り。母指対立筋は正中神経（反回枝）の支配を受ける。正中神経麻痺で猿手となるのはこのためである。", 0]], "z": "母指球筋のうち母指内転筋だけが尺骨神経支配で、短母指外転筋・母指対立筋・短母指屈筋浅頭は正中神経支配である。"}, {"id": "s2-14", "set": 2, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の筋", "p": "p.120〜125", "r": "", "s": "股関節の外旋に作用しないのはどれか。", "neg": true, "two": false, "o": [["大殿筋", "作用する。大殿筋は伸展の主動作筋であると同時に、強力な外旋筋でもある。", 0], ["梨状筋", "作用する。梨状筋は深層外旋六筋の一つである。", 0], ["外閉鎖筋", "作用する。外閉鎖筋も深層外旋六筋の一つである。", 0], ["半膜様筋", "作用しない。半膜様筋は股関節の伸展にはたらき、内旋を補助する（教科書の表8-11）。外旋の作用はない。", 1]], "z": "深層外旋6筋は梨状筋・上双子筋・内閉鎖筋・下双子筋・大腿方形筋・外閉鎖筋。外旋の主動作筋は大殿筋と深層外旋6筋で、補助に腸腰筋・縫工筋・恥骨筋・長内転筋・短内転筋・大腿二頭筋・中殿筋・小殿筋。内旋の主動作筋は小殿筋で、中殿筋・半腱様筋・半膜様筋が補助する。"}, {"id": "s2-15", "set": 2, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・足関節と足部", "p": "p.131〜144", "r": "", "s": "足部について正しいのはどれか。", "neg": false, "two": false, "o": [["距腿関節は二軸性関節である", "誤り。距腿関節は一軸性の蝶番関節（螺旋関節）である。", 0], ["距骨滑車は後方が前方より広い", "誤り。距骨滑車は前方が広く後方が狭い。このため背屈位では前方部分が脛腓間にはまり込み、関節が最も安定する。", 0], ["内側縦アーチの保持に後脛骨筋が関与する", "正しい。後脛骨筋は舟状骨・楔状骨に停止し、長腓骨筋とともに内側縦アーチを下方から支える。", 1], ["足関節の背屈可動域は底屈より大きい", "誤り。参考可動域は底屈45度・背屈20度で、底屈のほうが大きい。", 0]], "z": "内側縦アーチは踵骨・距骨・舟状骨・楔状骨・第1〜3中足骨、外側縦アーチは踵骨・立方骨・第4〜5中足骨で構成される。高いのは内側縦アーチである。"}, {"id": "s2-16", "set": 2, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・脊柱", "p": "p.146〜152", "r": "", "s": "脊柱について正しいのはどれか。", "neg": false, "two": false, "o": [["頸部回旋の約半分は環軸関節で行われる", "正しい。環軸関節は歯突起を軸とする車軸関節で、頸部回旋のうち約半分を担う。", 1], ["胸椎は腰椎より屈曲・伸展の可動域が大きい", "誤り。屈曲・伸展の可動域は腰椎のほうが大きい。胸椎は肋骨があるため可動性が制限される。", 0], ["腰椎は脊柱のなかで回旋の可動域が最も大きい", "誤り。腰椎の椎間の回旋は各2度程度と小さい（教科書の表8-18）。腰椎で大きいのは屈伸（L5〜S1で20度）である。", 0], ["生理的弯曲は頸椎後弯・胸椎前弯・腰椎後弯である", "誤り。生理的弯曲は頸椎前弯・胸椎後弯・腰椎前弯・仙尾椎後弯である。", 0]], "z": "脊椎間の可動域（代表値）：後頭骨〜環椎は屈伸13度・回旋0度、環軸関節は回旋47度で最大・側屈0度、胸椎は回旋が各8度程度、腰椎は屈伸が大きく回旋が各2度程度。"}, {"id": "s2-17", "set": 2, "n": 17, "c": "姿勢", "t": "姿勢・主要姿勢筋", "p": "p.183〜184", "r": "", "s": "主要姿勢筋に含まれるのはどれか。", "neg": false, "two": false, "o": [["前脛骨筋", "誤り。前脛骨筋は腹側の抗重力筋に数えられるが、主要姿勢筋には含まれない。重心線が足関節の前方を通るため、立位で必要なのは底屈筋の活動である。", 0], ["ヒラメ筋", "正しい。ヒラメ筋を含む下腿三頭筋は、安静立位で持続的に活動して身体が前方へ倒れるのを防ぐ。", 1], ["腹直筋", "誤り。腹直筋（腹筋群）は腹側の抗重力筋だが、主要姿勢筋には含まれない。通常の立位では背側の筋群が相対的に重要である。", 0], ["上腕二頭筋", "誤り。上腕二頭筋は立位姿勢の保持には関与しない。", 0]], "z": "抗重力筋＝腹側：頸部屈筋群・腹筋群・大腿四頭筋・前脛骨筋、背側：頸部伸筋群・脊柱起立筋群・大殿筋・ハムストリングス・下腿三頭筋。通常の立位では背側の筋群が重要で、なかでも頸部伸筋群・脊柱起立筋群・ハムストリングス・ヒラメ筋をとくに主要姿勢筋と呼ぶ。"}, {"id": "s2-18", "set": 2, "n": 18, "c": "姿勢", "t": "姿勢・安定性", "p": "p.185", "r": "", "s": "立位姿勢の安定性について正しいのはどれか。", "neg": false, "two": false, "o": [["重心動揺は開眼時のほうが閉眼時より大きい", "誤り。視覚情報が失われる閉眼時のほうが重心動揺は大きくなる。", 0], ["支持基底面が広いほど安定性は低下する", "誤り。支持基底面が広いほど安定性は高くなる。", 0], ["体重が軽いほど安定性は高い", "誤り。質量が大きいほど動かすのに大きな力を要するため、安定性は高くなる。ただし質量が安定性に影響するのは、運動時と重力以外の外力が加わるときに限られる。", 0], ["重心線が支持基底面の中央に近いほど安定性は高い", "正しい。重心線が支持基底面の縁に近づくほど、わずかな動揺で基底面の外に出て転倒しやすくなる。", 1]], "z": "立位の保持には視覚・前庭感覚・体性感覚の3つが関与する。閉眼で動揺が著明に増す場合は、深部感覚の障害を視覚で代償している状態で、ロンベルグ徴候陽性という。"}, {"id": "s2-19", "set": 2, "n": 19, "c": "歩行", "t": "歩行・歩行パラメータ", "p": "p.190〜192", "r": "", "s": "歩行のパラメータと正常値の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["歩隔 ──── 約20cm", "誤った組合せ。歩隔（左右の足の間隔）は約7〜9cmである。", 0], ["足角 ──── 約30度", "誤った組合せ。足角（つま先の開き）は約7〜8度である。", 0], ["歩行率 ──── 毎分約110〜120歩", "正しい組合せ。歩行率（ケイデンス）は毎分約110〜120歩で、年齢や性別により幅がある。", 1], ["重複歩距離 ──── 歩幅と同じ", "誤った組合せ。重複歩距離（ストライド）は歩幅（ステップ長）の2倍である。", 0]], "z": "歩行速度＝歩幅×歩行率。高齢者では歩幅の短縮と歩行率の低下がともに起こるため、速度が大きく低下する。"}, {"id": "s2-20", "set": 2, "n": 20, "c": "歩行", "t": "歩行・決定因子", "p": "p.195〜196", "r": "", "s": "歩行時の重心の移動を小さくする因子でないのはどれか。", "neg": true, "two": false, "o": [["体幹の著しい側方動揺", "因子ではない。体幹の著しい側方動揺はむしろ重心の移動を大きくし、エネルギー効率を下げる。中殿筋の機能低下などでみられる異常所見である。", 1], ["骨盤の側方傾斜", "因子である。遊脚側の骨盤がわずかに下制することで、立脚中期の重心の上昇が抑えられる。", 0], ["立脚相における膝関節の軽度屈曲", "因子である。荷重応答期に膝が軽度屈曲することで、重心の上下動が緩衝される。", 0], ["骨盤の水平回旋", "因子である。骨盤が遊脚側で前方へ回旋することで、重心の下降を抑えながら歩幅を得る。", 0]], "z": "歩行の決定因子は、骨盤の水平回旋・骨盤の側方傾斜・立脚相の膝屈曲・足関節と膝関節の協調・骨盤の側方移動 などで、いずれも重心の軌跡を平坦にしてエネルギー消費を抑える。"}, {"id": "s2-21", "set": 2, "n": 21, "c": "歩行", "t": "歩行・体節の運動", "p": "p.194", "r": "", "s": "正常歩行における体節の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["骨盤と肩甲帯は同じ方向に回旋する", "誤り。骨盤と肩甲帯は互いに逆方向へ回旋する。これにより体幹の回旋モーメントが打ち消される。", 0], ["上肢は同側の下肢と同じ方向に振られる", "誤り。上肢は対側の下肢と同じ方向に振られる。右下肢が前に出るとき左上肢が前に振られる。", 0], ["立脚相で膝関節は伸展のみを行う", "誤り。膝関節は立脚相のなかで屈曲・伸展・屈曲と二峰性に動く（荷重応答期の屈曲、立脚中期の伸展、立脚終期からの屈曲）。", 0], ["骨盤の水平回旋は左右合わせて約8度である", "正しい。骨盤の水平回旋は左右合わせて約8度と小さい。", 1]], "z": "股関節が1歩行周期に屈曲・伸展を1回ずつ行うのに対し、膝関節は屈曲を2回行う。この二重膝作用が重心の上下動を抑えている。"}, {"id": "s2-22", "set": 2, "n": 22, "c": "歩行", "t": "歩行・走行", "p": "p.206", "r": "", "s": "走行について正しいのはどれか。", "neg": false, "two": false, "o": [["両脚支持期が1歩行周期に2回ある", "誤り。走行では両脚支持期が消失する。", 0], ["両足とも地面から離れる時期がある", "正しい。両脚支持期の代わりに、両足とも地面から離れる滞空期が出現する。", 1], ["床反力の垂直分力は二峰性を示す", "誤り。走行の床反力垂直分力は一峰性で、体重の2〜3倍に達する。二峰性を示すのは歩行。", 0], ["立脚相の割合は歩行より大きい", "誤り。立脚相の割合は歩行（約60％）より小さくなり、遊脚相が大きくなる。", 0]], "z": "歩行は「どちらかの足が必ず接地している」運動、走行は「両足とも離れる瞬間がある」運動と定義される。速度ではなく接地の様式で区別する。"}, {"id": "s2-23", "set": 2, "n": 23, "c": "歩行", "t": "歩行・高齢者の歩行", "p": "p.207", "r": "", "s": "高齢者の歩行の特徴でないのはどれか。", "neg": true, "two": false, "o": [["歩幅の短縮", "特徴である。下肢筋力の低下と関節可動域の制限により歩幅が短くなる。", 0], ["歩隔の増大", "特徴である。側方への安定性を得るため歩隔が広がる。", 0], ["足関節背屈の増大", "特徴ではない。高齢者では足関節の背屈が減少し、踵接地が不明瞭になって足底全体で接地しやすくなる。", 1], ["両脚支持期の割合の増加", "特徴である。安定性を優先して両脚支持期の割合が増し、その分だけ遊脚相が減る。", 0]], "z": "高齢者の歩行は「速度低下・歩幅短縮・歩隔増大・両脚支持期延長・背屈減少」が基本型で、いずれも安定性を優先し推進力を犠牲にした結果である。"}, {"id": "s2-24", "set": 2, "n": 24, "c": "発達学習", "t": "運動発達・発達の原則", "p": "p.219〜223", "r": "", "s": "正常運動発達について正しいのはどれか。", "neg": false, "two": false, "o": [["発達は頭部から尾部へ進む", "正しい。首がすわる→坐位→立位の順に、頭部から尾部（足部）へ向かって発達する。", 1], ["発達は微細運動から粗大運動へ進む", "誤り。粗大運動から微細運動へ進む。手全体でつかむ動作が先で、指でつまむ動作は後になる。", 0], ["支持なしの坐位保持は生後3〜4か月頃に可能となる", "誤り。坐位保持が可能になるのは生後5〜8か月である。", 0], ["発達は末梢から中枢へ進む", "誤り。発達は中枢（体幹・近位）から末梢（遠位）へ進む。肩や股関節の制御が先で、指先の制御は後になる。", 0]], "z": "発達の3原則は「頭部→尾部」「中枢→末梢」「粗大→微細」。いずれも、より大きく中心に近い部分の制御が先に完成するという方向で共通する。"}, {"id": "s2-25", "set": 2, "n": 25, "c": "発達学習", "t": "運動学習・フィードバック", "p": "p.226〜230", "r": "", "s": "運動学習のフィードバックについて正しいのはどれか。", "neg": false, "two": false, "o": [["結果の知識（KR）は動作のフォームに関する情報である", "誤り。KRは動作の結果（目標を達成できたか、どれだけ跳べたかなど）に関する情報である。", 0], ["固有感覚から得られる情報は内在的フィードバックである", "正しい。筋・腱・関節の受容器や視覚・前庭感覚など、学習者自身の感覚器から得られる情報を内在的フィードバックという。", 1], ["パフォーマンスの知識（KP）は動作の結果に関する情報である", "誤り。KPは動作そのもののフォームや質に関する情報である。", 0], ["外在的フィードバックは頻度が高いほど長期的な保持がよい", "誤り。頻度が高いとフィードバックへの依存が生じ、与えられない条件での保持が低下する。", 0]], "z": "内在的フィードバック＝自分の感覚から得る情報、外在的フィードバック＝指導者などから与えられる情報（KR・KP）。学習が進むほど内在的フィードバックへ移行させることが目標になる。"}, {"id": "s3-1", "set": 3, "n": 1, "c": "総論", "t": "運動学総論・力の合成と分解", "p": "p.11〜13※", "r": "", "s": "骨格筋の張力の分解について正しいのはどれか。", "neg": false, "two": false, "o": [["筋の作用線と骨の長軸のなす角が90度のとき回転分力は最大となる", "正しい。回転分力は張力×sinθで表され、θ＝90度でsinθ＝1となり、張力のすべてが関節を回す力になる。", 1], ["向きの異なる2つの力の合力は2つの力の大きさの和になる", "誤り。合力が2つの力の和になるのは同じ向きのときだけである。向きが異なる2力は平行四辺形の法則で合成し、その大きさは和より小さい。", 0], ["肘関節を90度以上屈曲すると、上腕二頭筋の分力は関節を圧迫する方向に働く", "誤り。付着角が90度を超えると、骨の長軸方向の分力は関節を引き離す方向（脱臼分力）に働く。90度未満では関節を圧迫して安定させる方向に働く。", 0], ["筋の作用線と骨の長軸のなす角が小さいほど回転分力は大きくなる", "誤り。角度が小さいほど回転分力（sinθ）は小さくなり、骨を関節へ押しつける安定化分力（cosθ）が大きくなる。", 0]], "z": "筋張力は「回転分力（関節を回す）」と「安定化分力（関節面へ押しつける／引き離す）」に分解される。付着角90度で回転分力が最大となるため、上腕二頭筋の屈曲トルクは肘屈曲80〜90度付近で最大になる。伸展位に近いほど張力の多くが安定化分力に使われる。"}, {"id": "s3-2", "set": 3, "n": 2, "c": "総論", "t": "運動学総論・力のモーメント（計算）", "p": "p.11〜15※", "r": "", "s": "肘関節90度屈曲位で、肘関節中心から30cmの位置に2kgの重錘を保持している。上腕二頭筋の停止部は肘関節中心から3cmの位置にある。重錘の保持に必要な上腕二頭筋の筋力はどれか。ただし、前腕・手の重さは無視し、重力加速度は10m/s²とする。", "neg": false, "two": false, "o": [["20N", "誤り。重錘の重さ（2kg×10m/s²＝20N）をそのまま答えた値である。モーメントアームの違いを考慮していない。", 0], ["60N", "誤り。重錘のモーメント（20N×0.3m＝6N・m）の数値を力の単位で答えた値である。", 0], ["200N", "正しい。重錘のモーメントは 20N×0.3m＝6N・m。これと釣り合う筋のモーメントは 筋力×0.03m なので、筋力＝6÷0.03＝200N となる。", 1], ["600N", "誤り。3cmを0.01mとして計算するなど、単位換算を誤ると出る値である。", 0]], "z": "関節が静止しているとき「筋力×筋のモーメントアーム＝負荷×負荷のモーメントアーム」が成り立つ。この例では負荷のアームが筋の10倍なので、筋は負荷の10倍の力を出す必要がある。第3のてこが力において不利であることを数値で示した問題。"}, {"id": "s3-3", "set": 3, "n": 3, "c": "総論", "t": "運動学総論・速度と加速度", "p": "p.16〜18※", "r": "", "s": "速度と加速度について正しいのはどれか。", "neg": false, "two": false, "o": [["等速直線運動では加速度はゼロである", "正しい。速度の大きさも向きも変わらないため、速度の変化率である加速度はゼロとなる。ニュートンの第1法則（慣性の法則）の状態である。", 1], ["速さは向きをもつベクトル量である", "誤り。速さは大きさだけをもつスカラー量である。向きをあわせもつ「速度」がベクトル量。", 0], ["自由落下する物体の加速度は質量に比例する", "誤り。空気抵抗を無視すれば、自由落下の加速度は質量にかかわらず重力加速度（約9.8m/s²）で一定である。", 0], ["加速度の単位はm/sである", "誤り。加速度は単位時間あたりの速度の変化なので、単位はm/s²となる。m/sは速度の単位。", 0]], "z": "ニュートンの運動の3法則は、第1法則＝慣性の法則、第2法則＝運動の法則（力＝質量×加速度、F＝ma）、第3法則＝作用・反作用の法則。床反力は第3法則、筋力で身体を加速するのは第2法則で説明される。"}, {"id": "s3-4", "set": 3, "n": 4, "c": "運動器", "t": "運動器の構造と機能・筋の形状", "p": "p.33〜34※", "r": "", "s": "筋と形状の組合せで誤っているのはどれか。", "neg": true, "two": false, "o": [["大腿直筋 ―――― 羽状筋", "正しい組合せ。大腿直筋は中央の腱の両側から筋線維が斜めに付く羽状筋（両羽状筋）である。", 0], ["上腕二頭筋 ―――― 二腹筋", "誤った組合せ。上腕二頭筋は起始が2つに分かれる二頭筋である。二腹筋は中間腱で筋腹が2つに分かれる筋で、顎二腹筋や肩甲舌骨筋が例。", 1], ["縫工筋 ―――― 平行筋", "正しい組合せ。縫工筋は筋線維が長軸に平行に走る紐状の平行筋で、人体で最も長い筋である。", 0], ["三角筋 ―――― 多羽状筋", "正しい組合せ。三角筋（特に中部線維）は多数の腱膜に筋線維が斜めに付く多羽状筋である。", 0]], "z": "羽状筋は筋線維が短く斜めに並ぶため、生理的断面積が大きく大きな力を出せるが、収縮距離は小さい。平行筋は筋線維が長く、収縮距離と速度に優れる。ほかに多頭筋（上腕三頭筋・大腿四頭筋）、多腹筋（腹直筋）、鋸筋（前鋸筋）がある。"}, {"id": "s3-5", "set": 3, "n": 5, "c": "運動器", "t": "運動器の構造と機能・長さ‑張力関係", "p": "p.37〜39※", "r": "", "s": "骨格筋の長さと張力の関係について正しいのはどれか。", "neg": false, "two": false, "o": [["筋を静止長の2倍まで伸張すると能動張力は最大となる", "誤り。伸張しすぎるとフィラメントの重なりが減り、能動張力は低下する。一方、結合組織による受動張力は増大する。", 0], ["求心性収縮では短縮速度が速いほど大きな張力を発揮する", "誤り。力‑速度関係により、短縮速度が速いほど発揮できる張力は小さくなる。", 0], ["筋は静止長付近で最大の能動張力を発揮する", "正しい。静止長付近ではアクチンとミオシンの重なりが最適で、形成される連結橋の数が最大となる。", 1], ["二関節筋は両方の関節で同時に短縮すると最大の張力を発揮する", "誤り。両関節で同時に短縮すると筋が短くなりすぎ、十分な張力を発揮できない（能動不全）。", 0]], "z": "能動不全＝二関節筋が両関節で短縮しすぎて力が出ない状態（手関節掌屈位で握ると握力が落ちる）。受動不全＝拮抗する二関節筋が伸ばされきって関節運動が制限される状態（膝伸展位で股関節を屈曲するとハムストリングスに制限される）。"}, {"id": "s3-6", "set": 3, "n": 6, "c": "感覚", "t": "運動感覚・関節受容器", "p": "p.56〜57※", "r": "", "s": "関節受容器について正しいのはどれか。", "neg": false, "two": false, "o": [["自由神経終末は関節の運動速度を感知する", "誤り。自由神経終末は侵害受容器で、関節の痛みに関与する。通常の関節運動では興奮しない。", 0], ["ゴルジ型終末は主に関節包の表層にある", "誤り。ゴルジ型終末は主に靱帯にある。閾値が高く、関節が可動域の終わりに近づいて靱帯が強く引かれたときに興奮する。", 0], ["パチニ小体型終末は遅順応性である", "誤り。パチニ小体型終末は関節包の深層にあり、順応が速い。関節運動の開始・停止や加速度の感知に適する。", 0], ["ルフィニ終末は遅順応性で関節の位置の感知に関与する", "正しい。関節包の表層にあり、順応が遅いため静止時の関節角度（位置）や関節内圧を持続的に伝える。", 1]], "z": "Ⅰ型＝ルフィニ終末（関節包表層・遅順応・位置）、Ⅱ型＝パチニ小体型（関節包深層・速順応・運動の加速）、Ⅲ型＝ゴルジ型（靱帯・遅順応・高閾値）、Ⅳ型＝自由神経終末（侵害受容・痛み）。"}, {"id": "s3-7", "set": 3, "n": 7, "c": "感覚", "t": "運動感覚・二点識別覚と振動覚", "p": "p.57〜58※", "r": "", "s": "二点識別覚と振動覚について正しいのはどれか。", "neg": false, "two": false, "o": [["二点識別閾は指尖のほうが背部より小さい", "正しい。指尖の二点識別閾は約2〜3mm、背部は約40〜70mmで、受容器の密度が高い指尖のほうが鋭敏である。", 1], ["振動覚は外側脊髄視床路を上行する", "誤り。振動覚は深部感覚として後索‑内側毛帯路を上行する。外側脊髄視床路が伝えるのは痛覚・温度覚。", 0], ["二点識別覚は受容器の密度が低い部位ほど鋭敏である", "誤り。受容器の密度が高く、1つの受容野が小さい部位ほど鋭敏である。", 0], ["振動覚の主な受容器はメルケル盤である", "誤り。振動覚の主な受容器はパチニ小体である。メルケル盤は順応が遅く、持続的な圧の感知に適する。", 0]], "z": "二点識別閾の目安は 指尖2〜3mm、口唇数mm、手掌約10mm、背部40〜70mm。大脳皮質の体性感覚野でも、手指と口唇の領域が広く割り当てられている。"}, {"id": "s3-8", "set": 3, "n": 8, "c": "反射", "t": "反射と随意運動・伸張反射とγ運動ニューロン", "p": "p.59〜62※", "r": "", "s": "伸張反射について誤っているのはどれか。", "neg": true, "two": false, "o": [["単シナプス反射である", "正しい。筋紡錘からのⅠa群線維が、脊髄前角のα運動ニューロンに直接シナプスする。", 0], ["受容器は筋紡錘である", "正しい。筋の伸張を筋紡錘が感知し、伸張された筋自身（同名筋）を収縮させる。", 0], ["拮抗筋は相反抑制を受ける", "正しい。Ⅰa群線維の側枝がⅠa抑制性介在ニューロンを介して拮抗筋のα運動ニューロンを抑制する。", 0], ["γ運動ニューロンの活動が低下すると反射は亢進する", "誤り。γ運動ニューロンの活動が高まると錘内筋線維が収縮して筋紡錘の感度が上がり、反射は亢進する。活動が低下すると反射は減弱する。", 1]], "z": "反射弓は 受容器 → 求心路 → 反射中枢 → 遠心路 → 効果器 の5要素からなる。腱反射は上位運動ニューロン障害（錐体路障害）で亢進し、末梢神経・下位運動ニューロン障害で減弱・消失する。"}, {"id": "s3-9", "set": 3, "n": 9, "c": "反射", "t": "反射と随意運動・運動野と大脳基底核", "p": "p.64〜67※", "r": "", "s": "随意運動の中枢について正しいのはどれか。", "neg": false, "two": false, "o": [["一次運動野は中心前回にある", "正しい。一次運動野は前頭葉の中心前回（ブロードマン4野）にあり、錐体路の主な起始となる。", 1], ["大脳基底核の障害では企図振戦がみられる", "誤り。企図振戦は小脳障害でみられる。大脳基底核の障害では安静時振戦（パーキンソン病）や舞踏運動などがみられる。", 0], ["一次運動野では下肢の領域が外側下部にある", "誤り。下肢の領域は内側（大脳縦裂寄りの上部）にある。外側下部にあるのは顔面・口の領域で、手と顔の領域が広く割り当てられている。", 0], ["運動前野は視覚などの外部の手がかりで誘導される運動には関与しない", "誤り。運動前野は外部の感覚情報（特に視覚）で誘導される運動の準備に関与する。内発的に開始する運動の準備に関与するのが補足運動野。", 0]], "z": "一次運動野＝実行の指令、運動前野＝外部の手がかりによる運動の準備、補足運動野＝自発的な運動の準備と順序づけ。小脳と大脳基底核は運動を調節する系で、振戦の型（小脳＝企図振戦、基底核＝安静時振戦）で区別できる。"}, {"id": "s3-10", "set": 3, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・肩甲骨の運動と筋", "p": "p.73〜78※", "r": "", "s": "肩甲骨の運動と筋の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["下制 ―――― 肩甲挙筋", "誤った組合せ。肩甲挙筋は肩甲骨を挙上・下方回旋させる。下制に働くのは僧帽筋下部線維・小胸筋・鎖骨下筋。", 0], ["上方回旋 ―――― 前鋸筋", "正しい組合せ。前鋸筋は肩甲骨を外転・上方回旋させ、僧帽筋の上部・下部線維とともに上肢挙上時の上方回旋を担う。", 1], ["下方回旋 ―――― 僧帽筋上部線維", "誤った組合せ。僧帽筋上部線維は肩甲骨を挙上・上方回旋させる。", 0], ["外転 ―――― 菱形筋", "誤った組合せ。菱形筋は肩甲骨を内転・挙上・下方回旋させる。外転に働くのは前鋸筋と小胸筋。", 0]], "z": "挙上＝僧帽筋上部・肩甲挙筋・菱形筋、下制＝僧帽筋下部・小胸筋・鎖骨下筋、外転＝前鋸筋・小胸筋、内転＝僧帽筋中部・菱形筋、上方回旋＝僧帽筋上部・下部・前鋸筋、下方回旋＝菱形筋・肩甲挙筋・小胸筋。前鋸筋麻痺（長胸神経）で翼状肩甲となる。"}, {"id": "s3-11", "set": 3, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・肩関節外転の筋", "p": "p.78〜82※", "r": "", "s": "肩関節の外転に作用しないのはどれか。", "neg": true, "two": false, "o": [["三角筋中部線維", "作用する。外転の主動作筋である。", 0], ["上腕二頭筋長頭", "作用する。上腕二頭筋長頭は肩関節外旋位で外転を補助する。", 0], ["棘上筋", "作用する。棘上筋は外転の初期から働き、上腕骨頭を関節窩に引きつけて三角筋の働きを助ける。", 0], ["大円筋", "作用しない。大円筋は小結節稜に停止し、肩関節の伸展・内転・内旋に働く。", 1]], "z": "外転＝三角筋中部・棘上筋（＋上腕二頭筋長頭）、内転＝大胸筋・広背筋・大円筋・烏口腕筋、屈曲＝三角筋前部・大胸筋鎖骨部・烏口腕筋・上腕二頭筋、伸展＝三角筋後部・広背筋・大円筋・上腕三頭筋長頭。大円筋は「広背筋の小さな助手」で、作用が広背筋とほぼ同じである。"}, {"id": "s3-12", "set": 3, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・肘の運搬角", "p": "p.87〜89※", "r": "", "s": "肘の運搬角（肘角）について正しいのはどれか。", "neg": false, "two": false, "o": [["男性のほうが女性より大きい", "誤り。運搬角は女性のほうが大きい（男性約10度、女性約15度が目安）。", 0], ["肘関節を屈曲すると運搬角は増大する", "誤り。肘を屈曲していくと前腕は上腕に重なり、運搬角は減少して消失する。", 0], ["20度を超えるものを内反肘という", "誤り。運搬角が正常より大きいものを外反肘、減少・消失して前腕が内側へ向くものを内反肘という。", 0], ["肘関節伸展・前腕回外位で計測する", "正しい。上腕軸と前腕軸のなす角を、肘伸展・前腕回外位（解剖学的肢位）で計測する。", 1]], "z": "内反肘は小児の上腕骨顆上骨折後の変形として最も多い。外反肘は上腕骨外側顆骨折の偽関節などで生じ、尺骨神経が伸張されて遅発性尺骨神経麻痺の原因となる。"}, {"id": "s3-13", "set": 3, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・手関節の可動域", "p": "p.98〜103※", "r": "", "s": "手関節の運動と参考可動域の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["背屈 ―――― 90度", "誤った組合せ。背屈（伸展）の参考可動域は70度である。", 0], ["橈屈 ―――― 55度", "誤った組合せ。橈屈の参考可動域は25度である。55度は尺屈の値。", 0], ["掌屈 ―――― 90度", "正しい組合せ。手関節の掌屈（屈曲）の参考可動域は90度である。", 1], ["尺屈 ―――― 25度", "誤った組合せ。尺屈の参考可動域は55度である。25度は橈屈の値。", 0]], "z": "掌屈90度＞背屈70度、尺屈55度＞橈屈25度。橈骨茎状突起が尺骨茎状突起より遠位へ長く伸びるため橈屈が制限される。主動作筋は 掌屈＝橈側・尺側手根屈筋と長掌筋、背屈＝長・短橈側手根伸筋と尺側手根伸筋、橈屈＝橈側の屈筋と伸筋、尺屈＝尺側の屈筋と伸筋。"}, {"id": "s3-14", "set": 3, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・把握の型", "p": "p.113〜118※", "r": "", "s": "手の把握について正しいのはどれか。", "neg": false, "two": false, "o": [["鍵をつまんで回す動作は側腹つまみである", "正しい。母指の指腹と示指の橈側面でつまむ型で、横つまみ・鍵つまみとも呼ばれる。", 1], ["指尖つまみは母指と示指の指腹を合わせる型である", "誤り。指尖つまみは母指と示指の指先（爪先）を合わせる型で、針など小さな物をつまむ。指腹を合わせるのは指腹つまみ。", 0], ["ボールを握る動作は精密把握に分類される", "誤り。ボールを手全体で握る球握りは、握力把握に分類される。", 0], ["鉤握りでは母指が主に働く", "誤り。鉤握り（フック握り）は母指を使わず、示指〜小指の屈曲だけで物を引っかけて保持する。かばんを提げる動作が例。", 0]], "z": "握力把握＝円筒握り・球握り・鉤握りなど（手掌全体で力を出す）、精密把握＝指尖つまみ・指腹つまみ・側腹つまみなど（母指と他指の指先で調節する）。精密把握には母指の対立運動が欠かせない。"}, {"id": "s3-15", "set": 3, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・下肢アライメント", "p": "p.126〜129※", "r": "", "s": "下肢のアライメントについて正しいのはどれか。", "neg": false, "two": false, "o": [["Q角は上前腸骨棘と膝蓋骨中心を結ぶ線と、脛骨粗面と大腿骨内側顆を結ぶ線のなす角である", "誤り。Q角は「上前腸骨棘と膝蓋骨中心を結ぶ線」と「膝蓋骨中心と脛骨粗面を結ぶ線」のなす角である。", 0], ["Q角の正常値は約30度である", "誤り。Q角の正常値は約15度前後で、20度を超えると異常とされる。", 0], ["Q角が大きいと膝蓋骨は内方へ偏位しやすい", "誤り。Q角が大きいほど大腿四頭筋の収縮で膝蓋骨が外方へ引かれ、膝蓋骨の外側脱臼・亜脱臼が起こりやすい。", 0], ["Q角は女性のほうが男性より大きい", "正しい。女性は骨盤の幅が広いため、上前腸骨棘が外側に位置しQ角が大きくなる。", 1]], "z": "大腿骨の頸体角は約125度、前捻角は成人で約15度、大腿脛骨角（FTA）は約176度で膝は生理的に軽度外反している。膝蓋骨の外方偏位は内側広筋（特に斜頭）が制動する。"}, {"id": "s3-16", "set": 3, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・体幹の筋", "p": "p.152〜158※", "r": "", "s": "体幹の筋について誤っているのはどれか。", "neg": true, "two": false, "o": [["腰方形筋は体幹の側屈に働く", "正しい。腰方形筋は片側が働くと体幹を同側へ側屈させ、骨盤を引き上げる。", 0], ["腹直筋は体幹の屈曲に働く", "正しい。腹直筋は体幹屈曲の主動作筋で、骨盤の後傾にも働く。", 0], ["腹横筋は体幹伸展の主動作筋である", "誤り。腹横筋は腹壁を締めて腹圧を高める筋で、体幹の運動にはほとんど関与しない。体幹伸展の主動作筋は脊柱起立筋。", 1], ["外腹斜筋は体幹を対側へ回旋させる", "正しい。右の外腹斜筋は体幹を左へ回旋させる。同側へ回旋させるのは内腹斜筋。", 0]], "z": "体幹右回旋＝右内腹斜筋＋左外腹斜筋。側屈＝腰方形筋・内外腹斜筋・脊柱起立筋（同側）。腹横筋・横隔膜・骨盤底筋・多裂筋は腹腔を囲んで腹圧を高め、体幹の安定化に働く。"}, {"id": "s3-17", "set": 3, "n": 17, "c": "姿勢", "t": "姿勢・不良姿勢", "p": "p.182〜183※", "r": "", "s": "不良姿勢と特徴の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["凹背 ―――― 胸椎後弯の増強", "誤った組合せ。凹背は腰椎前弯が増強した姿勢で、骨盤の前傾を伴う。", 0], ["凹円背 ―――― 胸椎後弯と腰椎前弯の増強", "正しい組合せ。凹円背は胸椎後弯と腰椎前弯がともに増強した姿勢である。", 1], ["円背 ―――― 胸椎後弯の減少", "誤った組合せ。円背は胸椎後弯が増強した姿勢で、高齢者の脊椎椎体骨折後などにみられる。", 0], ["平背 ―――― 腰椎前弯の増強", "誤った組合せ。平背は胸椎後弯・腰椎前弯がともに減少し、脊柱が平らになった姿勢である。", 0]], "z": "整理（シュタッフェルの分類）：正常、円背＝胸椎後弯↑、凹背＝腰椎前弯↑、凹円背＝両方↑、平背＝両方↓。不良姿勢は腰背部痛や筋の短縮・伸張の原因となる。"}, {"id": "s3-18", "set": 3, "n": 18, "c": "姿勢", "t": "姿勢・座位姿勢と椎間板内圧", "p": "p.184〜185※", "r": "", "s": "第3腰椎椎間板内圧について正しいのはどれか。", "neg": false, "two": false, "o": [["背臥位は立位より高い", "誤り。背臥位は約25で、姿勢のなかで最も低い。", 0], ["立位で前屈して重量物を持つと低下する", "誤り。前屈位で重量物を持つと内圧は大きく上昇し、立位の2倍を超える。腰痛予防では膝を曲げて体幹を立てたまま持ち上げる。", 0], ["背もたれのない座位では立位より高い", "正しい。立位を100とすると、背もたれのない座位は約140となる。座位では骨盤が後傾して腰椎前弯が減り、椎間板の前方に圧がかかる。", 1], ["座位では骨盤が前傾して腰椎前弯が増強する", "誤り。座位では骨盤が後傾し、腰椎前弯は減少する。", 0]], "z": "ナッケムソンの測定（立位＝100）では、背臥位約25＜側臥位＜立位100＜座位140＜前屈立位150＜前屈座位185。座位・前屈・重量物保持の3つが重なるほど内圧は高くなる。"}, {"id": "s3-19", "set": 3, "n": 19, "c": "歩行", "t": "歩行・歩行周期の名称", "p": "p.190〜192※", "r": "", "s": "歩行周期の名称について正しいのはどれか。", "neg": false, "two": false, "o": [["初期接地は従来の踵接地にあたる", "正しい。ランチョ・ロス・アミーゴ方式の初期接地（IC）は、足部が床に接した瞬間で、正常歩行では踵接地にあたる。", 1], ["荷重応答期は従来の立脚中期にあたる", "誤り。荷重応答期（LR）は初期接地から対側足趾離地までで、従来の足底接地にあたる。", 0], ["立脚終期は従来の足趾離地にあたる", "誤り。立脚終期（TSt）は踵が床から離れる時期で、従来の踵離地にあたる。足趾離地は前遊脚期の終わりである。", 0], ["遊脚初期は前遊脚期より先に来る", "誤り。前遊脚期（PSw）は立脚期の最後の相で、その後に遊脚初期（ISw）が続く。", 0]], "z": "立脚期＝初期接地（0〜2％）→荷重応答期（〜12％）→立脚中期（〜31％）→立脚終期（〜50％）→前遊脚期（〜62％）、遊脚期＝遊脚初期（〜75％）→遊脚中期（〜87％）→遊脚終期（〜100％）。両脚支持期は荷重応答期と前遊脚期の2つにあたる。"}, {"id": "s3-20", "set": 3, "n": 20, "c": "歩行", "t": "歩行・エネルギー消費", "p": "p.202〜204※", "r": "", "s": "歩行のエネルギー消費について正しいのはどれか。", "neg": false, "two": false, "o": [["単位距離あたりのエネルギー消費は毎分約80m前後の速度で最小となる", "正しい。単位距離あたりのエネルギー消費は速度に対してU字型を示し、自由歩行速度に近い毎分約80m前後で最小となる。", 1], ["歩行速度が上がるほど単位距離あたりのエネルギー消費は直線的に減少する", "誤り。至適速度より遅くても速くても、単位距離あたりのエネルギー消費は増加する（U字型）。", 0], ["松葉杖による3点歩行は正常歩行よりエネルギー消費が少ない", "誤り。上肢で体重を支えるため、正常歩行よりエネルギー消費は大きく増加する。", 0], ["重心の上下動を大きくすると歩行の効率は向上する", "誤り。重心の上下動・側方移動が大きいほどエネルギー消費は増える。歩行の決定因子は重心の移動を小さくして効率を高める仕組みである。", 0]], "z": "単位時間あたりのエネルギー消費は速度とともに増え続けるが、単位距離あたりではU字型になる。人は無意識に最も効率のよい速度で歩いており、異常歩行や補助具の使用はこの効率を下げる。"}, {"id": "s3-21", "set": 3, "n": 21, "c": "歩行", "t": "歩行・歩行の発達", "p": "p.204〜206※", "r": "", "s": "歩き始めの幼児の歩行について正しいのはどれか。", "neg": false, "two": false, "o": [["踵接地がはっきりみられる", "誤り。歩き始めは足底全体または前足部で接地し、踵接地は2歳頃から明らかになる。", 0], ["歩隔が広い", "正しい。平衡機能が未熟なため、支持基底面を広げて側方の安定性を得ている（ワイドベース）。", 1], ["上肢を低い位置に保って振る", "誤り。歩き始めは上肢を肩の高さ付近に挙げた位置（ハイガード）に保ち、交互の腕振りはみられない。", 0], ["1歳半頃に成人とほぼ同じ歩行パターンが完成する", "誤り。上肢の交互の振りや踵からの接地は2〜3歳ころに現れ、成人型歩行となるのは6歳である。", 0]], "z": "幼児の歩行は 歩隔が広い・歩幅が小さい・歩行率が高い・両脚支持期が長い・ハイガード・踵接地なし が特徴。成長とともに歩隔が狭まり、交互の腕振りと踵接地が現れる。"}, {"id": "s3-22", "set": 3, "n": 22, "c": "歩行", "t": "歩行・杖歩行", "p": "p.208〜209※", "r": "", "s": "杖歩行について誤っているのはどれか。", "neg": true, "two": false, "o": [["3動作歩行は杖 → 患側下肢 → 健側下肢の順に出す", "正しい。常に2点以上で支持するため安定性が高い。", 0], ["T字杖は患側と反対側の手で持つ", "正しい。健側の手で持つことで、患側下肢と杖が同時に接地して体重を分散できる。", 0], ["2動作歩行は3動作歩行より安定性が高い", "誤り。2動作歩行（杖と患側を同時に出す → 健側）は速いが、支持点が少ない時期があるため安定性は3動作歩行より低い。", 1], ["杖の長さは大転子の高さを目安とする", "正しい。立位で大転子の高さ、または足先から前外側15cmの点に杖をついて肘が約30度屈曲する長さとする。", 0]], "z": "3動作歩行は遅いが安定、2動作歩行は速いが安定性で劣る。健側の出し方で「後型（患側より後ろ）」「揃え型」「前型（患側より前）」に分かれ、前型ほど実用的な歩行に近い。"}, {"id": "s3-23", "set": 3, "n": 23, "c": "歩行", "t": "歩行・階段昇降", "p": "p.209〜210※", "r": "", "s": "階段昇降について正しいのはどれか。", "neg": false, "two": false, "o": [["降段時の大腿四頭筋は主として求心性に収縮する", "誤り。降段時の大腿四頭筋は、膝が屈曲していくのを制御するため遠心性に収縮する。", 0], ["片麻痺者の昇段は健側下肢から行う", "正しい。昇段では健側を上の段に乗せ、健側の筋力で身体を引き上げてから患側をそろえる。", 1], ["片麻痺者の降段は健側下肢から行う", "誤り。降段は患側下肢から下ろし、健側で体重を支えながら遠心性に制御する。", 0], ["昇段時の膝関節最大屈曲角度は平地歩行より小さい", "誤り。段差をまたぐため、昇段時の膝の最大屈曲は平地歩行（約60度）より大きく、約90度前後に達する。", 0]], "z": "「上りは健側から、下りは患側から」。杖を使う場合、昇段は 杖 → 健側 → 患側、降段は 杖 → 患側 → 健側 の順となる。降段は遠心性収縮が主体となるため、大腿四頭筋の筋力低下や膝痛があると降段のほうが難しい。"}, {"id": "s3-24", "set": 3, "n": 24, "c": "発達学習", "t": "運動発達・把握動作の発達", "p": "p.220〜222※", "r": "", "s": "把握動作の発達について正しいのはどれか。", "neg": false, "two": false, "o": [["手掌把握反射は生後10か月頃まで残存する", "誤り。手掌把握反射は生後4〜6か月頃に消失し、随意的な把握に置き換わる。", 0], ["両手間での物の持ち替えは生後3か月頃に可能となる", "誤り。目的物をつかんで手から手へ持ちかえるのは生後6か月ころで、8〜9か月で円滑になる。", 0], ["尺側での握りは橈側での握りより遅れて出現する", "誤り。把握は手掌の尺側から始まり、発達とともに橈側（母指側）へ移る。", 0], ["母指と示指の指尖でつまむ動作は生後10〜12か月頃に可能となる", "正しい。母指と示指の先端で小さな物をつまむ指尖つまみ（ピンセットつまみ）は、把握発達の最終段階である。", 1]], "z": "把握反射（〜4か月）→ 尺側手掌握り（5か月）→ 手掌握り（6か月）→ 橈側手掌握り（7か月）→ 橈側指握り（8〜9か月）→ 指尖つまみ（10〜12か月）。発達の原則（中枢→末梢、粗大→微細）がそのまま手にも当てはまる。"}, {"id": "s3-25", "set": 3, "n": 25, "c": "発達学習", "t": "運動学習・学習の3段階", "p": "p.226〜228※", "r": "", "s": "運動学習の段階について正しいのはどれか。", "neg": false, "two": false, "o": [["連合段階では課題の理解が学習の中心となる", "誤り。課題の理解が中心となるのは認知段階である。連合段階では誤りを修正しながら動作を洗練していく。", 0], ["自動化段階では注意をほかの課題に向けながら動作を遂行できる", "正しい。動作がほとんど意識せずに行えるようになり、会話しながらでも遂行できる（二重課題が可能）。", 1], ["自動化段階では外在的フィードバックを頻繁に与える必要がある", "誤り。自動化段階では内在的フィードバックで自ら修正できるため、外在的フィードバックは減らしていく。", 0], ["認知段階では誤りが少なく動作が安定している", "誤り。認知段階は何をどうするかを理解する段階で、誤りが多く動作のばらつきが大きい。", 0]], "z": "整理（フィッツの3段階）：認知段階＝理解・言語化が中心で誤りが多い、連合段階＝誤りが減り動作が洗練される、自動化段階＝意識せずに安定して遂行できる。段階が進むほど外在的フィードバックを減らす。※ 教科書ページは推定。"}, {"id": "s4-1", "set": 4, "n": 1, "c": "総論", "t": "運動学総論・重心の求め方", "p": "p.13〜16※", "r": "", "s": "物体の重心について正しいのはどれか。", "neg": false, "two": false, "o": [["複数の体節の合成重心は各体節の重心位置の単純平均で求める", "誤り。合成重心は各体節の質量で重みづけして求める。重い体節ほど合成重心を自分の側へ引き寄せる。", 0], ["物体を異なる2点で吊るしたとき、それぞれの鉛直線の交点が重心である", "正しい。吊るした物体は重心が支点の真下に来て静止するため、2本の鉛直線の交点が重心となる（吊り下げ法）。", 1], ["地球上では重心と質量中心は大きく異なる位置にある", "誤り。重力が一様とみなせる地球上では、重心と質量中心はほぼ一致する。", 0], ["重心は常に物体の内部にある", "誤り。リングや大きく屈曲した体幹のように、重心が物体の外部に位置することもある。走り高跳びの背面跳びでは、重心がバーの下を通ることがある。", 0]], "z": "身体重心の求め方には、吊り下げ法のほか、体重計を使う方法（てこの原理）や、各体節の重心と質量比から計算する方法（合成法）がある。上肢を挙げる・体幹を曲げるなど姿勢が変われば重心の位置も変わる。"}, {"id": "s4-2", "set": 4, "n": 2, "c": "総論", "t": "運動学総論・摩擦", "p": "p.18〜19※", "r": "", "s": "摩擦について正しいのはどれか。", "neg": false, "two": false, "o": [["摩擦力は接触面の面積に比例する", "誤り。摩擦力は垂直抗力（面を押しつける力）に比例し、接触面の面積にはほとんど依存しない。", 0], ["摩擦係数が大きい床ほど滑りやすい", "誤り。摩擦係数が大きいほど摩擦力が大きくなり、滑りにくい。", 0], ["摩擦力は物体の運動の方向と同じ向きに働く", "誤り。摩擦力は運動（または動こうとする向き）と反対の向きに働く。", 0], ["最大静止摩擦力は動摩擦力より大きい", "正しい。動き出す瞬間の摩擦（最大静止摩擦力）は、動いているときの摩擦（動摩擦力）より大きい。重い物は動き出すまでが最も重く感じる。", 1]], "z": "摩擦力＝摩擦係数×垂直抗力。歩行の踏み出しや制動には床との摩擦が欠かせず、濡れた床では摩擦係数が下がって転倒しやすくなる。関節軟骨と滑液の摩擦係数はきわめて小さい。"}, {"id": "s4-3", "set": 4, "n": 3, "c": "総論", "t": "運動学総論・仕事（計算）", "p": "p.18〜20※", "r": "", "s": "体重60kgの人が高さ20cmの台に10回昇った。身体を持ち上げるのに要した仕事はどれか。ただし、重力加速度は10m/s²とする。", "neg": false, "two": false, "o": [["120J", "誤り。1回分の仕事（600N×0.2m＝120J）である。10回分を掛けていない。", 0], ["1,200J", "正しい。体重による力は 60kg×10m/s²＝600N。1回の仕事は 600N×0.2m＝120J、10回で 1,200J となる。", 1], ["2,400J", "誤り。昇りと降りの両方を足した値である。設問は昇る（持ち上げる）仕事のみを問うている。", 0], ["12,000J", "誤り。20cmを2mとして計算するなど、単位換算を誤ると出る値である。", 0]], "z": "仕事（J）＝力（N）×力の向きへの移動距離（m）。仕事率（W）＝仕事÷時間で、同じ10回でも速く昇るほど仕事率は大きくなる。この例を20秒で行えば 1,200J÷20秒＝60W。"}, {"id": "s4-4", "set": 4, "n": 4, "c": "運動器", "t": "運動器の構造と機能・関節の副運動", "p": "p.31〜32※", "r": "", "s": "関節運動の凹凸の法則について正しいのはどれか。", "neg": false, "two": false, "o": [["凸の関節面が動くとき、転がりと滑りは逆方向に起こる", "正しい。凸面が凹面上を転がると、そのままでは脱臼してしまうため、骨頭は転がりと逆方向へ滑って関節面にとどまる。", 1], ["肩関節外転では上腕骨頭は関節窩上を上方へ滑る", "誤り。凸面の上腕骨頭が上方へ転がるため、骨頭は下方へ滑る。この下方への滑りが不足すると肩峰下でインピンジメントが生じる。", 0], ["関節の副運動は随意的に単独で行うことができる", "誤り。副運動（滑り・転がり・軸回旋など）は、随意的に単独では行えず、他動的に生じさせることができる運動である。", 0], ["凹の関節面が動くとき、転がりと滑りは逆方向に起こる", "誤り。凹面が動くときは、転がりと滑りは同じ方向に起こる。", 0]], "z": "凸の骨が動く＝転がりと滑りが逆方向（肩外転で骨頭は下方へ滑る）、凹の骨が動く＝同方向（膝の開放運動連鎖での伸展では脛骨が前方へ滑る）。関節モビライゼーションはこの法則に基づいて滑りの方向を決める。"}, {"id": "s4-5", "set": 4, "n": 5, "c": "運動器", "t": "運動器の構造と機能・力‑速度関係", "p": "p.37〜39※", "r": "", "s": "筋の力‑速度関係について正しいのはどれか。", "neg": false, "two": false, "o": [["遠心性収縮では伸張速度が速いほど張力は低下する", "誤り。遠心性収縮では、伸張速度が速くなるほど張力は増加する（ある範囲まで）。", 0], ["短縮速度がゼロのとき張力はゼロとなる", "誤り。短縮速度ゼロは等尺性収縮にあたり、求心性収縮の範囲で張力は最大となる。張力がゼロになるのは最大短縮速度のとき。", 0], ["筋パワーは最大短縮速度の約3分の1の速度で最大となる", "正しい。パワー＝力×速度で、力も速度も最大値の約3分の1付近のとき積が最大となる。", 1], ["速筋線維は遅筋線維より最大短縮速度が遅い", "誤り。速筋線維はミオシンATPアーゼの活性が高く、最大短縮速度が速い。", 0]], "z": "求心性収縮では速いほど力が小さく、遠心性収縮では速いほど力が大きい。発揮できる張力は 遠心性＞等尺性＞求心性 の順。パワー向上のトレーニングは最大筋力の30〜60％程度の負荷で行われることが多い。"}, {"id": "s4-6", "set": 4, "n": 6, "c": "感覚", "t": "運動感覚・求心性線維の分類", "p": "p.53〜56※", "r": "", "s": "求心性神経線維と受容器の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅰb群線維 ―――― 筋紡錘の二次終末", "誤った組合せ。Ⅰb群線維は腱器官（ゴルジ腱器官）からの求心性線維である。", 0], ["Ⅰa群線維 ―――― 筋紡錘の一次終末", "正しい組合せ。一次終末（らせん終末）はⅠa群線維を出し、伸張反射の求心路となる。", 1], ["Ⅱ群線維 ―――― 腱器官", "誤った組合せ。Ⅱ群線維は筋紡錘の二次終末（散形終末）から出る。皮膚の触圧覚の受容器からもⅡ群（Aβ）線維が出る。", 0], ["Ⅳ群線維 ―――― 関節の位置覚", "誤った組合せ。Ⅳ群線維（C線維）は無髄線維で、鈍い痛みや温度覚を伝える。位置覚を伝えるのは太い有髄線維。", 0]], "z": "線維が太いほど伝導速度が速い。Ⅰa・Ⅰb（Aα）＞Ⅱ（Aβ）＞Ⅲ（Aδ：鋭い痛み・冷覚）＞Ⅳ（C：鈍い痛み・温覚）。筋紡錘＝Ⅰa・Ⅱ、腱器官＝Ⅰb と、受容器ごとの線維を整理しておく。"}, {"id": "s4-7", "set": 4, "n": 7, "c": "感覚", "t": "運動感覚・深部感覚の種類", "p": "p.56〜58※", "r": "", "s": "深部感覚に含まれないのはどれか。", "neg": true, "two": false, "o": [["運動覚", "含まれる。関節が動いていること、その方向を感じる感覚である。", 0], ["振動覚", "含まれる。音叉の振動を骨の上で感じる感覚で、深部感覚として扱われる。", 0], ["位置覚", "含まれる。目を閉じていても関節の角度（肢位）がわかる感覚で、深部感覚の代表である。", 0], ["二点識別覚", "含まれない。二点識別覚は、皮膚の触覚情報を大脳皮質で統合して判断する複合感覚（識別覚）である。", 1]], "z": "表在感覚＝触覚・圧覚・痛覚・温度覚、深部感覚＝位置覚・運動覚・振動覚・深部痛覚、複合感覚＝二点識別覚・立体覚・皮膚書字覚。複合感覚は頭頂葉の障害で低下する。"}, {"id": "s4-8", "set": 4, "n": 8, "c": "反射", "t": "反射と随意運動・相反神経支配", "p": "p.60〜63※", "r": "", "s": "相反神経支配について正しいのはどれか。", "neg": false, "two": false, "o": [["伸張反射の際、拮抗筋はⅠa抑制性介在ニューロンを介して抑制される", "正しい。Ⅰa群線維の側枝が抑制性介在ニューロンを興奮させ、拮抗筋のα運動ニューロンを抑制する（Ⅰa抑制・相反抑制）。", 1], ["相反抑制は単シナプス性の経路で起こる", "誤り。相反抑制は抑制性介在ニューロンを1つはさむ二シナプス性の経路である。単シナプス性なのは同名筋への興奮。", 0], ["屈筋逃避反射では刺激側の伸筋が収縮する", "誤り。刺激側では屈筋が収縮し伸筋は抑制される。対側では伸筋が収縮して体重を支える（交差性伸展反射）。", 0], ["関節を固定するとき主動作筋と拮抗筋が同時に収縮することはない", "誤り。関節を安定させたいときには、上位中枢の働きで相反抑制が弱まり、主動作筋と拮抗筋が同時に収縮する（同時収縮）。", 0]], "z": "Ⅰa抑制＝筋紡錘から拮抗筋を抑制（相反抑制）、Ⅰb抑制＝腱器官から同名筋を抑制（自原抑制）。ストレッチ前に拮抗筋を収縮させて対象筋を緩める方法は相反抑制を利用している。"}, {"id": "s4-9", "set": 4, "n": 9, "c": "反射", "t": "反射と随意運動・大脳基底核", "p": "p.65〜67※", "r": "", "s": "大脳基底核に含まれないのはどれか。", "neg": true, "two": false, "o": [["視床下核", "含まれる。障害されると対側の上下肢を投げ出すような不随意運動（片側バリズム）が生じる。", 0], ["淡蒼球", "含まれる。大脳基底核の主な出力部の一つで、視床を介して大脳皮質へ出力する。", 0], ["歯状核", "含まれない。歯状核は小脳核の一つで、新小脳からの出力を視床へ送る。", 1], ["線条体", "含まれる。尾状核と被殻からなり、大脳皮質からの入力を受ける大脳基底核の入力部である。", 0]], "z": "大脳基底核＝線条体（尾状核・被殻）・淡蒼球・視床下核・黒質。黒質のドパミン神経の変性でパーキンソン病（安静時振戦・固縮・無動）、尾状核の変性でハンチントン病（舞踏運動）が生じる。小脳核は室頂核・球状核・栓状核・歯状核。"}, {"id": "s4-10", "set": 4, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・肩関節伸展の筋", "p": "p.78〜82※", "r": "", "s": "肩関節の伸展に作用しないのはどれか。", "neg": true, "two": false, "o": [["烏口腕筋", "作用しない。烏口腕筋は上腕を前内方へ引き、屈曲・内転・水平屈曲に働く。", 1], ["広背筋", "作用する。広背筋は伸展・内転・内旋に働き、体幹を引き上げる懸垂動作の主動作筋である。", 0], ["大円筋", "作用する。広背筋とともに伸展・内転・内旋に働く。", 0], ["三角筋後部線維", "作用する。三角筋後部線維は伸展と水平伸展・外旋に働く。", 0]], "z": "伸展＝広背筋・大円筋・三角筋後部・上腕三頭筋長頭、屈曲＝三角筋前部・大胸筋鎖骨部・烏口腕筋・上腕二頭筋、水平屈曲＝大胸筋・三角筋前部・烏口腕筋・肩甲下筋、水平伸展＝三角筋後部・棘下筋・小円筋・広背筋・大円筋。"}, {"id": "s4-11", "set": 4, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・肘関節屈曲の筋と神経", "p": "p.87〜92※", "r": "", "s": "肘関節の屈曲に作用する筋と支配神経の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["上腕筋 ―――― 筋皮神経", "正しい組合せ。上腕筋は主に筋皮神経に支配され（外側部は橈骨神経の枝を受けることがある）、前腕の肢位にかかわらず肘を屈曲する。", 1], ["腕橈骨筋 ―――― 正中神経", "誤った組合せ。腕橈骨筋は橈骨神経に支配される。前腕中間位で屈曲力が最も強い。", 0], ["上腕二頭筋 ―――― 橈骨神経", "誤った組合せ。上腕二頭筋は筋皮神経に支配され、前腕回外位で屈曲力が最大となる。", 0], ["円回内筋 ―――― 尺骨神経", "誤った組合せ。円回内筋は正中神経に支配され、前腕回内と肘屈曲の補助に働く。", 0]], "z": "肘屈曲＝上腕二頭筋（回外位で最強）・上腕筋（肢位を選ばない）・腕橈骨筋（中間位で最強）・円回内筋。肘伸展＝上腕三頭筋・肘筋（いずれも橈骨神経）。筋皮神経麻痺でも腕橈骨筋が残るため、肘の屈曲は弱いながら可能である。"}, {"id": "s4-12", "set": 4, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・手指の筋", "p": "p.106〜113※", "r": "", "s": "手指の筋について正しいのはどれか。", "neg": false, "two": false, "o": [["総指伸筋は主にDIP関節を伸展する", "誤り。総指伸筋の主な作用はMP関節の伸展である。PIP・DIP関節の伸展は、指背腱膜を介して虫様筋・骨間筋と協同して行う。", 0], ["小指外転筋は正中神経に支配される", "誤り。小指外転筋は尺骨神経に支配される。小指球筋はすべて尺骨神経支配。", 0], ["手指の内転は背側骨間筋が行う", "誤り。手指の内転は掌側骨間筋が行う。背側骨間筋は外転に働く。", 0], ["深指屈筋はDIP関節を屈曲できる唯一の筋である", "正しい。深指屈筋は末節骨底に停止し、DIP関節を屈曲できるのはこの筋だけである。", 1]], "z": "深指屈筋＝DIP屈曲（唯一）、浅指屈筋＝PIP屈曲、総指伸筋＝MP伸展、虫様筋・骨間筋＝MP屈曲・IP伸展。背側骨間筋＝外転（DAB）、掌側骨間筋＝内転（PAD）。突き指などで深指屈筋腱が断裂すると、DIP関節だけが屈曲できなくなる。"}, {"id": "s4-13", "set": 4, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・骨盤の運動", "p": "p.118〜120※", "r": "", "s": "骨盤の前傾について正しいのはどれか。", "neg": false, "two": false, "o": [["ハムストリングスの短縮によって生じる", "誤り。ハムストリングスは坐骨結節を引き下げ、骨盤を後傾させる。短縮すると骨盤後傾・腰椎前弯の減少につながる。", 0], ["腹直筋の収縮によって生じる", "誤り。腹直筋は恥骨を引き上げて骨盤を後傾させる。", 0], ["腰椎の前弯の増強を伴う", "正しい。骨盤が前傾すると仙骨上面の傾きが増し、腰椎の前弯が増強する。", 1], ["股関節の伸展を伴う", "誤り。立位で骨盤が前傾すると、大腿骨に対して骨盤が前へ倒れるため股関節は屈曲位となる。", 0]], "z": "前傾＝腸腰筋・脊柱起立筋・大腿直筋（骨盤前面を下げ、後面を上げる）、後傾＝腹直筋・大殿筋・ハムストリングス。腸腰筋が短縮すると骨盤前傾・腰椎前弯の増強（凹背）を招く。"}, {"id": "s4-14", "set": 4, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節屈曲の筋", "p": "p.120〜125※", "r": "", "s": "股関節の屈曲に作用しないのはどれか。", "neg": true, "two": false, "o": [["腸腰筋", "作用する。股関節屈曲の主動作筋である。", 0], ["縫工筋", "作用する。縫工筋は股関節の屈曲・外転・外旋と膝関節の屈曲に働く（あぐらをかく動作）。", 0], ["大腿筋膜張筋", "作用する。大腿筋膜張筋は股関節の屈曲・外転の主動作筋である（膝関節では伸展にはたらく）。", 0], ["大腿二頭筋長頭", "作用しない。大腿二頭筋長頭はハムストリングスの一つで、股関節の伸展と膝関節の屈曲に働く。", 1]], "z": "教科書の表8-11では、屈曲の主動作筋は腸腰筋・大腿直筋・恥骨筋・大腿筋膜張筋で、縫工筋・中殿筋・小殿筋・薄筋・長内転筋・短内転筋・大内転筋が補助する。伸展は大殿筋・大腿二頭筋・半腱様筋・半膜様筋が主で、中殿筋・小殿筋が補助する。大腿二頭筋短頭は股関節をまたがないため、股関節には作用しない。"}, {"id": "s4-15", "set": 4, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・距骨下関節と足部", "p": "p.136〜142※", "r": "", "s": "足部の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["前脛骨筋は足部の外がえしに働く", "誤り。前脛骨筋は背屈と内がえしに働く。", 0], ["長腓骨筋は足部の内がえしに働く", "誤り。長腓骨筋は外果の後方を通り、外がえしと底屈に働く。", 0], ["後脛骨筋は足部の内がえしに働く", "正しい。後脛骨筋は内果の後方を通り、舟状骨・楔状骨に停止して内がえしと底屈に働く。", 1], ["距骨下関節は距骨と脛骨の間の関節である", "誤り。距骨下関節は距骨と踵骨の間の関節である。距骨と脛骨・腓骨の間は距腿関節。", 0]], "z": "内がえし＝後脛骨筋・前脛骨筋・長母趾屈筋・長趾屈筋（内果側を通る筋）、外がえし＝長・短腓骨筋・第3腓骨筋・長趾伸筋（外果側を通る筋）。足関節捻挫は内がえし強制による前距腓靱帯の損傷が最も多い。"}, {"id": "s4-16", "set": 4, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・胸郭と呼吸運動", "p": "p.164〜168※", "r": "", "s": "胸郭の呼吸運動について正しいのはどれか。", "neg": false, "two": false, "o": [["下位肋骨の挙上は主に胸郭の前後径を増す", "誤り。下位肋骨はバケツの柄のように外側が持ち上がり、主に胸郭の横径を増す。", 0], ["吸気時に横隔膜の腱中心は上昇する", "誤り。吸気時に横隔膜が収縮すると腱中心は下降し、胸腔の上下径が増す。", 0], ["胸鎖乳突筋は呼気補助筋である", "誤り。胸鎖乳突筋は胸骨と鎖骨を引き上げる吸気補助筋である。", 0], ["上位肋骨の挙上は主に胸郭の前後径を増す", "正しい。上位肋骨はポンプの柄のように前方が持ち上がり、胸骨を前上方へ押し出して前後径を増す。", 1]], "z": "吸気補助筋＝胸鎖乳突筋・斜角筋・大胸筋・小胸筋・僧帽筋など、呼気補助筋＝内肋間筋・腹直筋・内外腹斜筋・腹横筋。上位肋骨＝ポンプの柄（前後径）、下位肋骨＝バケツの柄（横径）。"}, {"id": "s4-17", "set": 4, "n": 17, "c": "姿勢", "t": "姿勢・姿勢の種類", "p": "p.179〜180※", "r": "", "s": "姿勢について正しいのはどれか。", "neg": false, "two": false, "o": [["腹臥位は顔面を上に向けて寝た姿勢である", "誤り。顔面を上に向けて寝た姿勢は背臥位である。腹臥位は腹部を下にして寝た姿勢。", 0], ["長座位は股関節と膝関節をともに屈曲した座位である", "誤り。長座位は股関節を屈曲し、膝関節を伸展して下肢を前方へ投げ出した座位である。", 0], ["解剖学的立位姿勢では前腕は回外位である", "正しい。解剖学的立位姿勢は、基本的立位姿勢から前腕を回外して手掌を前方へ向けた姿勢である。", 1], ["基本的立位姿勢では手掌を前方へ向ける", "誤り。基本的立位姿勢では前腕は中間位で、手掌は体側に向く。手掌を前方へ向けるのは解剖学的立位姿勢。", 0]], "z": "姿勢は「体位（身体が重力の方向とどういう関係にあるか：立位・座位・臥位など）」と「構え（身体各部の相対的な位置関係）」で表される。関節可動域の測定は基本的立位姿勢を0度として行う（前腕は中間位）。"}, {"id": "s4-18", "set": 4, "n": 18, "c": "姿勢", "t": "姿勢・立位の姿勢制御戦略", "p": "p.184〜185※", "r": "", "s": "立位での姿勢制御について正しいのはどれか。", "neg": false, "two": false, "o": [["足関節戦略では近位の筋が遠位の筋より先に活動する", "誤り。足関節戦略では、下腿の筋 → 大腿の筋 → 体幹の筋のように、遠位から近位の順に活動する。", 0], ["股関節戦略は広く安定した支持面の上で用いられる", "誤り。股関節戦略は、狭い支持面の上や外乱が大きいときに、股関節を素早く屈伸させて重心を戻す方法である。", 0], ["ステッピング戦略は外乱が最も小さいときに用いられる", "誤り。ステッピング戦略は、重心が支持基底面の外へ出るほど外乱が大きいときに、足を踏み出して新しい支持基底面をつくる方法である。", 0], ["小さな外乱に対しては足関節戦略が用いられる", "正しい。広い支持面で外乱が小さいときは、足関節を中心に身体全体を一本の棒のように動かして重心を戻す。", 1]], "z": "外乱が小さい順に 足関節戦略 → 股関節戦略 → ステッピング戦略。高齢者は足関節戦略より股関節戦略に頼りやすく、これが転倒リスクと関係するとされる。"}, {"id": "s4-19", "set": 4, "n": 19, "c": "歩行", "t": "歩行・歩行パラメータ（計算）", "p": "p.190〜192※", "r": "", "s": "10mの歩行路を8秒、16歩で歩いた。正しいのはどれか。", "neg": false, "two": false, "o": [["歩行率は毎分60歩である", "誤り。歩行率は 16歩÷8秒×60秒＝毎分120歩である。", 0], ["歩行速度は毎分75mである", "正しい。10m÷8秒＝1.25m/秒、これを60倍して毎分75mとなる。", 1], ["歩幅は約125cmである", "誤り。歩幅は 10m÷16歩＝0.625m、約62.5cmである。125cmは重複歩距離にあたる。", 0], ["重複歩距離は約62.5cmである", "誤り。重複歩距離は歩幅の2倍で、約125cmである。", 0]], "z": "歩行速度＝歩幅×歩行率 で確かめられる（0.625m×毎分120歩＝毎分75m）。歩幅＝一側の踵接地から対側の踵接地まで、重複歩距離＝同側の踵接地から次の同側の踵接地まで。"}, {"id": "s4-20", "set": 4, "n": 20, "c": "歩行", "t": "歩行・関節の運動", "p": "p.196〜199※", "r": "", "s": "正常歩行における関節の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["股関節は踵接地時に約30度屈曲している", "正しい。股関節は踵接地時に約30度屈曲位にあり、その後は立脚期を通じて伸展していく。", 1], ["足関節は足趾離地時に最大背屈となる", "誤り。足趾離地時に足関節は最大底屈（約20度）となる。最大背屈は立脚終期（約10度）にみられる。", 0], ["股関節の最大伸展は遊脚中期に生じる", "誤り。股関節の最大伸展（約10〜20度）は立脚終期に生じる。遊脚期には股関節は屈曲していく。", 0], ["膝関節の最大屈曲は立脚中期に生じる", "誤り。膝関節の最大屈曲（約60度）は遊脚初期に生じる。立脚中期の膝はほぼ伸展位である。", 0]], "z": "股関節＝屈曲・伸展を1回ずつ（最大屈曲約30度・最大伸展約10〜20度）、膝関節＝立脚期の小さな屈曲（約15度）と遊脚期の大きな屈曲（約60度）の2回、足関節＝背屈と底屈を2回ずつ繰り返す。"}, {"id": "s4-21", "set": 4, "n": 21, "c": "歩行", "t": "歩行・床反力と足圧中心", "p": "p.197〜199※", "r": "", "s": "正常歩行の立脚期について正しいのはどれか。", "neg": false, "two": false, "o": [["床反力の左右分力は垂直分力より大きい", "誤り。左右分力は体重の数％程度と最も小さく、垂直分力（最大で体重の110〜120％）に比べてはるかに小さい。", 0], ["足圧中心は踵から母趾の方向へ移動する", "正しい。足圧中心は踵のやや外側から始まり、足底の中央を通って母趾球・母趾へと移動する。", 1], ["足圧中心は足部の内側縁から移動を始める", "誤り。初期接地は踵のやや外側で起こり、足圧中心はそこから移動を始める。", 0], ["床反力の前後分力は立脚後半に後方へ向く", "誤り。前後分力は立脚前半に後方（制動）、立脚後半に前方（駆動）へ向く。", 0]], "z": "床反力の大きさは 垂直分力（二峰性・体重の110〜120％）＞前後分力（前半制動・後半駆動）＞左右分力（数％）。足圧中心の軌跡は、外反母趾や扁平足などの足部の障害で変化する。"}, {"id": "s4-22", "set": 4, "n": 22, "c": "歩行", "t": "歩行・異常歩行", "p": "p.207〜211※", "r": "", "s": "異常歩行と特徴の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["大腿四頭筋麻痺による歩行 ―――― 立脚期に体幹を後方へ傾ける", "誤った組合せ。大腿四頭筋麻痺では、体幹を前傾させて重心線を膝関節軸の前方へ移し、手で大腿前面を押さえて膝折れを防ぐ。", 0], ["はさみ足歩行 ―――― 股関節の外転", "誤った組合せ。はさみ足歩行は股関節内転筋の痙性で両下肢が交差する歩行で、痙直型両麻痺（脳性麻痺）でみられる。", 0], ["大殿筋歩行 ―――― 踵接地時に体幹を後方へ反らす", "正しい組合せ。大殿筋が働かないと立脚初期に体幹が前方へ倒れるため、体幹を後方へ反らして重心線を股関節の後方へ移す。", 1], ["パーキンソン歩行 ―――― 歩隔の拡大", "誤った組合せ。パーキンソン歩行は小刻み歩行・すくみ足・前方突進が特徴で、腕振りが減少する。歩隔が広がるのは失調性歩行。", 0]], "z": "大殿筋歩行＝体幹を後方へ、大腿四頭筋麻痺＝体幹を前方へ（手で膝を押さえる）、中殿筋麻痺＝骨盤が下がる（トレンデレンブルグ）または体幹が立脚側へ傾く（デュシェンヌ）。どの筋が働かないと、どの関節の安定が崩れるかを考えると覚えやすい。"}, {"id": "s4-23", "set": 4, "n": 23, "c": "歩行", "t": "歩行・松葉杖歩行", "p": "p.208〜209※", "r": "", "s": "両松葉杖による歩行について正しいのはどれか。", "neg": false, "two": false, "o": [["2点歩行は4点歩行より遅い", "誤り。2点歩行は右杖と左下肢、左杖と右下肢を同時に出すため、4点歩行より速い。", 0], ["小振り歩行では両足を杖より前方に着く", "誤り。小振り歩行は両足を杖の手前まで振り出す。両足を杖より前方まで振り出すのは大振り歩行。", 0], ["4点歩行は右杖 → 左下肢 → 左杖 → 右下肢の順に出す", "正しい。常に3点で支持するため最も安定しているが、速度は遅い。", 1], ["3点歩行は両下肢とも全荷重が可能な場合に用いる", "誤り。3点歩行は一側下肢を免荷（または部分荷重）する場合に、両杖と患側を同時に出して健側で支持する方法である。", 0]], "z": "4点歩行（最も安定・遅い）→ 2点歩行（4点より速い）、3点歩行＝一側免荷、小振り歩行・大振り歩行＝両下肢麻痺など（大振りは速いが安定性が低い）。骨折後の免荷期には3点歩行が用いられる。"}, {"id": "s4-24", "set": 4, "n": 24, "c": "発達学習", "t": "運動発達・発達の指標", "p": "p.219〜223※", "r": "", "s": "運動発達と獲得時期の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["独歩 ―――― 8か月", "誤った組合せ。独り歩きができるのは生後11〜14か月である。", 0], ["頭位保持（首のすわり） ―――― 2〜3か月", "正しい組合せ。教科書の表では、頭位保持は生後2〜3か月で可能となる。", 1], ["寝返り ―――― 1〜2か月", "誤った組合せ。寝返りは生後3〜4か月で可能となる。", 0], ["つかまり立ち ―――― 3か月", "誤った組合せ。つかまり立ちは生後5〜9か月で可能となる。", 0]], "z": "教科書の表11-2：頭位保持2〜3か月→寝返り3〜4か月→坐位保持5〜8か月→はう7〜8か月→つかまり立ち5〜9か月→つかまり歩き8〜12か月→独り立ち10〜14か月→独り歩き11〜14か月→階段昇り1歳6か月→片足立ち（2秒）3歳。頭部から尾部へ進む発達の原則と一致する。"}, {"id": "s4-25", "set": 4, "n": 25, "c": "発達学習", "t": "運動学習・転移と記憶", "p": "p.228〜230※", "r": "", "s": "運動学習について正しいのはどれか。", "neg": false, "two": false, "o": [["一側の手で練習した技能が反対側の手にも影響することを両側性転移という", "正しい。利き手で練習した課題が非利き手の成績も高める現象で、片麻痺や骨折で一側を使えないときの練習の根拠になる。", 1], ["運動技能の記憶は主に海馬に依存する", "誤り。運動技能などの手続き記憶は主に小脳や大脳基底核に依存する。海馬が関与するのは出来事や知識などの陳述記憶。", 0], ["運動技能の記憶は陳述記憶に分類される", "誤り。運動技能の記憶は、言葉で説明しにくい非陳述記憶（手続き記憶）に分類される。", 0], ["前に学習した課題が後の学習を妨げることを正の転移という", "誤り。後の学習を妨げるのは負の転移である。正の転移は前の学習が後の学習を促進する場合をいう。", 0]], "z": "陳述記憶（エピソード記憶・意味記憶）＝海馬、手続き記憶（運動技能）＝小脳・大脳基底核。自転車の乗り方は長期間乗らなくても忘れにくく、手続き記憶の保持のよさを示す。"}, {"id": "s5-1", "set": 5, "n": 1, "c": "総論", "t": "運動学総論・運動学の分野", "p": "p.2", "r": "", "s": "運動学の分野と内容の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["運動生理学 ──── 呼吸・循環・代謝の分析", "正しい。運動生理学（生理学的運動学）は、神経・筋をはじめ呼吸・循環・代謝など運動に関する生理学的・生化学的問題を分析する。", 1], ["構造的・機能的運動学 ──── 成長・発達・老化に伴う運動の分析", "誤り。成長・発達・老化に伴う運動を扱うのは発達運動学である。構造的・機能的運動学は解剖学・組織学・神経学をもとにした機能解剖学の要素が強い分野。", 0], ["生体力学 ──── 身体像・動機づけの分析", "誤り。身体像・自己像・動機づけ・コミュニケーションなどを扱うのは心理的運動学（象徴的運動学）である。", 0], ["発達運動学 ──── 関節を機械構造とみた力学的分析", "誤り。関節などを機械構造として力学の一般法則を応用するのは生体力学（機械的運動学、バイオメカニクス）である。", 0]], "z": "運動学の5分野＝①構造的・機能的運動学（機能解剖学）②運動生理学（呼吸・循環・代謝）③生体力学（力学の法則を応用）④発達運動学（成長・発達・老化）⑤心理的運動学・象徴的運動学（身体像・動機づけ・パーソナリティ）。これらの手法で運動を分析することを運動解析（運動分析）という。正常運動を扱うのが運動学、疾病などによる異常運動を扱うのが臨床運動学（病態運動学）。"}, {"id": "s5-2", "set": 5, "n": 2, "c": "総論", "t": "運動学総論・てこ", "p": "p.13〜15", "r": "", "s": "第2のてこの例として正しいのはどれか。", "neg": false, "two": false, "o": [["中殿筋による片脚立ちのつり合い", "誤り。支点が立脚側の股関節、力点が中殿筋の付着部、荷重点が体の重心で、支点が中央にある第1のてこである。", 0], ["上腕二頭筋による肘関節の屈曲", "誤り。力点（橈骨粗面）が支点（肘関節）と荷重点（前腕の重心）の間にある第3のてこである。", 0], ["ハムストリングスによる膝関節の屈曲", "誤り。腹臥位での膝屈曲は、力点（下腿近位の付着部）が支点（膝関節）と荷重点（下腿と足の重心）の間にある第3のてこである。", 0], ["腕橈骨筋による肘関節の屈曲", "正しい。支点が肘関節、荷重点が前腕の重心、力点が橈骨遠位の腕橈骨筋付着部で、荷重点が中央にくるため第2のてこになる。", 1]], "z": "第1のてこ（安定性のてこ）＝支点が中央：頭部の前後のつり合い（頸部伸筋群）、中殿筋による片脚立ち。第2のてこ（力のてこ）＝荷重点が中央：つま先立ち（下腿三頭筋）、腕橈骨筋による肘屈曲。人体での例は少ない。第3のてこ（速さのてこ）＝力点が中央：上腕二頭筋による肘屈曲、ハムストリングスによる膝屈曲。人体の関節運動の多くは第3のてこ。力学的有利性MA＝力の腕÷荷重の腕で、MA＞1なら力に有利。"}, {"id": "s5-3", "set": 5, "n": 3, "c": "総論", "t": "運動学総論・力の単位（計算）", "p": "p.18〜19", "r": "", "s": "質量60kgの人の体重を、力の絶対単位（N）で表すとどれか。ただし重力加速度は9.8m/s²とする。", "neg": false, "two": false, "o": [["60 N", "誤り。60は重力単位で表した値（60kgw）である。Nに直すには重力加速度をかける。", 0], ["98 N", "誤り。98Nは質量10kgの物体の重さである。", 0], ["588 N", "正しい。重さ＝質量×重力加速度＝60kg×9.8m/s²＝588N。1kgw＝9.8Nなので、60kgw＝588Nとしても求められる。", 1], ["5,880 N", "誤り。桁が1つ大きい。質量600kgの物体の重さにあたる。", 0]], "z": "質量は場所によらず一定の量（kg）、重さ（重量）は地球から受ける力で場所によって変わる。力の重力単位＝kgw（質量1kgに働く重力）、力の絶対単位＝N（質量1kgに1m/s²の加速度を生じさせる力）、1kgw＝9.8N。月面（重力加速度が地球の1/6）では体重60kgwの人は10kgwになるが、質量は60kgのまま。CGS単位ではダイン（dyn）。"}, {"id": "s5-4", "set": 5, "n": 4, "c": "運動器", "t": "運動器の構造と機能・関節の構造", "p": "p.26・30", "r": "", "s": "関節について正しいのはどれか。", "neg": false, "two": false, "o": [["滑液は滑膜から分泌される", "正しい。関節包の最内層で関節腔に面した滑膜が、滑液を分泌・吸収する。", 1], ["関節軟骨は線維軟骨である", "誤り。関節軟骨は硝子軟骨である。線維軟骨でできているのは関節円板・関節半月・椎間円板など。", 0], ["関節軟骨は血管から栄養を受ける", "誤り。関節軟骨には血管がなく、滑膜から分泌される滑液によって栄養される。", 0], ["関節軟骨の厚さは5〜10cmである", "誤り。関節軟骨の厚さは0.5〜4mmである。", 0]], "z": "関節包＝外層の線維膜と内層の滑膜。滑液のはたらき＝関節軟骨の栄養・衝撃の緩和・関節の潤滑。関節軟骨＝硝子軟骨・厚さ0.5〜4mm・血管がない・潤滑性に富む。滑液包＝骨と筋、骨と腱の間にあって摩擦を軽減する。関節の補助装置＝靱帯・関節円板・関節半月・関節唇。"}, {"id": "s5-5", "set": 5, "n": 5, "c": "運動器", "t": "運動器の構造と機能・筋の役割", "p": "p.38〜39", "r": "", "s": "筋の役割について正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["固定筋は静止性収縮で運動する関節以外の部位を固定する", "正しい。運動が円滑に行われるよう、その関節以外の身体部位を静止性収縮で固定する筋を固定筋（安定筋）という。", 1], ["拮抗筋は主動作筋と同じ方向の運動に作用する", "誤り。拮抗筋は主動作筋と反対の作用をもつ筋である。同じ運動に参加するすべての筋は、広義の共同筋という。", 0], ["中和筋は互いの不要な作用を相殺する", "正しい。複数の筋がはたらくとき、それぞれの不要な作用を互いに打ち消し合って目的の運動だけを行わせる筋を中和筋という。", 1], ["左右の外腹斜筋が同時に収縮すると体幹が回旋する", "誤り。左右同時に収縮すると側屈と回旋の作用が互いに中和され、体幹の屈曲だけが起こる。中和筋の代表例。", 0]], "z": "筋の役割＝主動作筋（運動を主に行う）・補助動筋・拮抗筋（反対の作用）・固定筋（安定筋、静止性収縮で他の部位を固定。例：腕立て伏せでの頭部・体幹の筋）・共同筋（広義には1つの運動に参加するすべての筋）・中和筋（狭義の共同筋、不要な作用を相殺。例：左右の外腹斜筋）。筋収縮の様態＝求心性収縮（短縮）・静止性収縮（等尺性）・遠心性収縮（伸張）。"}, {"id": "s5-6", "set": 5, "n": 6, "c": "感覚", "t": "運動感覚・運動感覚の種類", "p": "p.53", "r": "", "s": "運動感覚（固有感覚）に含まれないのはどれか。", "neg": true, "two": false, "o": [["位置の感覚", "含まれる。身体各部の相対的な位置関係を知る感覚である。", 0], ["動きの感覚", "含まれる。随意運動による関節角度の変化の方向と速度を知る感覚である。", 0], ["二点識別覚", "含まれない。二点識別覚は皮膚に加えた2点の刺激を区別する感覚で、皮膚感覚をもとにした複合感覚である。", 1], ["力・重さの感覚", "含まれる。姿勢保持や運動時の筋活動によって生じる抵抗感や努力感である。", 0]], "z": "運動感覚＝視覚を遮っても四肢・体幹の姿勢や動きがわかる感覚で、①位置の感覚②動きの感覚③力・重さの感覚の3つ。関与する受容器＝関節受容器・筋紡錘・腱器官・皮膚の圧受容器・内耳の前庭器官。感覚の分類＝体性感覚（皮膚感覚・深部感覚）・内臓感覚・特殊感覚（味・嗅・聴・視・平衡）。運動にとくに関係するのは深部感覚と平衡感覚。"}, {"id": "s5-7", "set": 5, "n": 7, "c": "感覚", "t": "運動感覚・筋紡錘と腱器官", "p": "p.53〜54", "r": "", "s": "筋紡錘について正しいのはどれか。", "neg": false, "two": false, "o": [["1個の筋紡錘は約100本の錘内筋線維からなる", "誤り。1個の筋紡錘は3〜8本の錘内筋線維（太い核袋線維と細い核鎖線維）からなる。", 0], ["全身におよそ2万個存在する", "正しい。筋紡錘は全身におよそ2万個あり、精密な動きを要する筋に相対的に多く存在する。", 1], ["二次終末の求心路はⅠb群線維である", "誤り。二次終末（散形終末）の求心路はⅡ群線維である。Ⅰb群線維は腱器官の求心路。", 0], ["筋の自動的な収縮で強く刺激される", "誤り。筋が自ら収縮したときに張力刺激を受けるのは、筋線維と直列に並ぶ腱器官だけである。並列に並ぶ筋紡錘は刺激されない。", 0]], "z": "筋紡錘＝長さ2〜4mm・筋腹に筋線維と並列・筋の伸張と伸張速度を検出・全身約2万個・錘内筋線維3〜8本（核袋線維・核鎖線維）。一次終末（環らせん終末）＝Ⅰa群、二次終末（散形終末）＝Ⅱ群。遠心性はγ運動ニューロン（ガンマ調節）。腱器官（ゴルジ腱紡錘）＝筋腱移行部に直列・Ⅰb群。受動的な伸張では筋紡錘と腱器官の両方、自動的な収縮では腱器官だけが刺激される。随意運動ではα系とγ系に同時に指令が出る（アルファ・ガンマ連関）。"}, {"id": "s5-8", "set": 5, "n": 8, "c": "反射", "t": "反射と随意運動・反射の中枢", "p": "p.62〜63", "r": "", "s": "反射と中枢の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["迷路から起こり頭部に作用する立ち直り反射 ──── 延髄", "誤り。この立ち直り反射の中枢は中脳にある。", 0], ["眼から起こり頭部に作用する立ち直り反射 ──── 中脳", "誤り。視覚性の立ち直り反射の中枢は大脳皮質（後頭葉）にある。", 0], ["緊張性迷路反射 ──── 延髄", "正しい。受容器は前庭器官の卵形嚢と球形嚢で、反射中枢は延髄にある。", 1], ["頸部から起こり体幹に作用する立ち直り反射 ──── 大脳皮質", "誤り。受容器は頸部筋の深部感覚受容器で、中枢は延髄上部から橋にある。", 0]], "z": "延髄・橋＝緊張性頸反射（非対称性・対称性）・緊張性迷路反射・頸部から起こり体幹に作用する立ち直り反射。中脳・視床＝迷路から起こり頭部に作用する立ち直り反射・体表からの刺激で起こる立ち直り反射（赤核レベル）。大脳皮質＝眼から起こる立ち直り反射（後頭葉）・踏み直り反応（視覚性・非視覚性）・跳び直り反応・足踏み反応。脊髄＝伸張反射・屈曲反射・交叉性伸展反射。"}, {"id": "s5-9", "set": 5, "n": 9, "c": "反射", "t": "反射と随意運動・運動の誤差調節", "p": "p.67〜68", "r": "", "s": "随意運動の制御について正しいのはどれか。", "neg": false, "two": false, "o": [["小脳は脊髄のα運動ニューロンへ直接連絡する", "誤り。小脳は大脳皮質運動野と異なり、α運動ニューロンへ直接連絡する神経回路をもたない。運動プログラムへの参画とフィードバックによる誤差修正を行う。", 0], ["閉ループ制御による誤差修正には約200msecを要する", "正しい。小脳のフィードバックによる誤差修正は閉じた回路を循環するので閉ループ制御といい、約200msecかかる。", 1], ["ゴルフのスイングは閉ループ制御で行われる", "誤り。きわめて短時間で終わる運動は途中で誤差修正ができず、最初のプログラムどおりに最後まで行う開ループ制御になる。", 0], ["開ループ制御はフィードバックによる運動である", "誤り。開ループ制御による運動はフィードフォワードによる運動といわれる。", 0]], "z": "小脳の役割＝運動プログラムへの参画と、遂行された運動の誤差修正。運動指令と同じ内容の写し（エフェレンスコピー）が小脳に送られ、深部感覚受容器からのフィードバックと照合される。閉ループ制御＝フィードバック、誤差修正に約200msec、ゆっくり正確な運動。開ループ制御＝フィードフォワード、バッティング・ゴルフのスイングなど短時間の運動。針に糸を通す動作では、初めは開ループ、糸が針穴に近づくと閉ループになる。"}, {"id": "s5-10", "set": 5, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・肩関節の水平屈曲筋", "p": "p.82", "r": "", "s": "肩関節の水平屈曲に作用する筋はどれか。2つ選べ。", "neg": false, "two": true, "o": [["棘下筋", "誤り。棘下筋は外旋と水平伸展に作用する。", 0], ["烏口腕筋", "正しい。烏口腕筋は水平屈曲に作用する（ほかに屈曲・内転を補助）。", 1], ["三角筋中部", "誤り。三角筋中部は外転と水平伸展に作用する。", 0], ["肩甲下筋", "正しい。肩甲下筋は内旋とともに水平屈曲に作用する。", 1]], "z": "水平屈曲＝三角筋前部・大胸筋（鎖骨部・胸腹部）・烏口腕筋・肩甲下筋。水平伸展＝三角筋中部・三角筋後部・棘下筋・小円筋（補助：広背筋・大円筋）。外転＝三角筋中部・棘上筋（補助：上腕二頭筋長頭）。内転＝大胸筋胸腹部・広背筋・大円筋。外旋＝棘下筋・小円筋（補助：三角筋後部）。内旋＝肩甲下筋・大円筋。屈曲＝三角筋前部・大胸筋鎖骨部。伸展＝三角筋後部・広背筋・大円筋。"}, {"id": "s5-11", "set": 5, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の可動域", "p": "p.118", "r": "", "s": "股関節の運動について正しいのはどれか。", "neg": false, "two": false, "o": [["膝関節屈曲位での股関節の自動伸展は約20度である", "誤り。膝屈曲位ではハムストリングスの仕事が膝屈曲に費やされるため、自動伸展は約10度である。約20度になるのは膝伸展位。", 0], ["膝関節伸展位での股関節の自動屈曲は約90度である", "正しい。膝伸展位ではハムストリングスが緊張するため、自動屈曲は約90度（他動で約120度）に制限される。", 1], ["股関節伸展位での内旋可動域は約10度である", "誤り。股関節伸展位では内旋・外旋ともに約45度ある。屈曲位では靱帯がゆるむため、さらに大きくなる。", 0], ["開排位は両股関節を90度屈曲して内転させた肢位である", "誤り。開排位は両膝関節と股関節を90度屈曲させ、両股関節を外転させた肢位で、先天性股関節脱臼の診断に用いる。", 0]], "z": "股関節の屈曲＝膝伸展位で自動90度・他動120度、膝屈曲位で自動120度・他動140度。伸展＝膝屈曲位で約10度、膝伸展位で約20度。内旋・外旋＝伸展位で各45度。外転の制限因子＝靱帯と内転筋群の緊張（30度以上の外転で反対側も外転し、90度外転では左右45度ずつ）。内転の制限因子＝基本肢位では反対側の下肢との接触、屈曲位では坐骨大腿靱帯。"}, {"id": "s5-12", "set": 5, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の外転筋", "p": "p.119〜121", "r": "", "s": "股関節の外転に作用しないのはどれか。", "neg": true, "two": false, "o": [["中殿筋", "作用する。中殿筋は外転の主動作筋である（上殿神経）。", 0], ["大腿直筋", "作用する。大腿直筋は股関節屈曲が主で、補助的に外転にもはたらく。", 0], ["縫工筋", "作用する。縫工筋は股関節の屈曲・外転・外旋にはたらく。", 0], ["半膜様筋", "作用しない。半膜様筋は股関節伸展と、膝関節の屈曲・内旋にはたらく。", 1]], "z": "股関節の外転＝中殿筋・大腿筋膜張筋（主）、補助に小殿筋・大殿筋・縫工筋・大腿直筋。内転＝薄筋・長内転筋・短内転筋・大内転筋・恥骨筋（補助に大殿筋）。屈曲＝腸腰筋・大腿直筋・恥骨筋・大腿筋膜張筋（補助に縫工筋・中殿筋・小殿筋・薄筋・長内転筋・短内転筋・大内転筋）。伸展＝大殿筋・大腿二頭筋・半腱様筋・半膜様筋（補助に中殿筋・小殿筋）。外旋＝大殿筋・深層外旋6筋。内旋＝小殿筋。"}, {"id": "s5-13", "set": 5, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・膝関節の筋", "p": "p.128", "r": "", "s": "膝関節の屈曲と下腿の内旋の両方に主としてはたらく筋はどれか。", "neg": false, "two": false, "o": [["大腿二頭筋", "誤り。大腿二頭筋は膝関節の屈曲と外旋（外旋は短頭だけの作用）にはたらく。", 0], ["半腱様筋", "正しい。半腱様筋は膝関節の屈曲と内旋の両方に主としてはたらく（半膜様筋も同じ）。", 1], ["大腿筋膜張筋", "誤り。大腿筋膜張筋は膝関節の伸展に作用し、補助的に屈曲・外旋にはたらく。内旋はしない。", 0], ["腓腹筋", "誤り。腓腹筋は足関節の底屈が主で、膝関節には屈曲を補助するだけで回旋作用はない。", 0]], "z": "膝関節の屈曲＝半腱様筋・半膜様筋・大腿二頭筋（主）、補助に大腿筋膜張筋・縫工筋・薄筋・腓腹筋・膝窩筋・足底筋。伸展＝大腿四頭筋・大腿筋膜張筋。内旋＝半腱様筋・半膜様筋（主）、補助に縫工筋・薄筋。外旋＝大腿二頭筋（短頭）、補助に大腿筋膜張筋。ハムストリングス（大腿二頭筋・半腱様筋・半膜様筋）は坐骨神経支配。"}, {"id": "s5-14", "set": 5, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・足関節と足部の筋", "p": "p.138", "r": "", "s": "筋と作用の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["第3腓骨筋 ──── 足関節の背屈", "正しい。第3腓骨筋は長趾伸筋の外側にある小筋で、足関節の背屈と足部の外がえしにはたらく。", 1], ["長腓骨筋 ──── 足部の内がえし", "誤り。長腓骨筋は足関節の底屈と足部の外がえしにはたらく。", 0], ["後脛骨筋 ──── 足関節の背屈", "誤り。後脛骨筋は足部の内がえしと底屈にはたらく（足関節の底屈は補助）。", 0], ["前脛骨筋 ──── 足部の外がえし", "誤り。前脛骨筋は足関節の背屈と足部の内がえしにはたらく。", 0]], "z": "足関節の背屈＝前脛骨筋・長趾伸筋・第3腓骨筋（補助に長母趾伸筋）。底屈＝腓腹筋・ヒラメ筋・足底筋・長腓骨筋（補助に短腓骨筋・後脛骨筋・長趾屈筋・長母趾屈筋）。内がえし＝後脛骨筋・長趾屈筋（補助に前脛骨筋・長母趾伸筋・長母趾屈筋）。外がえし＝長腓骨筋・短腓骨筋（補助に長趾伸筋・第3腓骨筋）。神経は前面の筋が深腓骨神経、腓骨筋が浅腓骨神経、後面の筋が脛骨神経。"}, {"id": "s5-15", "set": 5, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・脊椎の可動域", "p": "p.149", "r": "", "s": "脊椎間の関節可動域について正しいのはどれか。", "neg": false, "two": false, "o": [["後頭骨と環椎の間の回旋は約45度である", "誤り。後頭骨〜環椎間の回旋は0度である。ここでは主に屈伸（代表値13度）が行われる。", 0], ["環椎と軸椎の間の側屈は約20度である", "誤り。C1〜C2間の側屈は0度である。", 0], ["腰椎の椎間の回旋は胸椎よりも大きい", "誤り。腰椎の椎間の回旋は各2度程度と小さく、胸椎（各8度程度）より小さい。", 0], ["回旋が最も大きいのは環椎と軸椎の間である", "正しい。C1〜C2間の回旋は代表値で47度あり、脊柱で最も大きい。", 1]], "z": "脊椎間の可動域（代表値）＝後頭骨〜C1：屈伸13度・回旋0度、C1〜C2：屈伸10度・側屈0度・回旋47度（最大）。下位頸椎は屈伸が大きい。胸椎は回旋が各8度程度で、屈伸は小さい。腰椎は屈伸が大きく（L5〜S1で20度）、回旋は各2度程度と小さい。脊柱は屈曲・伸展・側屈・回旋の3度の運動自由度をもつ。"}, {"id": "s5-16", "set": 5, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・脊柱と重心線", "p": "p.149", "r": "", "s": "成人の基本的立位で、重心線が脊柱を通る位置について正しいのはどれか。", "neg": false, "two": false, "o": [["第6胸椎の椎体内を通る", "誤り。重心線はC7を出たあと、各胸椎の前側を通る。", 0], ["仙椎の後方を通る", "誤り。重心線はL2〜L5の椎体内を通って仙骨上前縁の岬角に至り、仙椎・尾椎の前側を通る。", 0], ["足関節の後部に至る", "誤り。重心線は骨盤腔内を通って足関節の前部に至る。", 0], ["第3頸椎の椎体内を通る", "正しい。重心線は環椎（C1）の前面からC6までは椎体の中を通る。", 1]], "z": "脊柱を通る重心線＝C1前面〜C6は椎体内→C7を出て胸椎の前側→L2〜L5の椎体内→岬角→仙椎・尾椎の前側→骨盤腔内→足関節の前部。生理的弯曲＝頸椎・腰椎の前弯、胸椎・仙椎の後弯。頸椎の前弯は首がすわるころ、腰椎の前弯は立って歩くころに増強する（第二次弯曲）。成人の脊髄はほぼ第2腰椎の高さで終わり、それ以下は馬尾。"}, {"id": "s5-17", "set": 5, "n": 17, "c": "姿勢", "t": "姿勢・人体の重心", "p": "p.179", "r": "", "s": "人体の重心について正しいのはどれか。", "neg": false, "two": false, "o": [["成人女子の重心は男子より相対的に高い", "誤り。成人女子は約55％で、男子（約56％）よりわずかに低い。", 0], ["成人男子では足底から身長の約56％の高さにある", "正しい。成人男子は身長の約56％、成人女子は約55％の高さにある。", 1], ["仙骨のやや後方にある", "誤り。人体の重心は骨盤内の仙骨のやや前方にある。", 0], ["小児の重心は成人より相対的に低い", "誤り。小児は頭部が大きいため重心が相対的に高く、立位が不安定になりやすい。", 0]], "z": "重心＝①身体があらゆる方向に自由に回転できる点②身体各部の重量が互いに平衡する点③基本矢状面・基本前頭面・基本水平面の交点。位置は骨盤内の仙骨のやや前方、成人男子は身長の約56％、女子は約55％。測定法＝直接法（てこの原理を利用、板と体重計）と間接法（各体節の質量と重心から作図）。"}, {"id": "s5-18", "set": 5, "n": 18, "c": "姿勢", "t": "姿勢・立位姿勢の制御", "p": "p.184〜185", "r": "", "s": "理想的な立位姿勢の保持について誤っているのはどれか。", "neg": true, "two": false, "o": [["重心線は足関節の前方を通り、ヒラメ筋が活動する", "正しい記述。身体が前に倒れやすくなるのに対抗して、ヒラメ筋（ときに腓腹筋）が活動する。", 0], ["重心線は膝関節中央のやや前方を通る", "正しい記述。重力のモーメントが膝伸展に作用するため、膝の固定にとくに筋活動を必要としない。", 0], ["重心線は第4腰椎のやや後部を通る", "誤った記述。重心線は第4腰椎のやや前部を通り、脊柱を前方へ曲げるように作用するので、脊柱起立筋が活動する。", 1], ["重心線は股関節の後方を通り、腸腰筋が過伸展を防ぐ", "正しい記述。重力が股関節を伸展させるのに対抗して腸腰筋がはたらく。実際には伸筋と屈筋が間欠的に活動する。", 0]], "z": "抗重力筋＝腹側：前脛骨筋・大腿四頭筋・腹筋群・頸部屈筋群、背側：下腿三頭筋・ハムストリングス・大殿筋・脊柱起立筋。通常の立位では背側の筋群が相対的に重要で、頸部伸筋群・脊柱起立筋群・ハムストリングス・ヒラメ筋をとくに主要姿勢筋と呼ぶ。立位は足関節を支点とする逆振り子のように動揺し、伸張反射・緊張性頸反射・緊張性迷路反射・立ち直り反射などがこれを補正する。"}, {"id": "s5-19", "set": 5, "n": 19, "c": "歩行", "t": "歩行・歩行の用語", "p": "p.189〜190", "r": "", "s": "歩行について正しいのはどれか。", "neg": false, "two": false, "o": [["歩隔は進行方向での両踵の間の距離である", "誤り。歩隔は両側の踵の間隔のうち、進行方向に直角な距離をいう。", 0], ["重複歩は一側の踵接地から反対側の踵接地までをいう", "誤り。一側の踵接地から反対側の踵接地までは1歩である。重複歩は同じ側の踵が再び接地するまで。", 0], ["自由な速さの歩行では、重複歩距離は身長の約89％である", "正しい。重複歩距離は身長が高いほど長く、自由歩行で平均して身長の89％、速い歩行では100％以上になる。", 1], ["歩行率は単位距離あたりの歩数である", "誤り。歩行率（ケイデンス）は単位時間あたりの歩数である。", 0]], "z": "1歩＝一側の踵接地→反対側の踵接地、歩幅＝1歩の距離。重複歩＝一側の踵接地→同じ側の踵接地（＝歩行周期、歩行の基本単位）、重複歩距離＝その距離（自由歩行で身長の約89％）。歩隔＝進行方向に直角な両踵の間隔。足角＝足の長軸と進行方向のなす角。歩行率（ケイデンス）＝単位時間あたりの歩数。高齢者は歩行速度が遅く、重複歩距離が減少する。"}, {"id": "s5-20", "set": 5, "n": 20, "c": "歩行", "t": "歩行・立脚相の時期", "p": "p.190", "r": "", "s": "自然歩行で踵接地を0％としたとき、踵離地が起こるのは歩行周期の何％の時点か。", "neg": false, "two": false, "o": [["15％", "誤り。15％の時点で起こるのは足底接地である。", 0], ["30％", "正しい。踵離地は歩行周期の約30％の時点で起こる。", 1], ["45％", "誤り。この時点にあたる立脚相の区分はない。", 0], ["60％", "誤り。60％の時点で起こるのは足指離地で、ここから遊脚相に入る。", 0]], "z": "立脚相（約60％）＝踵接地（0％）→足底接地（15％）→立脚中期→踵離地（30％）→足指離地（60％）。前半（踵接地〜立脚中期）は平衡を取り戻す抑制期、後半（立脚中期〜足指離地）は推進期。踵離地〜足指離地を踏み切り期（蹴り出し期）という。遊脚相（約40％）＝加速期（脚が体幹の後方）→遊脚中期（体幹の直下）→減速期（体幹の前方）。"}, {"id": "s5-21", "set": 5, "n": 21, "c": "歩行", "t": "歩行・重心移動", "p": "p.193", "r": "", "s": "歩行中の重心移動について正しいのはどれか。", "neg": false, "two": false, "o": [["左右方向の振幅は約3cmである", "正しい。重心は左右方向にも正弦曲線を描き、振幅は約3cmである。", 1], ["上下方向の振幅は約10cmである", "誤り。上下方向の振幅はおよそ4.5cmである。", 0], ["歩行速度を速めると上下方向の振幅は減少する", "誤り。歩行速度を速めると、上下方向の振幅は増加する。", 0], ["最も側方に偏るのは踵接地期である", "誤り。重心が最も側方に偏るのは立脚中期で、踵接地期（同時定着時期）に中央に戻る。", 0]], "z": "重心移動＝上下・左右ともに正弦曲線。上下：立脚中期で最高、踵接地期（同時定着時期）で最低、振幅約4.5cm、速く歩くと増加。左右：立脚中期で最も側方、振幅約3cm。重心移動は歩行のエネルギー消費を最小にするように行われ、上下・左右の振幅が小さく直線に近いほど経済的な歩行になる。"}, {"id": "s5-22", "set": 5, "n": 22, "c": "歩行", "t": "歩行・歩行時の筋活動", "p": "p.200〜201", "r": "", "s": "正常歩行時の筋活動について誤っているのはどれか。", "neg": true, "two": false, "o": [["前脛骨筋は遊脚相で足関節を背屈位に保つ", "正しい記述。下垂足にならないよう背屈位に保ち、立脚相初期には足関節の過度な底屈を防ぐ。", 0], ["下腿三頭筋は立脚相の末期に強く活動する", "正しい記述。立脚相全般に活動し、とくに末期に強く蹴り出して加速する。", 0], ["脊柱起立筋は遊脚相にだけ活動する", "誤った記述。脊柱起立筋は歩行の全周期にわたって活動し、とくに両相の移行期に大きく活動して体幹の前方屈曲を防ぐ。", 1], ["ハムストリングスは遊脚相での下肢の振り子運動を減速する", "正しい記述。遊脚相から立脚相への移行期に活動し、下肢の前方への振り出しを減速して踵を接地させる。", 0]], "z": "歩行時の筋の役割＝安定性（股関節の内・外転筋群が骨盤を安定させる、大腿四頭筋が膝を安定させる、前脛骨筋が足関節を固定、脊柱起立筋が全周期で体幹を支える）、加速性（下腿三頭筋が立脚相末期に蹴り出す、大腿内転筋群も関与）、減速性（大腿四頭筋とハムストリングスが遊脚相から立脚相への移行期に振り子運動を減速）。上肢の振りは体幹の回旋に拮抗する運動で、肩関節屈曲約20度・伸展約9度。"}, {"id": "s5-23", "set": 5, "n": 23, "c": "歩行", "t": "歩行・走行", "p": "p.206", "r": "", "s": "走行について正しいのはどれか。", "neg": false, "two": false, "o": [["走る速度が増すと支持相の比率が増加する", "誤り。支持相の時間比率は50％程度で、速度が増すと減少する。", 0], ["重心の上下方向の移動は歩行より小さい", "誤り。走行では歩行と比べて重心の上下方向の移動が大きい。", 0], ["走行の重複歩は3歩で構成される", "誤り。走行の周期は歩行と同じで、重複歩は2歩で構成される。", 0], ["走行が可能になるのは2歳前後である", "正しい。走行が可能になるのは2歳前後で、上下肢の交互運動を伴う走行が完成するのは5歳ころである。", 1]], "z": "走行＝支持相（駆動相）と非支持相（飛翔相、両足が地面から離れる）からなり、両脚支持期はない。支持相の比率は約50％で、速度が増すと減少する。重心の上下動は歩行より大きい。疲労した走行では、重心が低くなる・前傾が増す・腕を横に振る・下肢の挙上が減る・ケイデンスが低くなる・足の外旋で支持基底が広がる。初期の走行は支持基底が広く、足底全体で接地し、上肢を挙上している。"}, {"id": "s5-24", "set": 5, "n": 24, "c": "発達学習", "t": "運動発達・運動の獲得順序", "p": "p.217", "r": "", "s": "正常な運動発達で、最も遅く獲得されるのはどれか。", "neg": false, "two": false, "o": [["寝返り", "誤り。寝返りは3〜4か月で可能となる。", 0], ["坐位保持", "誤り。坐位保持は5〜8か月で可能となる。", 0], ["階段昇り", "誤り。階段昇りは1歳6か月で可能となる。", 0], ["2秒間の片足立ち", "正しい。2秒程度の片足立ちができるのは3歳で、選択肢の中で最も遅い。", 1]], "z": "運動の獲得順序（教科書の表）＝頭位保持2〜3か月→寝返り3〜4か月→坐位保持5〜8か月→はう7〜8か月→つかまり立ち5〜9か月→つかまり歩き8〜12か月→独り立ち10〜14か月→独り歩き11〜14か月→階段昇り1歳6か月→片足立ち（2秒）3歳→階段降り4〜5歳→歩行での腕の振り5歳→スキップ5〜6歳。成人型歩行は6歳。獲得の時期には個人差があるが、順番はおおむね一定。"}, {"id": "s5-25", "set": 5, "n": 25, "c": "発達学習", "t": "運動学習・運動技能", "p": "p.226", "r": "", "s": "運動技能について正しいのはどれか。", "neg": false, "two": false, "o": [["フォーム・正確性・速度・適応性の4つの要素からなる", "正しい。運動技能はこの4つの要素から構成される。", 1], ["正確さと速度は正の相関を示す", "誤り。正確さと速度は逆相関の関係にある。速くしようとすると正確さが落ちる。", 0], ["訓練では速度を正確性より先に獲得するのが効率的である", "誤り。初めによいフォームを習得し、次に正確さ、その後に速さと適応性を獲得するのが効率的である。", 0], ["フォームがよくなるとエネルギー消費は増加する", "誤り。フォームがよくなることは、課題遂行時のエネルギー消費の減少に対応する。", 0]], "z": "運動技能の4要素＝フォーム（エネルギー消費で評価）・正確性（再現性）・速度（正確さと逆相関）・適応性（環境の変化に影響されにくい）。習得の順序はフォーム→正確性→速度・適応性。練習によるパフォーマンスの変化＝遂行時間の短縮・正確さの向上と誤りの減少・自由度の増加・複雑な課題への適応・注意と努力量の減少。運動能力は先天的要素が大きく、変容を受けにくい。"}, {"id": "s6-1", "set": 6, "n": 1, "c": "総論", "t": "運動学総論・運動のとらえ方", "p": "p.3", "r": "", "s": "上肢を挙上して「質問に答えられる」という合図を送ることは、運動行動のどの側面にあたるか。", "neg": false, "two": false, "o": [["運動", "誤り。「肩関節を屈曲180度まで動かす」と表すのが運動（movement）である。", 0], ["動作", "誤り。「挙手をする」という課題の単位でとらえたものが動作（motion）である。", 0], ["反射", "誤り。反射は刺激に対する不随意な反応で、運動発現の理由による分類の1つである。", 0], ["行為", "正しい。社会文化的な背景や意図と関連づけてとらえたものが行為（action）である。", 1]], "z": "運動行動は3つの側面から分析する。運動＝姿勢が時間的に連続して変化したもの（肩関節屈曲180度）、動作＝課題や仕事を単位としたもの（挙手をする）、行為＝社会文化的背景や意図と関連づけたもの（質問に答えられる合図）。運動の分類＝関節運動・筋収縮様式・生体力学（線運動と角運動）・運動発現の理由（反射・他動運動・随意運動）・運動の目的（支持・移動・操作）に基づく分類。"}, {"id": "s6-2", "set": 6, "n": 2, "c": "総論", "t": "運動学総論・運動面と運動軸", "p": "p.6〜7", "r": "", "s": "運動と運動軸の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["顔を横に向ける ──── 水平前頭軸", "誤り。顔を横に向ける運動は、水平面で垂直軸のまわりに行われる。", 0], ["膝を曲げる ──── 垂直軸", "誤り。膝を曲げる運動は、矢状面で左右方向に走る水平前頭軸のまわりに行われる。", 0], ["頭を横に倒す ──── 水平矢状軸", "正しい。頭を横に倒す運動は、前頭面で前後方向に走る水平矢状軸のまわりに行われる。", 1], ["下垂した上肢の前腕回内 ──── 水平矢状軸", "誤り。下垂した上肢の前腕回内・回外は、水平面で垂直軸のまわりに行われる。", 0]], "z": "垂直軸＝水平面の運動（顔を横に向ける、下垂位の前腕回内・回外、内旋・外旋）。水平矢状軸（前後方向）＝前頭面の運動（頭を横に倒す、上肢を横に上げる＝外転・内転）。水平前頭軸（左右方向）＝矢状面の運動（頭を前に倒す、膝を曲げる＝屈曲・伸展）。運動軸は運動面に対して常に直角。重心点を通る3つの面を基本面（基本矢状面・基本前頭面・基本水平面）という。"}, {"id": "s6-3", "set": 6, "n": 3, "c": "総論", "t": "運動学総論・運動量（計算）", "p": "p.18", "r": "", "s": "質量50kgの物体が2m/sの速度で運動しているときの運動量はどれか。", "neg": false, "two": false, "o": [["25 kg・m/s", "誤り。質量を速度で割った値になっている。運動量は質量と速度の積である。", 0], ["52 kg・m/s", "誤り。質量と速度を足した値になっている。", 0], ["100 kg・m/s", "正しい。運動量＝質量×速度＝50kg×2m/s＝100kg・m/s。", 1], ["200 kg・m/s", "誤り。速度を2乗したとき（50×2²）の値である。運動エネルギー（1/2・mv²）と混同しないこと。", 0]], "z": "運動量＝質量×速度（向きをもつベクトル量）。力積＝力×時間で、運動量の変化分に等しい。2つの物体が互いに力を及ぼし合うだけなら運動量の和は変わらない（運動量保存の法則）。ニュートンの運動の法則＝第1法則（慣性の法則）、第2法則（加速度の法則、F＝ma）、第3法則（作用・反作用の法則、例：徒手筋力検査）。運動エネルギー＝1/2・mv²、位置エネルギー＝mgh。"}, {"id": "s6-4", "set": 6, "n": 4, "c": "運動器", "t": "運動器の構造と機能・骨の構造", "p": "p.24〜26", "r": "", "s": "骨について正しいのはどれか。", "neg": false, "two": false, "o": [["骨膜の内層は線維層である", "誤り。骨膜の外層が線維層、内層が造骨能をもつ骨芽層である。", 0], ["関節軟骨には血管が存在しない", "正しい。関節面をおおう硝子軟骨の関節軟骨には血管がなく、滑膜から分泌される滑液によって栄養される。", 1], ["骨端軟骨は成人になっても骨の長さの成長に関与する", "誤り。骨端軟骨（骨端成長板）は成長期に存在し、成人に達して骨化すると骨端線として残る。", 0], ["成人の骨格は約100個の骨で構成される", "誤り。成人の骨格は200余個の骨で構成される。", 0]], "z": "骨の基本構造＝骨膜・骨質・骨髄・関節軟骨・骨端軟骨。骨膜＝外層は線維層、内層は骨芽層。骨膜と骨質はシャーピー線維で強固に結合する。関節軟骨部を除いた骨表面は骨膜でおおわれる。骨端軟骨は長さの成長に関与し、成人では骨端線になる。骨の機能＝支持・保護・運動（てこ）・造血・電解質（カルシウム）の貯蔵。"}, {"id": "s6-5", "set": 6, "n": 5, "c": "運動器", "t": "運動器の構造と機能・滑液", "p": "p.30", "r": "", "s": "滑液のはたらきはどれか。2つ選べ。", "neg": false, "two": true, "o": [["関節の潤滑", "正しい。滑液は関節の潤滑作用をもち、関節軟骨の潤滑性を高める。", 1], ["骨の長さの成長", "誤り。骨の長さの成長に関与するのは骨端軟骨（骨端成長板）である。", 0], ["関節の位置の検出", "誤り。関節の位置を検出するのは関節の感覚受容器（ルフィニ終末・ゴル
