ジ終末）である。", 0], ["物理的な衝撃の緩和", "正しい。滑液は関節に加わる物理的な衝撃を緩和する。", 1]], "z": "滑液のはたらき＝関節軟骨の栄養・物理的な衝撃の緩和・関節の潤滑の3つ。滑液は関節包の最内層の滑膜が分泌・吸収する。関節軟骨は血管がなく、栄養を滑液から受ける。滑液包＝骨と筋、骨と腱の間で摩擦を軽減する結合組織の袋。"}, {"id": "s6-6", "set": 6, "n": 6, "c": "感覚", "t": "運動感覚・関節の感覚受容器", "p": "p.55", "r": "", "s": "感覚受容器とはたらきの組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["ルフィニ終末 ──── 運動の開始と停止の検出", "誤り。ルフィニ終末は関節包に多く存在し、関節の位置と運動の速度を検出する。運動の開始と停止を検出するのはパチニ小体。", 0], ["パチニ小体 ──── 関節の位置と運動速度の検出", "誤り。パチニ小体は運動の開始と停止を検出する。位置と運動速度はルフィニ終末。", 0], ["筋紡錘 ──── 筋の張力の検出", "誤り。筋紡錘は筋の伸張（長さ）と伸張速度を検出する。張力を検出するのは腱器官。", 0], ["ゴルジ終末 ──── 関節の位置の検出", "正しい。ゴルジ終末は関節の靱帯にあって、関節の位置を検出する。", 1]], "z": "関節の感覚受容器＝ルフィニ終末（関節包、位置と運動の速度）・ゴルジ終末（靱帯、関節の位置）・パチニ小体（運動の開始と停止）・自由神経終末（関節包・滑膜・靱帯に多数、関節痛の検知）。筋の受容器＝筋紡錘（長さと伸張速度、Ⅰa・Ⅱ群）・腱器官（張力、Ⅰb群）。皮膚＝マイスナー小体・メルケル小体・パチニ小体・ルフィニ終末・自由神経終末。"}, {"id": "s6-7", "set": 6, "n": 7, "c": "感覚", "t": "運動感覚・平衡感覚", "p": "p.55", "r": "", "s": "前庭器官について正しいのはどれか。", "neg": false, "two": false, "o": [["卵形嚢と球形嚢は直線運動の加速度を感知する", "正しい。卵形嚢と球形嚢は重力に対する頭部の傾きと、直線運動の加速度を検出する。", 1], ["三半規管は等速の回転運動に反応する", "誤り。三半規管は回転の加速度を検出し、等速回転運動には反応しない。", 0], ["前庭器官からの入力は大脳皮質に投射されて意識される", "誤り。前庭器官からの入力は大脳皮質へ投射されず、姿勢や反射の制御に直接利用されるため、意識される前庭感覚はない。", 0], ["前庭器官は中耳にある", "誤り。前庭器官は側頭骨内の内耳（迷路）にある。", 0]], "z": "内耳（迷路）＝蝸牛（聴覚）と前庭器官（平衡感覚）。前庭器官＝卵形嚢・球形嚢（耳石器、頭部の傾きと直線加速度）と3つの半規管（回転加速度、等速回転には反応しない）。前庭感覚は意識されず、緊張性迷路反射・立ち直り反射などの姿勢制御に使われる。運動にとくに関係する感覚は、体性感覚のうちの深部感覚と特殊感覚のうちの平衡感覚。"}, {"id": "s6-8", "set": 6, "n": 8, "c": "反射", "t": "反射と随意運動・緊張性反射", "p": "p.62", "r": "", "s": "緊張性頸反射と緊張性迷路反射について誤っているのはどれか。", "neg": true, "two": false, "o": [["非対称性緊張性頸反射では顔面を向けた側の四肢が伸展する", "正しい記述。顔面側の四肢が伸展し、後頭側の四肢が屈曲する（フェンシングの構え）。", 0], ["緊張性迷路反射では腹臥位で四肢の伸筋の緊張が最大となる", "誤った記述。伸筋の緊張が最大となるのは背臥位（口角と耳孔を結ぶ線が水平面より45度上方）である。腹臥位では伸筋の緊張が最小となる。", 1], ["対称性緊張性頸反射では頭部の前屈で上肢が屈曲し下肢が伸展する", "正しい記述。頭部を後屈させると逆に上肢が伸展し、下肢が屈曲する。", 0], ["緊張性迷路反射の受容器は卵形嚢と球形嚢である", "正しい記述。頭部と重力方向との関係を卵形嚢・球形嚢が感知し、中枢は延髄にある。", 0]], "z": "緊張性頸反射（中枢は延髄・橋）＝非対称性（ATNR：顔面側の四肢伸展・後頭側屈曲）と対称性（STNR：頭部前屈で上肢屈曲・下肢伸展、後屈で逆）。乳幼児期に現れて消失するが、成人でも努力を伴う運動やスポーツでみられることがある。緊張性迷路反射（延髄）＝背臥位で伸筋の緊張最大、腹臥位で最小。立ち直り反射＝頸部から体幹へ（延髄上部〜橋）、迷路から頭部へ・体表から（中脳）、眼から（大脳皮質）。"}, {"id": "s6-9", "set": 6, "n": 9, "c": "反射", "t": "反射と随意運動・随意運動と連合運動", "p": "p.64〜66", "r": "", "s": "随意運動について正しいのはどれか。", "neg": false, "two": false, "o": [["運動への欲求・動機には大脳辺縁系が関与する", "正しい。運動の欲求・動機は大脳辺縁系（海馬・扁桃体・帯状回・視床下部など）が関与し、その信号が大脳連合野に伝えられる。", 1], ["歩行時の上肢の振りは病的連合運動である", "誤り。歩行時の上肢の振りは正常な連合運動の1つである。", 0], ["レミストの反応は小脳障害で起こる", "誤り。レミストの反応（健側下肢の内転・外転に合わせて麻痺側も内転・外転する）は錐体路障害による病的連合運動である。", 0], ["運動プログラムは運動の開始後に構成される", "誤り。運動プログラムは運動開始前に構成される筋への指令のセットで、過去の運動経験に基づいてつくられる。", 0]], "z": "随意運動の発現＝欲求・動機（大脳辺縁系）→運動の計画・プログラム（大脳連合野・前頭前野・運動前野・補足運動野、大脳基底核・小脳）→最終指令（大脳運動野）→脊髄→筋。運動プログラムには使う筋の選定、活動の順序とタイミング、力の大きさ、姿勢調整が含まれる。連合運動＝随意運動に伴う不随意な運動（正常：歩行時の腕の振り、病的：レミストの反応・対側性連合反応）。共同運動＝複数の筋の協調した活動（痙性片麻痺では屈筋・伸筋の病的共同運動パターン）。"}, {"id": "s6-10", "set": 6, "n": 10, "c": "四肢体幹", "t": "四肢と体幹の運動・肩関節の水平伸展筋", "p": "p.82", "r": "", "s": "肩関節の水平伸展に作用しないのはどれか。", "neg": true, "two": false, "o": [["棘下筋", "作用する。棘下筋は外旋と水平伸展にはたらく。", 0], ["小円筋", "作用する。小円筋も外旋と水平伸展にはたらく。", 0], ["肩甲下筋", "作用しない。肩甲下筋は内旋と水平屈曲にはたらく（内転を補助）。", 1], ["大円筋", "作用する。大円筋は伸展・内転・内旋が主で、水平伸展を補助する。", 0]], "z": "水平伸展＝三角筋中部・三角筋後部・棘下筋・小円筋（補助：広背筋・大円筋）。水平屈曲＝三角筋前部・大胸筋（鎖骨部・胸腹部）・烏口腕筋・肩甲下筋。回旋筋腱板＝棘上筋（外転）・棘下筋（外旋）・小円筋（外旋）・肩甲下筋（内旋）。神経＝棘上筋・棘下筋は肩甲上神経、小円筋・三角筋は腋窩神経、肩甲下筋・大円筋は肩甲下神経、広背筋は胸背神経、大胸筋は内側・外側胸筋神経。"}, {"id": "s6-11", "set": 6, "n": 11, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の筋と神経", "p": "p.120", "r": "", "s": "筋と支配神経の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["中殿筋 ──── 下殿神経", "誤り。中殿筋と小殿筋は上殿神経に支配される。", 0], ["大殿筋 ──── 上殿神経", "誤り。大殿筋は下殿神経に支配される。", 0], ["薄筋 ──── 閉鎖神経", "正しい。薄筋は閉鎖神経に支配され、股関節内転と膝関節の屈曲・内旋にはたらく。", 1], ["縫工筋 ──── 坐骨神経", "誤り。縫工筋は大腿神経に支配される。", 0]], "z": "股関節の筋の神経＝腸腰筋（腰神経叢・大腿神経）、縫工筋・大腿直筋（大腿神経）、恥骨筋（大腿神経・閉鎖神経）、大腿筋膜張筋・中殿筋・小殿筋（上殿神経）、大殿筋（下殿神経）、ハムストリングス（坐骨神経、大腿二頭筋短頭は総腓骨神経部）、薄筋・長内転筋・短内転筋（閉鎖神経）、大内転筋（閉鎖神経と坐骨神経の二重支配）、深層外旋6筋（閉鎖神経・仙骨神経叢）。"}, {"id": "s6-12", "set": 6, "n": 12, "c": "四肢体幹", "t": "四肢と体幹の運動・股関節の内転筋", "p": "p.121", "r": "", "s": "股関節の内転と外旋の両方に作用する筋はどれか。2つ選べ。", "neg": false, "two": true, "o": [["大内転筋", "誤り。大内転筋は内転が主で屈曲を補助するが、外旋の作用はない。", 0], ["恥骨筋", "正しい。恥骨筋は股関節の屈曲・内転にはたらき、外旋を補助する。", 1], ["長内転筋", "正しい。長内転筋は内転が主で、屈曲と外旋を補助する。", 1], ["薄筋", "誤り。薄筋は股関節の内転と屈曲の補助、膝関節の屈曲・内旋にはたらく。股関節の外旋はしない。", 0]], "z": "股関節の内転＝薄筋・長内転筋・短内転筋・大内転筋・恥骨筋（補助に大殿筋）。このうち外旋も補助するのは恥骨筋・長内転筋・短内転筋。屈曲も補助するのは恥骨筋（主）・薄筋・長内転筋・短内転筋・大内転筋。外旋＝大殿筋・深層外旋6筋（梨状筋・内閉鎖筋・外閉鎖筋・上双子筋・下双子筋・大腿方形筋）、補助に腸腰筋・縫工筋・大腿二頭筋・中殿筋・小殿筋。内旋＝小殿筋、補助に中殿筋・半腱様筋・半膜様筋。"}, {"id": "s6-13", "set": 6, "n": 13, "c": "四肢体幹", "t": "四肢と体幹の運動・膝関節の伸展筋", "p": "p.128", "r": "", "s": "膝関節の伸展に作用する筋はどれか。", "neg": false, "two": false, "o": [["大腿筋膜張筋", "正しい。大腿筋膜張筋は腸脛靱帯を介して脛骨に作用し、膝関節の伸展にはたらく（補助的に屈曲・外旋にも関与）。", 1], ["縫工筋", "誤り。縫工筋は膝関節の屈曲・内旋を補助する。", 0], ["薄筋", "誤り。薄筋も膝関節の屈曲・内旋を補助する。", 0], ["膝窩筋", "誤り。膝窩筋は膝関節の屈曲・内旋にはたらく。", 0]], "z": "膝関節の伸展＝大腿四頭筋・大腿筋膜張筋。屈曲＝半腱様筋・半膜様筋・大腿二頭筋（主）、補助に大腿筋膜張筋・縫工筋・薄筋・腓腹筋・膝窩筋・足底筋。大腿筋膜張筋は2関節筋の機能をもち、股関節には屈曲・外転、膝関節には伸展・下腿の外旋にはたらく。大腿四頭筋のうち2関節筋は大腿直筋だけで、膝伸展は股関節伸展位で有効にはたらく。"}, {"id": "s6-14", "set": 6, "n": 14, "c": "四肢体幹", "t": "四肢と体幹の運動・足部の外がえし", "p": "p.138", "r": "", "s": "足部の外がえしに作用する筋はどれか。", "neg": false, "two": false, "o": [["後脛骨筋", "誤り。後脛骨筋は足部の内がえしと底屈にはたらき、内側縦アーチの形成に重要である。", 0], ["長趾伸筋", "正しい。長趾伸筋は第2〜5趾の伸展、足関節の背屈、足部の外がえしにはたらく。", 1], ["長母趾伸筋", "誤り。長母趾伸筋は母趾の伸展にはたらき、足関節の背屈と足部の内がえしを補助する。", 0], ["長趾屈筋", "誤り。長趾屈筋は第2〜5趾の屈曲と足部の内がえしにはたらく。", 0]], "z": "外がえし＝長腓骨筋・短腓骨筋（主）、補助に長趾伸筋・第3腓骨筋。内がえし＝後脛骨筋・長趾屈筋（主）、補助に前脛骨筋・長母趾伸筋・長母趾屈筋。背屈して外がえしするのは長趾伸筋・第3腓骨筋、背屈して内がえしするのは前脛骨筋・長母趾伸筋、底屈して外がえしするのは長腓骨筋・短腓骨筋、底屈して内がえしするのは後脛骨筋・長趾屈筋・長母趾屈筋。"}, {"id": "s6-15", "set": 6, "n": 15, "c": "四肢体幹", "t": "四肢と体幹の運動・腰椎の可動域", "p": "p.149", "r": "", "s": "腰椎で、椎間の屈伸の可動域が最も大きいのはどれか。", "neg": false, "two": false, "o": [["L1〜L2", "誤り。代表値は12度である。", 0], ["L2〜L3", "誤り。代表値は14度である。", 0], ["L3〜L4", "誤り。代表値は15度である。", 0], ["L5〜S1", "正しい。代表値は20度で、腰椎の椎間で最も大きい。下位ほど屈伸が大きくなる。", 1]], "z": "腰椎の椎間の屈伸（代表値）＝L1〜L2：12度、L2〜L3：14度、L3〜L4：15度、L4〜L5：17度、L5〜S1：20度。腰椎は屈伸が大きく、回旋は各2度程度と小さい（L5〜S1は5度）。胸椎は回旋が各8度程度で屈伸が小さい。頸椎ではC1〜C2の回旋（47度）が最大。"}, {"id": "s6-16", "set": 6, "n": 16, "c": "四肢体幹", "t": "四肢と体幹の運動・脊髄", "p": "p.149", "r": "", "s": "成人の脊髄の下端の高さはどれか。", "neg": false, "two": false, "o": [["第12胸椎", "誤り。脊髄は脊柱管の全長より短いが、第12胸椎よりは下まである。", 0], ["第2腰椎", "正しい。成人の脊髄下端はほぼ第2腰椎の高さで終わり、それ以下は馬尾となる。", 1], ["第4腰椎", "誤り。第4腰椎の高さの脊柱管には馬尾が通る。", 0], ["第2仙椎", "誤り。脊柱管の下端に近い高さで、脊髄はここまで届かない。", 0]], "z": "脊髄は脊柱管の全長より短く、成人ではほぼ第2腰椎の高さで終わり、それ以下は馬尾となる。脊髄の前側から運動神経が前根として、後側から感覚神経が後根として出入りする。脊柱の生理的弯曲＝頸椎・腰椎の前弯、胸椎・仙椎の後弯。"}, {"id": "s6-17", "set": 6, "n": 17, "c": "姿勢", "t": "姿勢・立位姿勢の安定性", "p": "p.182〜183", "r": "", "s": "立位姿勢の安定性について誤っているのはどれか。", "neg": true, "two": false, "o": [["重心の位置が低いほど安定性がよい", "正しい記述。立位より坐位、坐位より臥位のほうが重心が低く安定する。両上肢を挙上すると重心が高くなり、安定性は低くなる。", 0], ["支持基底の面積が広いほど安定性がよい", "正しい記述。両足を密着させた立位（ロンベルグ肢位）より、足を離した立位や松葉杖を使った立位のほうが安定する。", 0], ["重心線が支持基底の中心に近いほど安定性がよい", "正しい記述。片足立ちでは支持基底が狭くなるうえ、重心線が辺縁に偏るため不安定になる。", 0], ["静止立位では質量が大きいほど安定性がよい", "誤った記述。質量が安定性に影響するのは、運動時と重力以外の外力が作用しているときだけである。摩擦も同様。", 1]], "z": "安定性に影響する要因＝①重心の高さ（低いほど安定）②支持基底の広さ（広いほど安定）③支持基底と重心線の関係（中心に近いほど安定）④質量（大きいほど安定、ただし運動時と外力作用時のみ）⑤摩擦抵抗（大きいほど安定、同上）⑥分節構造（単一構造物のほうが安定）⑦心理的要因（視界の遮断・高所）⑧生理的要因（抗重力機構・反射）。"}, {"id": "s6-18", "set": 6, "n": 18, "c": "姿勢", "t": "姿勢・重心動揺", "p": "p.185", "r": "", "s": "立位姿勢の重心動揺について正しいのはどれか。", "neg": false, "two": false, "o": [["閉眼によって重心動揺は減少する", "誤り。閉眼で視覚を遮断すると身体の動揺は増大する。姿勢制御では視覚が重視される。", 0], ["動揺による移動量は頭部より重心点のほうが大きい", "誤り。動揺による移動量は重心点より頭部のほうが大きい。", 0], ["重心動揺面積は20歳代で最小となる", "正しい。幼児期から10歳代後半まで年齢とともに減少して20歳代で最小となり、その後は増加して70歳代では著しく大きくなる。", 1], ["正常では左右型の動揺が多い", "誤り。正常では前後型・求心型・びまん型が多く、左右型は通常みられない。", 0]], "z": "立位は足関節を支点とする逆振り子のように動揺する（成人の頭部・重心の動揺速度は0.7〜0.9cm/秒）。重心動揺面積は20歳代で最小、70歳代で著しく増大。閉眼で動揺が増大し、重心は前方へ移動する（眼からの立ち直り反射の欠落）。重心動揺計による分類＝前後型・左右型・求心型・びまん型など。外力への応答＝踏み直り反応（主な受容器は前庭迷路系）・傾斜反応。"}, {"id": "s6-19", "set": 6, "n": 19, "c": "歩行", "t": "歩行・歩行速度と歩行周期", "p": "p.192〜193", "r": "", "s": "歩行速度を速めたときの変化で正しいのはどれか。", "neg": false, "two": false, "o": [["同時定着時期の比率が増加する", "誤り。同時定着時期（両脚支持期）の比率は減少し、走行では消失する。", 0], ["立脚相の比率が増加する", "誤り。立脚相の比率は減少する。", 0], ["重心の上下方向の振幅が減少する", "誤り。歩行速度を速めると、重心の上下方向の振幅は増加する。", 0], ["遊脚相の比率が増加する", "正しい。歩行速度が速くなると立脚相と同時定着時期の比率が減少し、遊脚相の比率が増加する。", 1]], "z": "自然歩行＝立脚相60％・遊脚相40％・同時定着時期（両脚支持期、二重支持期）10％×2回＝20％。速度を上げると立脚相と同時定着時期が減り、遊脚相が増え、重心の上下の振幅が大きくなる。走行では同時定着時期が消え、両足が地面から離れる非支持相（飛翔相）が現れる。重複歩距離は自由歩行で身長の約89％、速い歩行で100％以上。"}, {"id": "s6-20", "set": 6, "n": 20, "c": "歩行", "t": "歩行・下肢の関節運動", "p": "p.194", "r": "", "s": "1歩行周期における関節運動について正しいのはどれか。", "neg": false, "two": false, "o": [["膝関節は屈曲と伸展を各1回行う", "誤り。膝関節は屈曲と伸展を2回ずつ行う（二重膝作用）。", 0], ["股関節は屈曲と伸展を各1回行う", "正しい。股関節は1歩行周期に屈曲と伸展を1回ずつ行う。", 1], ["足関節は底屈と背屈を各1回行う", "誤り。足関節は底屈と背屈を2回ずつ行う。", 0], ["骨盤の回旋は左右あわせて約20度である", "誤り。骨盤の回旋は左右にそれぞれ4度、合計8度である。", 0]], "z": "1歩行周期の関節運動＝股関節：屈曲・伸展を各1回、膝関節：各2回（踵接地後に軽く屈曲→伸展→遊脚相で再び屈曲→伸展）、足関節：各2回。体節の回旋＝骨盤・大腿骨・脛骨は遊脚相初期から立脚相で体重が負荷されるまで内旋し、その後外旋する。回旋は骨盤（左右4度ずつ計8度）より遠位ほど大きい。"}, {"id": "s6-21", "set": 6, "n": 21, "c": "歩行", "t": "歩行・効率的な歩行を決める要因", "p": "p.195〜196", "r": "", "s": "Saundersらが挙げた、効率的な歩行を決める要因に含まれないのはどれか。", "neg": true, "two": false, "o": [["上肢の振り", "含まれない。上肢の振りは体幹の回旋に拮抗する運動で、Saundersの5要因には入らない。", 1], ["骨盤の回旋", "含まれる。骨盤の水平面での回旋によって重心の下降を小さくし、上下方向の振幅を減らす。", 0], ["骨盤の傾斜", "含まれる。遊脚側の骨盤が約5度下方に傾き、重心の上下方向の振幅を減らす。", 0], ["立脚相での膝屈曲", "含まれる。伸展→屈曲→伸展→屈曲の二重膝作用が、接地時の衝撃緩和と上下方向の振幅の減少に役立つ。", 0]], "z": "Saundersらの5要因＝①骨盤の回旋（水平面、内旋は立脚相初期・外旋は遊脚相初期に最大）②骨盤の傾斜（前頭面、遊脚側が約5度下がる、立脚中期に最大）③立脚相での膝屈曲（二重膝作用）④足関節と膝関節の機構（踵接地で膝伸展・足背屈、膝屈曲時は足底屈）⑤骨盤の側方移動（大腿骨・脛骨の生理的外反で振幅を小さくする）。いずれも重心の上下・左右の振幅を小さくして、エネルギー消費を減らす。"}, {"id": "s6-22", "set": 6, "n": 22, "c": "歩行", "t": "歩行・エネルギー代謝", "p": "p.204〜205", "r": "", "s": "歩行のエネルギー消費について正しいのはどれか。", "neg": false, "two": false, "o": [["通常歩行では安静臥床の約4倍のエネルギーを消費する", "正しい。基礎代謝量と運動代謝量の相対的な比較で、通常歩行は安静臥床の約4倍のエネルギーを消費する。", 1], ["エネルギー消費が最小となる歩行速度は毎分約40mである", "誤り。毎分60〜80mではエネルギー消費があまり変わらず、毎分80mのときに最小となる。", 0], ["酸素1Lの消費で約1kcalのエネルギーが産生される", "誤り。酸素1Lあたり4.83kcal（約5kcal）のエネルギーが産生される。", 0], ["生理的コスト指数（PCI）は歩行時心拍数を歩行距離で割って求める", "誤り。PCI＝（歩行時心拍数－安静時心拍数）÷歩行速度で求める。", 0]], "z": "エネルギー消費は酸素消費量から求める（酸素1L≒5kcal）。通常歩行は安静臥床の約4倍。毎分80mの歩行で酸素消費は体重1kgあたり毎分約11.5mL、エネルギー消費が最小。時速6kmを超えると急増する。PCI＝（歩行時心拍数－安静時心拍数）÷歩行速度で、健常者が好みの速さで歩くと最小（0.2〜0.4拍/m）。"}, {"id": "s6-23", "set": 6, "n": 23, "c": "歩行", "t": "歩行・異常歩行", "p": "p.208〜209", "r": "", "s": "異常歩行について正しいのはどれか。", "neg": false, "two": false, "o": [["大殿筋麻痺では立脚相に体幹を前方へ傾ける", "誤り。大殿筋麻痺では、股関節が前に折れるのを防ぐため、踵接地直後に体幹と骨盤を後方に引く。", 0], ["中殿筋麻痺では立脚相に頭部と体幹が健側へ傾く", "誤り。中殿筋麻痺では患側立脚相に反対側の骨盤が下がり（トレンデレンブルグ徴候）、代償として頭部と体幹が患側に傾く。", 0], ["大腿四頭筋の麻痺による異常は下り坂より上り坂で目立つ", "誤り。大腿四頭筋や足関節背屈筋など減速に関与する筋の麻痺は、下り坂で異常が出やすい。上り坂で目立つのは股関節伸筋など加速に関与する筋の麻痺。", 0], ["脚長差が3cm以上になると、短い側の立脚相でつま先立ちとなる", "正しい。脚長差が3cm以上になると短い側の肩・骨盤が下がり、立脚相でつま先立ちとなる。3cm以下では代償で目立たないことがある。", 1]], "z": "運動器疾患＝脚長差（3cm以上で短い側のつま先立ち）・股関節拘縮・膝関節拘縮・足関節拘縮（尖足で鶏状歩行）。疼痛＝逃避性歩行（患側の立脚相が短い）。末梢神経＝大殿筋麻痺（体幹と骨盤を後方へ）・中殿筋麻痺（トレンデレンブルグ歩行、体幹が患側へ）・大腿四頭筋麻痺（大腿前面を手で押さえる、反張膝）・前脛骨筋麻痺（鶏状歩行）。加速筋の麻痺は上り坂、減速筋の麻痺は下り坂で目立つ。筋疾患＝進行性筋ジストロフィーの動揺性歩行・登はん性起立。"}, {"id": "s6-24", "set": 6, "n": 24, "c": "発達学習", "t": "運動発達・小児の歩行", "p": "p.221", "r": "", "s": "歩き始めたころ（1歳〜1歳半）の小児の歩行の特徴で正しいのはどれか。", "neg": false, "two": false, "o": [["歩隔が狭い", "誤り。重心が相対的に高く不安定なため、左右の足の間隔を広くとって支持基底を広げる。", 0], ["足底全面で接地する", "正しい。成人のような踵からの接地がなく、足底全面で接地する。踵からの接地は2歳児で見られるようになる。", 1], ["上肢を左右交互に振る", "誤り。上肢は肩関節外転・肘関節屈曲位で高く挙上され（high guard）、交互の振りはない。", 0], ["歩行率が低い", "誤り。下肢が短く歩幅が小さいため、歩行率（ケイデンス）を相対的に高くして速度を保つ。", 0]], "z": "歩行開始期の特徴＝踵接地がなく足底全面で接地・股関節を外転して下肢を斜め前方に出す・支持基底が広い（前後には転倒しやすい）・上肢の振りがない（high guard→medium guard→no guardと短期間で変化）・歩行率が高い。2歳で踵からの接地、3歳で上肢の交互の振りなどが現れ、6歳で成人型歩行となる。"}, {"id": "s6-25", "set": 6, "n": 25, "c": "発達学習", "t": "運動学習・学習曲線と転移", "p": "p.228〜229", "r": "", "s": "運動学習について正しいのはどれか。", "neg": false, "two": false, "o": [["身体の一側で学習した技能は対側に転移しない", "誤り。一側の運動学習が対側に転移することはよく知られ、両側性転移（交差教育）という。手から足への転移もある。", 0], ["プラトーではパフォーマンスが大きく低下する", "誤り。プラトーは練習を繰り返してもパフォーマンスに変化が生じない、水平線に近い状態をいう。技能はわずかずつ向上を続けているとされる。", 0], ["以前の学習が後の学習を促進することを正の転移という", "正しい。前の学習が後の学習を促進するときを正の転移、妨害するときを負の転移という。", 1], ["外的動機づけのほうが内的動機づけより効果が持続する", "誤り。内的動機づけ（喜びや満足、自己実現）のほうが効果が持続的で、教育的にも好ましい。", 0]], "z": "学習曲線＝負の加速曲線（初期に大きく向上、容易な課題）・線形曲線・S型曲線・正の加速曲線（初期の向上が少ない、難しい課題）。プラトー（高原）＝パフォーマンスが変化しない水平に近い状態。動機づけ＝内的（持続的）と外的（報酬・賞賛）。転移＝正の転移・負の転移・両側性転移（理由：運動の流出・運動プログラム・認知学習）。記憶＝記銘・保持・想起の3過程、即時記憶（数秒）・短期記憶（数分）・長期記憶（数日〜数年）。学習の3相＝初期相（言語・運動段階）→中間相（運動段階、KRが重要）→最終相（自動化）。"}];

/* 分野（教科書の章順）と、ランダム25問の配分（本試験基準） */
const FIELDS=[["総論","運動学総論",2,1],["運動器","運動器の構造と機能",2,1],["感覚","運動感覚",2,1],["反射","反射と随意運動",2,1],["四肢体幹","四肢と体幹の運動",5,3],["姿勢","姿勢",2,1],["歩行","歩行",4,2],["発達学習","運動発達と運動学習",1,0]];
const FN=Object.fromEntries(FIELDS.map(f=>[f[0],f[1]]));
const FORD=Object.fromEntries(FIELDS.map((f,i)=>[f[0],i]));
const SETS=[...new Set(DATA.map(q=>q.set))].sort((a,b)=>a-b);
const KEY="undou_mock_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(st){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function corr(q){return q.o.map((x,i)=>x[2]?i:-1).filter(i=>i>=0);}
function head(ch,tt,pg,bar,showHome){$("hch").textContent=ch;$("htt").textContent=tt;$("pg").textContent=pg||"";$("bar").style.width=(bar||0)+"%";$("hbtn").style.display=showHome?"":"none";window.scrollTo(0,0);}

/* ===== 成績（累計）===== 記録：問題ごとに [解いた回数, 正解数, 最後に正解したか] */
function fieldStats(){const st=load(),r={};DATA.forEach(q=>{const s=st[q.id];if(!s)return;r[q.c]=r[q.c]||[0,0];r[q.c][0]+=s[0];r[q.c][1]+=s[1];});return r;}
function color(p){return p>=0.8?"#1f9d6b":p>=0.6?"#8db33a":p>=0.4?"#e0a020":"#d0483f";}
function fieldRows(stat,click){
  const rows=FIELDS.map(f=>[f[0],stat[f[0]]]).sort((a,b)=>{const pa=a[1]?a[1][1]/a[1][0]:2,pb=b[1]?b[1][1]/b[1][0]:2;return pa-pb||FORD[a[0]]-FORD[b[0]];});
  return rows.map(([c,s])=>{
    if(!s)return `<div class="frow none"><span class="nm">${c}</span><span class="tr"></span><span class="v">未回答</span></div>`;
    const p=s[1]/s[0];
    return `<div class="frow" onclick="${click}('${c}')"><span class="nm">${c}</span><span class="tr"><i style="width:${Math.max(p*100,3)}%;background:${color(p)}"></i></span><span class="v">${s[1]}/${s[0]}</span></div>`;}).join("");
}

   </div>
   <div class="sec">成績</div>
   <div class="menu"><button class="mode wide" onclick="weakPage('stat')"><div class="nm">分野別の正答率（累計）</div><div class="ds">これまでに解いた結果を、苦手な分野から順に表示</div></button></div>`;
  $("ctrl").innerHTML="";
}

/* ===== ランダム10問／20問：章の配分を守って抽選、同じ論点は重ねない、2つ選べは10問で1問・20問で2問まで ===== */
function startRandom(N){
  const maxTwo=N>=20?2:1;
  const used=new Set();let two=0;const pick=[];
  const pool=shuffle(DATA);
  const take=(q)=>{if(used.has(q.t)||pick.includes(q))return false;if(q.two&&two>=maxTwo)return false;pick.push(q);used.add(q.t);if(q.two)two++;return true;};
  FIELDS.forEach(([c,,n20,n10])=>{const n=N>=20?n20:n10;let k=0;for(const q of pool){if(k>=n)break;if(q.c===c&&take(q))k++;}});
  for(const q of pool){if(pick.length>=N)break;take(q);}
  pick.sort((a,b)=>FORD[a.c]-FORD[b.c]);
  startList(pick,"ランダム"+N+"問",true);
}

/* ===== 解く ===== */
let S=null;
function startList(list,title,record){S={list,title,record,i:0,score:0,miss:[],ans:[]};show();}
function qText(q){let s=esc(q.s);if(q.neg)s=s.replace(/(誤っている|でない|しない|含まれない|起こらない|されない)/,'<span class="em">$1</span>');if(q.two)s=s.replace("2つ選べ。",'<span class="em2">2つ選べ。</span>');return s;}
function show(){
  const q=S.list[S.i];S.sel=[];S.done=false;
  head(S.title,`問 ${S.i+1}`,`${S.i+1} / ${S.list.length}`,S.i/S.list.length*100,true);
  let m=`<span class="mark">${FN[q.c]}</span>`;if(q.neg)m+=`<span class="mark ng">否定形</span>`;if(q.two)m+=`<span class="mark two">2つ選べ</span>`;
  let h=`<div class="qnum">問${S.i+1}　${m}</div><div class="q">${qText(q)}</div><div class="opts">`;
  q.o.forEach((o,k)=>{h+=`<button class="opt" id="o${k}" onclick="tap(${k})"><span class="mk">${k+1}</span><span class="tx"><span>${esc(o[0])}</span><span class="ex" id="e${k}" style="display:none"></span></span></button>`;});
  h+=`</div><div id="after"></div>`;
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=q.two?`<button class="btn" id="go" onclick="judge()" disabled>2つ選んでください</button>`:`<button class="btn" id="go" onclick="next()" disabled>選択肢をタップ</button>`;
}
function tap(k){
  if(S.done)return;const q=S.list[S.i];
  if(!q.two){S.sel=[k];judge();return;}
  const at=S.sel.indexOf(k);if(at>=0)S.sel.splice(at,1);else{if(S.sel.length>=2)S.sel.shift();S.sel.push(k);}
  q.o.forEach((_,j)=>$("o"+j).classList.toggle("sel",S.sel.includes(j)));
  const g=$("go");g.disabled=S.sel.length<2;g.textContent=S.sel.length<2?"2つ選んでください":"解答する";
}
function judge(){
  const q=S.list[S.i],c=corr(q);S.done=true;
  const ok=c.length===S.sel.length&&c.every(x=>S.sel.includes(x));
  q.o.forEach((o,k)=>{const el=$("o"+k);el.classList.remove("sel");el.classList.add("dis");
    if(o[2])el.classList.add("correct");else if(S.sel.includes(k))el.classList.add("wrong");
    const e=$("e"+k);e.style.display="block";e.innerHTML=(o[2]?'<span class="ok-t">正答　</span>':'')+esc(o[1]);});
  if(ok)S.score++;else S.miss.push(q);
  S.ans.push([q,ok]);
  if(S.record){const st=load();const r=st[q.id]||[0,0,0];r[0]++;if(ok)r[1]++;r[2]=ok?1:0;st[q.id]=r;save(st);}
  $("after").innerHTML=`<div class="vd ${ok?"ok":"ng"}">${ok?"正解！":"不正解　正答は "+c.map(x=>x+1).join("・")}</div>
    <div class="z"><b>整理：</b>${esc(q.z)}</div><div class="meta">［${esc(q.t)}］【運動学】${esc(q.p)}${q.r?"　出題実績："+esc(q.r):""}</div>`;
  const g=$("go");g.onclick=next;g.disabled=false;g.textContent=S.i+1<S.list.length?"次の問題 ▶":"結果を見る ▶";
  $("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){if(S.i+1<S.list.length){S.i++;show();}else result();}
function result(){
  const n=S.list.length,stat={};
  S.ans.forEach(([q,ok])=>{stat[q.c]=stat[q.c]||[0,0];stat[q.c][0]++;if(ok)stat[q.c][1]++;});
  head(S.title,"結果","",100,true);
  const all=S.miss.length===0;
  $("bd").innerHTML=`<div class="center"><div>${esc(S.title)}${S.record?"":"（解き直し）"}</div><div class="big">${S.score} / ${n}</div>
    <div class="lead">${all?"全問正解です！":"間違えた問題は "+S.miss.length+" 問。解き直して全部正解にしましょう。"}</div></div>
    <div class="sec">今回の分野別（低い順）</div>${fieldRows(stat,"readField")}
    <p class="note">分野名をタップすると、その分野の解説を読めます。1セットでは1分野1〜3問なので、弱点は「分野別の正答率（累計）」で確認しましょう。</p>`;
  const lastMiss=S.miss;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>${all?"":`<button class="btn" id="retry">間違えた問題だけもう一度 ▶</button>`}`;
  if(!all)$("retry").onclick=()=>startList(lastMiss,"間違えた問題の解き直し",false);
}

/* ===== 分野別の正答率（累計）／分野を選んで解く ===== */
function weakPage(kind){
  const stat=fieldStats();
  head("分野別",kind==="stat"?"分野別の正答率（累計）":"分野を選んで解く","",0,true);
  let h=`<p class="lead">${kind==="stat"?"これまでに解いた全結果の累計です。苦手な分野が上に来ます。":"解きたい分野をタップしてください。苦手な分野が上に来ます。"}</p>${fieldRows(stat,kind==="stat"?"fieldMenu":"solveField")}`;
  if(kind==="solve"){h+=`<div class="sec">未回答も含めて分野を選ぶ</div><div class="chips">${FIELDS.map(f=>`<button class="chip" onclick="solveField('${f[0]}')">${f[0]}（${DATA.filter(q=>q.c===f[0]).length}）</button>`).join("")}</div>`;}
  else{h+=`<p class="note">分野名をタップすると、その分野を解くか解説を読むかを選べます。記録はこの端末のブラウザに保存されます（別の端末とは共有されません）。</p>`;}
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>${kind==="stat"?`<button class="btn sub" style="margin-left:auto" onclick="resetRec()">記録を消す</button>`:""}`;
}
function fieldMenu(c){
  const n=DATA.filter(q=>q.c===c).length;
  head("分野別",FN[c],"",0,true);
  $("bd").innerHTML=`<p class="lead">「${FN[c]}」の問題は ${n} 問あります。</p><div class="menu">
   <button class="mode" onclick="solveField('${c}')"><div class="nm">この分野を解く</div><div class="ds">${n}問をランダムな順で</div></button>
   <button class="mode" onclick="readField('${c}')"><div class="nm">解説を読む</div><div class="ds">全選択肢の解説と整理</div></button></div>`;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="weakPage('stat')">◀ 正答率へ戻る</button>`;
}
function solveField(c){startList(shuffle(DATA.filter(q=>q.c===c)),"分野別："+FN[c],true);}
function readField(c){readPage("field",c);}
function resetRec(){confirmBox();}
function confirmBox(){
  $("bd").innerHTML=`<p class="lead">これまでの記録をすべて消します。よろしいですか？</p>`;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="weakPage('stat')">やめる</button><button class="btn" style="background:#d0483f;border-color:#d0483f" onclick="try{localStorage.removeItem(KEY)}catch(e){};weakPage('stat')">消す</button>`;
}

/* ===== 解説を読む ===== */
let HIDE=false;
try{HIDE=localStorage.getItem(KEY+"_hide")==="1"}catch(e){}
function readPage(by,val){
  const list=by==="set"?DATA.filter(q=>q.set==val):DATA.filter(q=>q.c===val);
  head("解説を読む",by==="set"?"セット"+val:FN[val],list.length+"問",0,true);
  const tabs=by==="set"?SETS.map(s=>`<button class="chip ${s==val?"on":""}" onclick="readPage('set',${s})">セット${s}</button>`).join("")
    :FIELDS.map(f=>`<button class="chip ${f[0]===val?"on":""}" onclick="readPage('field','${f[0]}')">${f[0]}</button>`).join("");
  let h=`<div class="rsel"><button class="chip ${by==="set"?"on":""}" onclick="readPage('set',${SETS[0]})">セット別</button><button class="chip ${by==="field"?"on":""}" onclick="readPage('field','${FIELDS[0][0]}')">分野別</button></div>
   <div class="chips" style="margin-bottom:10px">${tabs}</div>
   <label class="sw"><input type="checkbox" ${HIDE?"checked":""} onchange="HIDE=this.checked;try{localStorage.setItem(KEY+'_hide',HIDE?'1':'0')}catch(e){};document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',HIDE))">答えを隠す（タップで1問ずつ開く）</label>`;
  if(!list.length)h+=`<p class="lead">この分野の問題はまだありません。</p>`;
  list.forEach(q=>{
    const c=corr(q);
    h+=`<div class="card ${HIDE?"hide":""}"><div class="qnum">セット${q.set} 問${q.n}　<span class="mark">${FN[q.c]}</span>${q.neg?'<span class="mark ng">否定形</span>':""}${q.two?'<span class="mark two">2つ選べ</span>':""}</div>
     <div class="q">${qText(q)}</div><div class="ansl">正答 ${c.map(x=>x+1).join("・")}</div>
     ${q.o.map((o,k)=>`<div class="ro ${o[2]?"c":""}"><span class="h">${k+1}．${esc(o[0])}</span><span class="e">${esc(o[1])}</span></div>`).join("")}
     <button class="btn sub reveal" onclick="this.closest('.card').classList.remove('hide')">答えと解説を見る</button>
     <div class="z"><b>整理：</b>${esc(q.z)}</div><div class="meta">［${esc(q.t)}］【運動学】${esc(q.p)}${q.r?"　出題実績："+esc(q.r):""}</div></div>`;});
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>`;
}
home();
</script>
