<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運動学 第8章L 顔面および頭部の運動</title>
<style>
:root{
  --main:#7a2a3a; --main-dark:#5a1c28; --main-light:#a8556a; --accent:#c8a24a;
  --bg:#f7f4f2; --card:#ffffff; --text:#2c2724; --sub:#6b625e; --line:#e2d9d5;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;-webkit-text-size-adjust:100%;}
header{background:var(--main);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
header .ch{font-size:12px;letter-spacing:.12em;opacity:.85;}
header .ttl{font-size:15px;font-weight:700;}
header .count{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;opacity:.9;}
main{flex:1;display:flex;justify-content:center;padding:18px 14px 8px;}
.slide{width:100%;max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:26px 28px 30px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.slide{animation:none;}}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--main);background:#f3e9eb;border-radius:20px;padding:4px 12px;margin-bottom:12px;font-weight:700;}
h2{font-size:23px;line-height:1.4;color:var(--main-dark);border-bottom:3px solid var(--main);padding-bottom:9px;margin-bottom:18px;}
ul{list-style:none;}
li{position:relative;padding-left:20px;margin-bottom:11px;line-height:1.85;font-size:16px;}
li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:8px;border-radius:2px;background:var(--main-light);}
li ul{margin-top:8px;}
li li{font-size:15px;color:var(--sub);margin-bottom:6px;}
li li::before{background:var(--line);width:6px;height:6px;top:.75em;}
.note{margin-top:16px;padding:11px 14px;font-size:13.5px;line-height:1.75;background:#faf6ee;border-left:4px solid var(--accent);border-radius:0 6px 6px 0;color:#5c4f38;}
.note b{color:#8a6a20;}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;line-height:1.7;vertical-align:top;}
th{background:var(--main);color:#fff;font-weight:700;white-space:nowrap;}
tbody tr:nth-child(even){background:#faf7f7;}
table.matrix{min-width:900px;font-size:12.5px;text-align:center;}
table.matrix td{text-align:center;padding:5px 2px;}
table.matrix td:first-child{text-align:left;white-space:nowrap;font-weight:700;background:#f7f1f2;padding:5px 8px;}
table.matrix th{padding:6px 2px;text-align:center;font-size:11.5px;}
table.matrix th.grp{background:var(--main-dark);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.col{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.col h4{background:var(--main);color:#fff;font-size:15px;padding:9px 12px;}
.col.alt h4{background:var(--main-light);}
.col .body{padding:12px 14px;}
.col li{font-size:15px;margin-bottom:9px;}
@media(max-width:640px){.two{grid-template-columns:1fr;}}
.blank{display:inline-block;min-width:4.2em;text-align:center;padding:1px 8px;margin:0 1px;cursor:pointer;user-select:none;background:#f0e6e8;color:transparent;border-bottom:2px dashed var(--main-light);border-radius:4px;transition:background .15s,color .15s;}
.blank:hover{background:#e5d5d9;}
.blank:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.blank.open{background:transparent;color:var(--main-dark);font-weight:700;border-bottom:2px solid var(--accent);cursor:default;}
.blank.hint{animation:pulse .9s ease;}
@keyframes pulse{0%,100%{background:#f0e6e8;}50%{background:var(--accent);}}
@media (prefers-reduced-motion:reduce){.blank.hint{animation:none;}}
table.matrix .blank{min-width:2em;padding:1px 3px;}
.cover{text-align:center;padding:48px 20px;}
.cover .sub{font-size:14px;letter-spacing:.2em;color:var(--main-light);margin-bottom:14px;}
.cover h1{font-size:32px;color:var(--main-dark);line-height:1.4;margin-bottom:10px;}
.cover .en{font-size:13px;color:var(--sub);letter-spacing:.08em;margin-bottom:26px;}
.cover .idx{display:inline-block;text-align:left;background:#faf7f7;border:1px solid var(--line);border-radius:10px;padding:16px 22px;font-size:15px;line-height:2;}
.cover .idx b{color:var(--main);}
footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px 14px;}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.tools button{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--main);background:#fff;color:var(--main);padding:8px 15px;border-radius:22px;transition:.15s;}
.tools button:hover{background:var(--main);color:#fff;}
.tools button.primary{background:var(--main);color:#fff;}
.tools button.primary:hover{background:var(--main-dark);border-color:var(--main-dark);}
.tools button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;}
.nav button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:var(--main);color:#fff;width:40px;height:40px;border-radius:50%;}
.nav button:disabled{background:#cfc5c2;cursor:default;}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:520px;}
.dot{width:9px;height:9px;border-radius:50%;background:#d5cac7;border:none;padding:0;cursor:pointer;}
.dot.active{background:var(--main);transform:scale(1.35);}
.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style></head>

  <div>
    <div class="ch">運動学 CHAPTER 8</div>

<script>
const SLIDES = [

{type:"cover", title:"顔面および頭部の運動", en:"Movement of the Face and Head",
 sub:"第8章 四肢と体幹の運動 L",
 index:["<b>1.</b> 頭蓋骨（脳頭蓋・顔面頭蓋）","<b>2.</b> 顎関節","<b>3.</b> 頭部の筋 a 顔面筋（表情筋）","<b>4.</b> 頭部の筋 b 咀嚼筋"]},

/* ---------- 1 頭蓋骨 ---------- */
{type:"p", eyebrow:"1 頭蓋骨", title:"頭蓋骨の構成",
 items:[
  "頭蓋骨は[[脳髄]]を包む[[脳頭蓋]]と、[[感覚]]、[[消化]]、[[呼吸器]]を保護する[[顔面頭蓋]]からなる",
  "<b>脳頭蓋</b>：[[5]]種[[7]]個の骨からなる",
  "<b>顔面頭蓋</b>：[[10]]種[[16]]個の骨からなる",
  "頭蓋骨の連結の[[大部分]]は[[縫合]]で、一部に[[軟骨結合]]と[[骨結合]]がある"
 ],
 note:"<b>「5種7個／10種16個」で覚える：</b>種類の数と個数がずれるのは、<b>対（2個ずつ）になる骨</b>があるからです。脳頭蓋では頭頂骨と側頭骨の2種が対になるので5種＋2＝7個になります。"},

{type:"tbl", eyebrow:"1 頭蓋骨", title:"脳頭蓋と顔面頭蓋を構成する骨",
 lead:"（　）内は[[個数]]です。[[対]]になる骨は[[2]]個と数えます。",
 head:["区分","骨（個数）","合計"],
 rows:[
  ["<b>脳頭蓋</b>","[[後頭骨]]（1）、[[前頭骨]]（1）、[[頭頂骨]]（2）、[[蝶形骨]]（1）、[[側頭骨]]（2）","[[5]]種[[7]]個"],
  ["<b>顔面頭蓋</b>","[[篩骨]]（1）、[[下鼻甲介]]（2）、[[涙骨]]（2）、[[鼻骨]]（2）、[[鋤骨]]（1）、[[上顎骨]]（2）、[[口蓋骨]]（2）、[[頬骨]]（2）、[[下顎骨]]（1）、[[舌骨]]（1）","[[10]]種[[16]]個"]],
 note:"<b>単数の骨に注目：</b>脳頭蓋で単数は<b>後頭骨・前頭骨・蝶形骨</b>、顔面頭蓋で単数は<b>篩骨・鋤骨・下顎骨・舌骨</b>。いずれも<b>正中に位置する骨</b>です。左右に分かれてつくられる骨は対になる、と理解すると暗記が減ります。"},

/* ---------- 2 顎関節 ---------- */
{type:"p", eyebrow:"2 顎関節", title:"顎関節の構造",
 items:[
  "顎関節は[[頭蓋]]における[[唯一]]の[[可動関節]]である",
  "[[下顎骨]]の[[下顎頭]]と、[[側頭骨]]の[[下顎窩]]および[[関節結節]]とのあいだの[[楕円関節]]である",
  "[[関節円板]]が存在する",
  "[[関節包]]は[[緩く]]、これを補強する[[外側靱帯]]、[[蝶下顎靱帯]]、[[茎突下顎靱帯]]がある"
 ],
 note:"<b>関節包が緩いのは大きく開けるため：</b>そのぶん外れやすく、<b>顎関節脱臼（あくび・大笑いで起こる）</b>は柔道整復の現場で扱う代表的な脱臼です。関節円板が関節を上下2室に分けている点も、次の運動の話につながります。"},

{type:"p", eyebrow:"2 顎関節", title:"顎関節の運動",
 items:[
  "顎関節の運動は[[左右同時]]に働いて[[蝶番運動]]を行うが、わずかに[[側屈]]・[[回旋運動]]も可能である",
  "<b>蝶番運動</b>は[[関節円板]]と[[下顎頭]]のあいだで起こる",
  "<b>回旋および前後の水平運動</b>は[[下顎窩]]と[[関節円板]]のあいだで起こる"
 ],
 note:"<b>関節円板が「上下2階建て」をつくる：</b><b>下の部屋（円板—下顎頭）＝開閉（蝶番）</b>、<b>上の部屋（下顎窩—円板）＝すべり（前後・回旋）</b>。大きく口を開けるときは、まず下で回り、続いて上で前へすべる、という2段階で動きます。"},

/* ---------- 3 顔面筋 ---------- */
{type:"two", eyebrow:"3 頭部の筋", title:"頭部の筋の区分（図8-136）",
 lead:"頭部の筋は[[顔面筋]]（[[浅頭筋]]）と[[咀嚼筋]]（[[深頭筋]]）に区分されます。",
 left:{h:"顔面筋（浅頭筋）", items:[
   "主として顔面の[[皮下]]に存在する",
   "[[骨]]から起こって[[皮膚]]に停止する[[皮筋]]である",
   "[[眼]]、[[耳]]、[[鼻]]、[[口]]などの[[開口部]]の[[開閉]]のために発達した",
   "[[言葉]]を話し、豊かな[[表情]]を表すように[[機能分化]]したものである",
   "顔面筋（[[表情筋]]）はすべて[[顔面神経]]の支配をうける"]},
 right:{h:"咀嚼筋（深頭筋）", items:[
   "すべて[[頭蓋]]から起こって[[下顎骨]]に停止する",
   "おもに[[下顎骨の挙上]]（口を閉じ、かみしめる）を行う",
   "[[下顎神経]]（[[三叉神経第3枝]]）の支配をうける",
   "下顎を下に引いて[[開口]]させるのは[[顎二腹筋]]や[[頤舌骨筋]]である"]},
 note:"<b>神経で二分される：</b><b>表情筋＝顔面神経（Ⅶ）</b>、<b>咀嚼筋＝三叉神経第3枝（Ⅴ₃）</b>。顔面神経麻痺で「表情はつくれないが、かむことはできる」のはこのためです。国家試験で最も問われる対比のひとつです。"},

{type:"tbl", eyebrow:"3 顔面筋", title:"①頭蓋表面と耳介の筋（図8-137 A〜F）",
 head:["記号","筋名","作用"],
 rows:[
  ["A","[[後頭前頭筋]]—[[前頭筋]]","[[額]]の皮膚に[[横]]にひだをつくり、[[眉]]を上げる"],
  ["B","[[後頭前頭筋]]—[[後頭筋]]","[[帽状腱膜]]を[[後方]]に引き、[[額]]を滑らかにする"],
  ["C","[[側頭頭頂筋]]","[[帽状腱膜]]を[[横]]に張る"],
  ["D","[[後耳介筋]]","[[耳介]]を[[後方]]に引く"],
  ["E","[[前耳介筋]]","[[耳介]]を[[前方]]に引く"],
  ["F","[[上耳介筋]]","[[耳介]]を[[上方]]に引く"]],
 note:"<b>耳介の3筋は退化：</b>後・前・上耳介筋とも、<b>人間では退化してほとんど耳介を動かすことはできません</b>。動物が音の方向へ耳を向ける機能の名残です。前頭筋と後頭筋は<b>帽状腱膜</b>を介して1つの筋（後頭前頭筋）としてつながっています。"},

{type:"tbl", eyebrow:"3 顔面筋", title:"②眼裂周囲の筋（G〜J）",
 head:["記号","筋名","作用"],
 rows:[
  ["G","[[皺眉筋]]","[[眉]]を[[内下方]]に引き、左右[[眉間]]に[[縦]]のひだをつくる"],
  ["H","[[眉毛下制筋]]","[[眉毛]]を[[下]]に引く"],
  ["I","[[鼻根筋]]","[[眉間]]の皮膚を[[引き下げ]]、[[鼻根]]にひだをつくる"],
  ["J","[[眼輪筋]]","<b>眼瞼部</b>：[[眼裂を閉じる]]<br><b>眼窩部</b>：[[眼裂を強く閉じる]]<br><b>涙腺部</b>：[[涙嚢]]をひろげて[[涙]]を吸い込ませる"]],
  note:"<b>眼輪筋は3部で役割分担：</b><b>眼瞼部＝まばたき（軽く閉じる）</b>、<b>眼窩部＝ぎゅっと閉じる</b>、<b>涙腺部＝涙を鼻へ導くポンプ</b>。顔面神経麻痺で閉眼できなくなるのはこの筋の麻痺によるものです。"},

{type:"tbl", eyebrow:"3 顔面筋", title:"③鼻部の筋（K〜M）",
 head:["記号","筋名","作用"],
 rows:[
  ["K","[[鼻中隔下制筋]]","[[鼻中隔]]を[[引き下げ]]、[[鼻孔]]をひろげる"],
  ["L","[[鼻孔圧迫筋]]※","[[鼻孔]]を[[圧迫]]しせまくする"],
  ["M","[[鼻孔拡大筋]]※","[[鼻孔]]を[[外下方]]に引き[[鼻孔]]をひろげる"]],
 note:"<b>※</b>鼻部の筋（L）（M）は日本解剖学会監修『解剖学用語　改訂13版』には[[収録されていない]]名称です（脚注）。教科書の記載として押さえつつ、正式用語ではない点に注意しましょう。"},

{type:"tbl", eyebrow:"3 顔面筋", title:"④口裂周囲の筋（N〜S）",
 head:["記号","筋名","作用"],
 rows:[
  ["N","[[上唇鼻翼挙筋]]","この[[3]]筋は[[上唇]]を引き上げて、[[鼻翼]]を引き上げる。[[鼻唇溝]]を形成する"],
  ["O","[[上唇挙筋]]","（同上）"],
  ["P","[[小頬骨筋]]","（同上）"],
  ["Q","[[大頬骨筋]]","[[口角]]を[[引き上げる]]"],
  ["R","[[笑筋]]","[[口角]]を[[外方]]に引き、[[えくぼ]]をつくる"],
  ["S","[[頬筋]]","[[頬壁]]を形成し、これを[[歯列]]に押しつける。[[風船]]をふくらませるような強く空気を[[吹き出す]]ときに働く。また[[歯]]と[[頬壁]]のあいだにはさまった[[食物]]を追い出すときにも作用する"]],
 note:"<b>笑顔をつくる筋：</b><b>大頬骨筋（口角を上げる）</b>と<b>笑筋（口角を外に引く）</b>が代表格。頬筋は表情というより<b>咀嚼の補助</b>で、食物を歯の上に戻す働きをします（トランペット奏者の筋とも呼ばれます）。"},

{type:"tbl", eyebrow:"3 顔面筋", title:"⑤口裂周囲の筋（T〜Y）と広頸筋（Z）",
 head:["記号","筋名","作用"],
 rows:[
  ["T","[[口角挙筋]]","[[口角]]を[[引き上げる]]"],
  ["U","[[口輪筋]]","[[中心部]]の線維は口を[[軽く]]閉じ、[[周辺部]]は[[強く]]閉じるときに働く。また[[口笛]]を吹くときの口を[[とがらせる]]動作のときに働く"],
  ["V","[[下唇下制筋]]","[[下唇]]を[[外下方]]に引く"],
  ["W","[[口角下制筋]]","[[口角]]を[[引き下げる]]"],
  ["X","[[頤横筋]]","[[二重顎]]をつくる"],
  ["Y","[[頤筋]]","[[頤部]]の皮膚を[[引き上げて]]、[[下唇]]を[[突き出し]]、小さな[[窪み]]をつくる"],
  ["Z","[[広頸筋]]（顔面部）","[[下顎骨縁]]から[[第2肋骨]]あたりの皮膚につく。[[頸部]]および[[鎖骨下方]]の皮膚を[[引き上げて]][[筋膜]]を[[緊張]]させる"]],
  note:"<b>口輪筋は「上げる筋・下げる筋の集合点」：</b>口角挙筋・大頬骨筋（上げる）と口角下制筋・下唇下制筋（下げる）が口輪筋に集まり、綱引きのように口角の位置を決めます。<b>広頸筋だけは顔面を越えて胸部まで広がる皮筋</b>です。"},

/* ---------- 4 咀嚼筋 ---------- */
{type:"p", eyebrow:"4 咀嚼筋", title:"側頭筋と咬筋",
 items:[
  "<b>1）側頭筋</b>：[[側頭部]]から下顎骨の[[筋突起]]に至る筋である",
  "[[下顎骨]]を[[引き上げて]][[歯]]をかみあわせ、一部は下顎骨を[[後方]]へ引く",
  "歯を強くかみあわせたときに、[[側頭部]]にこの筋の[[緊張]]を触れる",
  "<b>2）咬筋</b>：[[頬骨弓]]から下顎骨の[[下顎角]]に至る[[四角形]]の筋で、咀嚼筋のうちで最も[[強力]]である",
  "[[両側同時]]に働くと[[下顎骨を引き上げ]]、[[片側]]だけ働けば下顎骨を[[反対側]]に移動させる",
  "[[内側]]・[[外側翼突筋]]との[[共同運動]]で、下顎骨を[[側方移動]]させ、[[咀嚼運動]]を行う"
 ],
 note:"<b>触れて確かめられる筋：</b>奥歯をかみしめると、こめかみで<b>側頭筋</b>、エラの上で<b>咬筋</b>がふくらむのが触れます。咀嚼筋は体積あたりの筋力が全身で最も強い筋群のひとつです。"},

{type:"p", eyebrow:"4 咀嚼筋", title:"外側翼突筋と内側翼突筋",
 items:[
  "<b>3）外側翼突筋</b>：[[側頭下窩]]から[[水平]]に[[後外方]]に走行して下顎骨の[[関節突起]]に停止する",

<script>
const slideEl=document.getElementById('slide');
const dotsEl=document.getElementById('dots');
let idx=0;
function blanks(t){return String(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<span class="blank" tabindex="0" role="button" aria-label="空欄">${a}</span>`);}
const li=arr=>arr.map(t=>`<li>${blanks(t)}</li>`).join('');
function render(){
  const s=SLIDES[idx];let h='';
  if(s.type==='cover'){
    h=`<div class="cover"><div class="sub">${s.sub}</div><h1>${s.title}</h1><div class="en">${s.en}</div><div class="idx">${s.index.join('<br>')}</div></div>`;
  }else{
    h+=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>`;
    if(s.lead) h+=`<p style="margin-bottom:14px;line-height:1.85;font-size:15.5px;">${blanks(s.lead)}</p>`;
    if(s.type==='p'){h+=`<ul>${li(s.items)}</ul>`;}
    else if(s.type==='tbl'){h+=`<div class="tblwrap"><table><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${blanks(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='mtx'){
      let th1='';
      if(s.groups){th1='<tr><th rowspan="2">筋</th>'+s.groups.map(g=>`<th class="grp" colspan="${g[1]}">${g[0]}</th>`).join('')+'</tr>';}
      h+=`<div class="tblwrap"><table class="matrix"><thead>${th1}<tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?c:(c?blanks('[['+c+']]'):'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='two'){
      h+=`<div class="two"><div class="col"><h4>${s.left.h}</h4><div class="body"><ul>${li(s.left.items)}</ul></div></div><div class="col alt"><h4>${s.right.h}</h4><div class="body"><ul>${li(s.right.items)}</ul></div></div></div>`;}
    if(s.note) h+=`<div class="note">${blanks(s.note)}</div>`;
  }
  slideEl.innerHTML=h;
  document.getElementById('cur').textContent=idx+1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  document.getElementById('prev').disabled=(idx===0);
  document.getElementById('next').disabled=(idx===SLIDES.length-1);
  slideEl.querySelectorAll('.blank').forEach(b=>{
    b.addEventListener('click',()=>b.classList.add('open'));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.classList.add('open');}});
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('tot').textContent=SLIDES.length;
SLIDES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`スライド${i+1}`);b.onclick=()=>{idx=i;render();};dotsEl.appendChild(b);});
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById('next').onclick=()=>{if(idx<SLIDES.length-1){idx++;render();}};
document.getElementById('btnNext').onclick=()=>{const b=slideEl.querySelector('.blank:not(.open)');if(b){b.classList.add('open','hint');setTimeout(()=>b.classList.remove('hint'),900);b.scrollIntoView({block:'center',behavior:'smooth'});}};
document.getElementById('btnAll').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.add('open'));
document.getElementById('btnReset').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.target.classList.contains('blank'))return;if(e.key==='ArrowRight'&&idx<SLIDES.length-1){idx++;render();}if(e.key==='ArrowLeft'&&idx>0){idx--;render();}});
render();
</script>
