<script>
const SLIDES = [

{type:"cover", title:"体幹と脊柱の運動", en:"Movement of the Trunk and Vertebral Column",
 sub:"第8章 四肢と体幹の運動 H",
 index:["<b>1.</b> 骨格（脊柱の区分）","<b>2.</b> 椎骨の構造","<b>3.</b> 脊柱の靱帯","<b>4.</b> 椎間円板","<b>5.</b> 脊柱の彎曲と運動","<b>6.</b> 脊髄神経"]},

/* ---------- 1 骨格 ---------- */
{type:"p", eyebrow:"1 骨格", title:"胴骨と脊柱の区分（図8-102、8-103）",
 items:[
  "人体の[[胴]]に属する骨を[[胴骨]]といい、[[32〜35]]個の[[椎骨]]、[[12]]対の[[肋骨]]および[[胸骨]]からなる",
  "椎骨は全体で[[脊柱]]を形成し、椎骨中の[[胸椎]]、[[肋骨]]、[[胸骨]]で[[胸郭]]を形成する",
  "<b>頸椎</b>：第1頸椎（[[C1]]）〜第7頸椎（[[C7]]）",
  "<b>胸椎</b>：第1胸椎（[[T1]]）〜第12胸椎（[[T12]]）",
  "<b>腰椎</b>：第1腰椎（[[L1]]）〜第5腰椎（[[L5]]）",
  "<b>仙椎</b>：第1仙椎（[[S1]]）〜第5仙椎（[[S5]]）（全体として[[1]]個の[[仙骨]]となる）",
  "<b>尾椎</b>：第1尾椎（[[Co1]]）〜第3〜第6尾椎（[[Co3〜Co6]]）（全体として[[尾骨]]という）",
  "頸椎から尾椎までの全脊柱の全長は[[身長]]の約[[47%]]に相当する"
 ],
 note:"<b>数で覚える：</b>7・12・5・5・3〜6。<b>頸7・胸12・腰5</b>の24個が可動部、仙椎と尾椎は癒合して1個ずつの骨になります。尾椎だけ個数に幅があるので「32〜35個」という総数になります。"},

/* ---------- 2 椎骨の構造 ---------- */
{type:"p", eyebrow:"2 椎骨の構造", title:"椎体と椎弓（図8-104）",
 items:[
  "椎骨は一般的には[[椎体]]と[[椎弓]]に分けられる",
  "そのあいだに[[椎孔]]（全体として[[脊柱管]]）を囲み、[[脊髄]]をおさめている",
  "<b>椎体</b>：椎骨の[[前部分]]で[[円柱形]]をなし、上・下面は[[椎間円板]]を介して隣接する椎骨に対している",
  "<b>椎弓</b>：椎骨の[[後部分]]で、[[椎弓根]]で椎体と連なる<ul><li>[[上・下関節突起]]、[[棘突起]]、[[横突起]]（[[頸椎]]・[[胸椎]]）、[[肋骨突起]]（[[腰椎]]）などがある</li></ul>",
  "関節突起はそれぞれ上下に隣接する椎骨の関節突起と[[平面関節]]を形成して連結する"
 ],
 note:"<b>前と後で役割が違う：</b><b>椎体＝荷重を支える柱</b>、<b>椎弓＝脊髄を守る屋根と動きをつくる突起</b>。横突起にあたるものが腰椎では「肋骨突起」と呼ばれる点が要注意です。"},

{type:"p", eyebrow:"2 椎骨の構造", title:"椎間孔と神経根",
 items:[
  "椎弓根の[[上縁]]・[[下縁]]をそれぞれ[[上椎切痕]]・[[下椎切痕]]といい、上下で[[椎間孔]]を形成する",
  "椎間孔は[[脊髄]]から出る[[神経根]]の通路となる",
  "椎間孔は[[頸椎]]と[[腰椎]]では大きい[[三角形]]で、[[胸椎]]では小さい[[円形]]をしている",
  "椎間孔を通る神経根の断面積は孔の[[20〜30%]]で、残りは[[血管]]、[[脂肪]]、[[リンパ管]]で占められる"
 ],
 note:"<b>臨床とつなげる：</b>神経根は椎間孔の<b>2〜3割しか占めていない</b>＝本来は余裕がある。この余裕が椎間板ヘルニアや骨棘で埋まると神経根症状（しびれ・放散痛）が出ます。"},

/* ---------- 3 靱帯 ---------- */
{type:"two", eyebrow:"3 脊柱の靱帯", title:"脊柱の靱帯（図8-105）",
 lead:"椎骨を連結する靱帯には、[[上下の椎骨を結ぶもの]]と[[上から下まで全体を通して結ぶもの]]の[[2]]種類があります。",
 left:{h:"上下椎骨間を結ぶもの", items:[
   "[[黄色靱帯]]",
   "[[横突間靱帯]]",
   "[[棘間靱帯]]"]},
 right:{h:"全体を通じて結ぶもの", items:[
   "[[前縦靱帯]]：[[後頭骨]]から[[仙骨]]まで椎体の[[前]]を走り、椎間円板と[[緩く]]結合する",
   "[[後縦靱帯]]：[[後頭骨]]から[[仙骨]]まで椎体の[[後]]を走り、椎間円板と[[強固]]に結合する",
   "[[項靱帯]]：[[後頭骨]]と[[第7頸椎棘突起]]を結ぶ",
   "[[棘上靱帯]]：項靱帯の続きとみなされるもので、[[第7頸椎棘突起]]から[[仙骨後面]]まで"]},
 note:"<b>前と後の違いが効いてくる：</b>前縦靱帯は椎間円板と<b>ゆるく</b>、後縦靱帯は<b>強固に</b>結合する。そして後縦靱帯は下位ほど幅が狭くなるため、<b>髄核は後外側へ脱出しやすい</b>——腰椎椎間板ヘルニアの好発方向の理由です。"},

/* ---------- 4 椎間円板 ---------- */
{type:"p", eyebrow:"4 椎間円板", title:"椎間円板の構造",
 items:[
  "椎間円板は[[椎体間]]にあって、[[線維輪]]と[[髄核]]からなる",
  "<b>線維輪</b>：交互に異なる方向に[[斜走]]する[[コラーゲン線維]]を多く含む[[結合組織性線維層]]からなり、上・下椎体と[[強固]]に結合する",
  "<b>髄核</b>：線維輪の[[中心]]にあり、[[ゼラチン様]]の[[半液状物質]]からなる",
  "髄核の成分は[[80%]]が[[水分]]で、残りは[[蛋白質]]、[[ムコ多糖類]]、[[コンドロイチン硫酸]]、[[ヒアルロン酸]]などである",
  "成人の椎間円板には[[血管]]、[[神経]]は[[存在しない]]"
 ],
 note:"<b>血管がないことの意味：</b>椎間円板は血流で栄養されず、<b>荷重と除荷による水分の出入り</b>で栄養をやりとりします。だから加齢や不動で変性が進み、いったん傷むと治りにくいのです。"},

{type:"p", eyebrow:"4 椎間円板", title:"椎間円板の機能と荷重",
 lead:"椎間円板の機能は次の[[3]]つです。",
 items:[
  "① 上下[[椎体]]の[[連結]]",
  "② 脊柱の[[可動性]]",
  "③ [[体重圧]]など機械的負荷の[[緩衝作用]]",
  "垂直加重力の[[3/4]]を[[髄核]]がうけ、残りの[[1/4]]を[[線維輪]]が負担する",
  "運動時には[[髄核]]が[[線維輪]]のなかでわずかに[[移動]]する",
  "髄核は[[加重]]によって[[水分の出納現象]]が起こる",
  "[[安静臥位]]と比較すると[[立位]]では全脊柱で約[[2cm]]の[[短縮]]が起こる",
  "脊柱のうちで最も大きな加重がかかり、さらに大きな可動性が必要なのは[[L5-S1]]間の椎間円板である<ul><li>ここは運動による障害や[[20歳]]ごろの早期から[[変性]]が起こりやすい</li></ul>"
 ],
 note:"<b>身長が朝夕で変わる理由：</b>立位で約2cm短縮＝日中の荷重で髄核から水分が抜けるため。夜に横になると戻ります。<b>L5-S1が最も傷みやすい</b>のは「最大の荷重＋最大の可動性」が同じ場所に集中するからです。"},

/* ---------- 5 彎曲と運動 ---------- */
{type:"p", eyebrow:"5 脊柱の彎曲と運動", title:"生理的彎曲と重心線",
 items:[
  "脊柱は[[前頭面]]ではほとんど[[直線]]である",
  "胸椎部で軽度[[右側彎]]が認められることがあるが、これは[[大動脈]]の存在と[[右利き]]による[[菱形筋]]と[[僧帽筋]]の筋緊張によるものである",
  "矢状面では①[[頸椎前彎]]、②[[胸椎後彎]]、③[[腰椎前彎]]、④[[仙・尾椎後彎]]の[[4]]つの[[生理的彎曲]]が認められる",
  "[[後彎要素]]は[[胎児期]]から存在し、[[第一次彎曲]]という",
  "前彎要素のうち[[頸椎前彎]]は[[首の坐り]]や[[坐位]]が可能となって形成され、[[腰椎前彎]]は[[立位]]・[[歩行]]が可能になってから増強され、これを[[第二次彎曲]]という",
  "成人の基本立位では、重心線は[[C1]]の前面から[[C6]]までは椎体のなかを通り、[[C7]]を出て各胸椎の[[前側]]を通って、[[L2〜L5]]の椎体内を通り[[仙骨上前縁]]の[[岬角]]に至り、ふたたび仙椎・尾椎の前側を通って[[骨盤内]]から[[足関節の前部]]に至る"
 ],
 note:"<b>発達でつながる：</b>胎児のときはCの字（後彎のみ）＝第一次彎曲。<b>首がすわる→頸椎前彎</b>、<b>立って歩く→腰椎前彎</b>が第二次彎曲。運動発達の節目がそのまま脊柱の形になります。"},

{type:"p", eyebrow:"5 脊柱の彎曲と運動", title:"脊柱の運動",
 items:[
  "脊柱は[[屈曲]]（[[前屈]]）、[[伸展]]（[[後屈]]）、[[側屈]]、[[回旋]]運動が可能で、[[3]]度の[[運動自由度]]をもつ",
  "脊柱の運動は[[股関節]]の運動を伴うことが多く、[[個人差]]も大きい",
  "個々の脊椎間の[[屈伸]]、[[側屈]]、[[回旋]]の可動域を[[表8-18]]に示す"
 ],
 note:"<b>体幹前屈の正体：</b>「立位体前屈」で測っているのは脊柱だけの動きではなく<b>脊柱＋股関節屈曲</b>。ハムストリングスが硬い人は脊柱が柔らかくても指が床に届きません。"},

{type:"mtx", eyebrow:"5 表8-18", title:"脊椎間の関節可動域 ①頸椎部",
 lead:"カッコ内は[[代表的数値]]。[[Oc]]＝[[後頭骨]]（occipital bone）の略。",
 groups:null,
 head:["部位","屈伸","側屈","回旋"],
 rows:[
  ["Oc〜C1","4〜33°（13°）","4〜14°（8°）","0°"],
  ["C1〜C2","2〜21（10）","0","22〜58（47）"],
  ["C2〜C3","5〜23（8）","11〜20（10）","6〜28（9）"],
  ["C3〜C4","7〜38（13）","9〜15（11）","10〜28（11）"],
  ["C4〜C5","8〜39（12）","0〜16（11）","10〜26（12）"],
  ["C5〜C6","4〜34（17）","0〜16（8）","8〜34（10）"],
  ["C6〜C7","1〜29（16）","0〜17（7）","6〜15（9）"],
  ["C7〜T1","4〜17（9）","0〜17（4）","5〜13（8）"]],
 note:"<b>ここがポイント：</b><b>C1〜C2（環軸関節）は回旋47°と突出し、側屈は0°</b>。逆に<b>Oc〜C1（環椎後頭関節）は回旋0°</b>で屈伸と側屈のみ。<b>「うなずくのはOc-C1、首をひねるのはC1-C2」</b>と役割がきれいに分かれています。<br><span style='font-size:12.5px'>（White et al. 1978）</span>"},

{type:"mtx", eyebrow:"5 表8-18", title:"脊椎間の関節可動域 ②胸椎・腰椎部",
 lead:"カッコ内は[[代表的数値]]。単位は[[度]]（°）。",
 groups:null,
 head:["部位","屈伸","側屈","回旋"],
 rows:[
  ["T1〜T2","3〜5（4）","6（6）","14（9）"],
  ["T2〜T3","3〜5（4）","5〜7（6）","4〜12（8）"],
  ["T3〜T4","2〜5（4）","3〜7（6）","5〜11（8）"],
  ["T4〜T5","2〜5（4）","5〜6（6）","4〜11（8）"],
  ["T5〜T6","3〜5（4）","5〜6（6）","5〜11（8）"],
  ["T6〜T7","2〜7（5）","6（6）","4〜11（8）"],
  ["T7〜T8","3〜8（6）","3〜8（6）","4〜11（8）"],
  ["T8〜T9","3〜8（6）","4〜7（6）","6〜7（7）"],
  ["T9〜T10","3〜8（6）","4〜7（6）","3〜5（4）"],
  ["T10〜T11","4〜14（9）","3〜10（7）","2〜3（2）"],
  ["T11〜T12","6〜20（12）","4〜13（9）","2〜3（2）"],
  ["T12〜L1","6〜20（12）","5〜10（8）","2〜3（2）"],

<script>
const slideEl=document.getElementById('slide');
const dotsEl=document.getElementById('dots');
let idx=0;
function blanks(t){return String(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<span class="blank" tabindex="0" role="button" aria-label="空欄">${a}</span>`);}
const li=arr=>arr.map(t=>`<li>${blanks(t)}</li>`).join('');
function render(){
  const s=SLIDES[idx];let h='';
  if(s.type==='cover'){
    h=`<div class="cover"><div class="sub">${s.sub}</div><h1>${s.title}</h1><div class="en">${s.en}</div><div class="idx">${s.index.join('<br>')}</div></div>`;
  }else{
    h+=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>`;
    if(s.lead) h+=`<p style="margin-bottom:14px;line-height:1.85;font-size:15.5px;">${blanks(s.lead)}</p>`;
    if(s.type==='p'){h+=`<ul>${li(s.items)}</ul>`;}
    else if(s.type==='tbl'){h+=`<div class="tblwrap"><table><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${blanks(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='mtx'){
      let th1='';
      if(s.groups){th1='<tr><th rowspan="2">筋</th>'+s.groups.map(g=>`<th class="grp" colspan="${g[1]}">${g[0]}</th>`).join('')+'</tr>';}
      h+=`<div class="tblwrap"><table class="matrix"><thead>${th1}<tr>${s.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?c:(c?blanks('[['+c+']]'):'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    else if(s.type==='two'){
      h+=`<div class="two"><div class="col"><h4>${s.left.h}</h4><div class="body"><ul>${li(s.left.items)}</ul></div></div><div class="col alt"><h4>${s.right.h}</h4><div class="body"><ul>${li(s.right.items)}</ul></div></div></div>`;}
    if(s.note) h+=`<div class="note">${blanks(s.note)}</div>`;
  }
  slideEl.innerHTML=h;
  document.getElementById('cur').textContent=idx+1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  document.getElementById('prev').disabled=(idx===0);
  document.getElementById('next').disabled=(idx===SLIDES.length-1);
  slideEl.querySelectorAll('.blank').forEach(b=>{
    b.addEventListener('click',()=>b.classList.add('open'));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.classList.add('open');}});
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('tot').textContent=SLIDES.length;
SLIDES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`スライド${i+1}`);b.onclick=()=>{idx=i;render();};dotsEl.appendChild(b);});
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById('next').onclick=()=>{if(idx<SLIDES.length-1){idx++;render();}};
document.getElementById('btnNext').onclick=()=>{const b=slideEl.querySelector('.blank:not(.open)');if(b){b.classList.add('open','hint');setTimeout(()=>b.classList.remove('hint'),900);b.scrollIntoView({block:'center',behavior:'smooth'});}};
document.getElementById('btnAll').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.add('open'));
document.getElementById('btnReset').onclick=()=>slideEl.querySelectorAll('.blank').forEach(b=>b.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.target.classList.contains('blank'))return;if(e.key==='ArrowRight'&&idx<SLIDES.length-1){idx++;render();}if(e.key==='ArrowLeft'&&idx>0){idx--;render();}});
render();
</script>
